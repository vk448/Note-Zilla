<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Note-Zilla Entry Form</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --accent: #0067c5;
      --muted: #6b6f76;
      --success: #15803d;
    }
    body {
      margin: 0;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      background: linear-gradient(180deg, #eef3ff 0%, var(--bg) 100%);
      padding: 28px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 760px;
      background: var(--card);
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(16,24,40,0.08);
      padding: 22px;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 8px 0;
    }
    p.lead {
      margin: 0 0 18px 0;
      color: var(--muted);
      font-size: 13px;
    }
    label {
      display:block;
      font-weight: 600;
      margin-top: 12px;
      font-size: 13px;
      color: #111827;
    }
    .row {
      display: flex;
      gap: 12px;
    }
    input[type="text"], select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #e6e9ef;
      font-size: 14px;
      box-sizing: border-box;
    }
    .controls {
      margin-top: 16px;
      display:flex;
      gap: 10px;
      align-items:center;
    }
    button.primary {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    button.ghost {
      background: transparent;
      border: 1px solid #e6e9ef;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
    }
    .status {
      margin-top: 12px;
      font-size: 14px;
      color: var(--muted);
    }
    .link-box {
      margin-top: 14px;
      padding: 10px;
      background: #f3faf7;
      border-radius: 8px;
      display:flex;
      gap: 8px;
      align-items:center;
      justify-content:space-between;
      border: 1px solid #e6f4ea;
    }
    .link-box .url {
      font-size: 13px;
      color: var(--success);
      word-break: break-all;
    }
    .small {
      font-size: 12px;
      color: var(--muted);
    }
    .flex-right { margin-left: auto; display:flex; gap:8px; }
    .hidden { display:none; }
  </style>
</head>
<body>

  <div class="container" role="main">
    <h1>Note-Zilla — Chapter Entry</h1>
    <p class="lead">Fill chapter details below. The form will generate a link (or use the direct link you paste) and save it to your Google Sheet.</p>

    <label for="chapter">Chapter Name</label>
    <input id="chapter" type="text" placeholder="e.g. Chapter 1: Introduction to Computers" />

    <div class="row" style="margin-top:8px;">
      <div style="flex:1;">
        <label for="subject">Subject</label>
        <select id="subject">
          <option>Science</option>
          <option>Maths</option>
          <option>Hindi</option>
          <option>Sanskrit</option>
          <option>English</option>
          <option>AI</option>
          <option>SST</option>
        </select>
      </div>

      <div style="flex:1;">
        <label for="folder">Folder (for URL)</label>
        <select id="folder">
          <option>Science</option>
          <option>Maths</option>
          <option>Hindi</option>
          <option>Sanskrit</option>
          <option>English</option>
          <option>AI</option>
          <option>SST</option>
        </select>
      </div>
    </div>

    <label for="pdf" style="margin-top:12px;">PDF Name (without .pdf)</label>
    <input id="pdf" type="text" placeholder="e.g. chapter_1_intro_or_notes_file" />

    <label for="direct_link" style="margin-top:12px;">Or Direct Link (paste if already uploaded)</label>
    <input id="direct_link" type="text" placeholder="https://drive.google.com/..., or https://your-site/path.pdf" />

    <div class="controls">
      <button class="primary" onclick="generateAndSave()">Generate & Save</button>
      <button class="ghost" onclick="clearForm()">Clear</button>

      <div class="flex-right" style="margin-left:auto;">
        <div class="small">Auto date:</div>
        <div id="autoDate" class="small" style="padding-left:8px; font-weight:600;"></div>
      </div>
    </div>

    <div id="status" class="status"></div>

    <div id="linkBox" class="link-box hidden" style="margin-top:10px;">
      <div>
        <div class="small">✅ Link</div>
        <div id="previewLink" class="url"></div>
      </div>
      <div class="flex-right">
        <button class="ghost" onclick="openLink()">Open</button>
        <button class="ghost" onclick="copyLink()">Copy</button>
      </div>
    </div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyRZo_3MZ8X4v-zzDZObCI6dFXMnq79isXOVpE8XH7s-TZ0OjxjzjyRYZP5Z4Yv_34A/exec";

    // Set auto date
    const today = new Date();
    const dd = String(today.getDate()).padStart(2,'0');
    const mm = String(today.getMonth()+1).padStart(2,'0');
    const yyyy = today.getFullYear();
    document.getElementById("autoDate").textContent = `${dd}-${mm}-${yyyy}`;

    function toSlug(text){
      return text.trim().replace(/\s+/g,'_').replace(/[^a-zA-Z0-9_\-]/g,'').toLowerCase();
    }

    async function generateAndSave() {
      const chapter = document.getElementById("chapter").value.trim();
      const subject = document.getElementById("subject").value.trim();
      const folder = document.getElementById("folder").value.trim().toLowerCase();
      const pdfRaw = document.getElementById("pdf").value.trim();
      const directLink = document.getElementById("direct_link").value.trim();

      if(!chapter){ alert("Enter Chapter Name"); return; }
      if(!pdfRaw && !directLink){ alert("Enter PDF Name or Direct Link"); return; }

      const pdfSlug = pdfRaw ? toSlug(pdfRaw) : toSlug(chapter);
      const generatedUrl = directLink || `https://note-zilla.netlify.app/${folder}/${pdfSlug}.pdf`;

      const params = new URLSearchParams({
        chapter_name: chapter,
        subject: subject,
        folder: folder,
        pdf_name: pdfSlug,
        link: generatedUrl,
        direct_link: directLink,
        date: new Date().toLocaleDateString()
      });

      document.getElementById("status").innerText = "Saving...";
      try{
        const res = await fetch(`${WEB_APP_URL}?${params.toString()}`);
        const json = await res.json();
        if(json.status==="success"){
          document.getElementById("status").innerText = "✅ Saved successfully!";
          document.getElementById("previewLink").innerText = generatedUrl;
          document.getElementById("linkBox").classList.remove("hidden");
        }else{
          document.getElementById("status").innerText = "❌ Error: "+json.message;
        }
      }catch(err){
        console.error(err);
        document.getElementById("status").innerText = "❌ Network or script error. Check console.";
      }
    }

    function clearForm(){
      document.getElementById("chapter").value="";
      document.getElementById("pdf").value="";
      document.getElementById("direct_link").value="";
      document.getElementById("subject").selectedIndex=0;
      document.getElementById("folder").selectedIndex=0;
      document.getElementById("status").innerText="";
      document.getElementById("linkBox").classList.add("hidden");
    }

    function openLink(){
      const url = document.getElementById("previewLink").innerText;
      if(url) window.open(url,"_blank");
    }

    function copyLink(){
      const url = document.getElementById("previewLink").innerText;
      if(!url) return;
      navigator.clipboard.writeText(url).then(()=> {
        document.getElementById("status").innerText="Link copied ✅";
      }).catch(()=> alert("Copy manually: "+url));
    }
  </script>

</body>
</html>
