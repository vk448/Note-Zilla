<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | NoteZilla</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: white;
      color: #1a1a1a;
      max-width: 420px;
      width: 100%;
      border-radius: 20px;
      padding: 40px 35px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .container::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 6px;
      background: linear-gradient(90deg, #203a43, #2c5364, #0f2027);
    }
    h1 { font-size: 2.4rem; color: #203a43; margin-bottom: 8px; }
    h2 { font-size: 1.4rem; color: #2c5364; margin-bottom: 25px; font-weight: 500; }

    .step { transition: all 0.5s ease; opacity: 1; transform: translateY(0); position: relative; z-index: 2; }
    .step.hidden { opacity: 0; transform: translateY(20px); pointer-events: none; position: absolute; width: 100%; }

    input {
      width: 100%; padding: 16px; margin: 12px 0; border: 2px solid #e0e0e0;
      border-radius: 12px; font-size: 16px; transition: all 0.3s;
    }
    input:focus { outline: none; border-color: #2c5364; box-shadow: 0 0 0 4px rgba(44,83,100,0.15); }

    button {
      width: 100%; padding: 16px; background: linear-gradient(135deg, #203a43, #2c5364);
      color: white; border: none; border-radius: 12px; font-size: 18px; font-weight: 600;
      cursor: pointer; margin: 15px 0; transition: all 0.3s;
    }
    button:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(32,58,67,0.3); }

    #msg { margin: 15px 0; padding: 12px; border-radius: 10px; font-weight: 600; min-height: 50px;
      display: flex; align-items: center; justify-content: center; gap: 10px; }
    .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }

    .back a { color: #2c5364; text-decoration: none; font-weight: 600; }
    .back a:hover { text-decoration: underline; }

    /* FULL SCREEN LOADER */
    #fullLoader {
      display: none;
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 32, 39, 0.98); backdrop-filter: blur(10px);
      z-index: 9999; justify-content: center; align-items: center;
      flex-direction: column; color: white; font-size: 1.5rem;
    }
    .loader-circle {
      width: 80px; height: 80px; border: 6px solid rgba(255,255,255,0.2);
      border-top: 6px solid #2c5364; border-radius: 50%;
      animation: spin 1.2s linear infinite; margin-bottom: 25px;
    }
    .loader-text {
      font-weight: 600; letter-spacing: 1px; text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- FULL SCREEN LOADER -->
  <div id="fullLoader">
    <div class="loader-circle"></div>
    <div class="loader-text">Sending OTP to your email...</div>
  </div>

  <div class="container">
    <h1>NoteZilla</h1>
    <h2>Forgot Password</h2>

    <div id="step1" class="step">
      <p style="color:#555;margin-bottom:20px;">We'll send a 6-digit code to your email</p>
      <input type="email" id="email" placeholder="Enter your registered email" required>
      <button id="sendBtn">Send OTP</button>
    </div>

    <div id="step2" class="step hidden">
      <p style="color:#555;margin-bottom:20px;">Check your email for the code</p>
      <input type="text" id="otp" placeholder="Enter 6-digit code" maxlength="6" inputmode="numeric">
      <button id="verifyBtn">Verify Code</button>
    </div>

    <div id="step3" class="step hidden">
      <p style="color:#555;margin-bottom:20px;">Create a strong new password</p>
      <input type="password" id="newPass" placeholder="New Password" minlength="6">
      <input type="password" id="confirmPass" placeholder="Confirm Password">
      <button id="resetBtn">Reset Password</button>
    </div>

    <div id="msg"></div>
    <div class="back"><a href="admin-login.html">Back to Login</a></div>
  </div>

  <!-- Firebase + EmailJS -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCVVqQnmO1Q83AucOqA5b5qUC4eo49sq6E",
      authDomain: "chat-box-e01e5.firebaseapp.com",
      databaseURL: "https://chat-box-e01e5-default-rtdb.firebaseio.com",
      projectId: "chat-box-e01e5",
      storageBucket: "chat-box-e01e5.firebasestorage.app",
      messagingSenderId: "597491149800",
      appId: "1:597491149800:web:7bd908925f70b62018125d"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    emailjs.init("XjSbu3DTfQtOBKW-l");

    let currentUserKey = "";
    const loader = document.getElementById("fullLoader");
    const msg = document.getElementById("msg");
    const steps = [document.getElementById("step1"), document.getElementById("step2"), document.getElementById("step3")];

    function showMsg(text, type = "info") {
      msg.innerHTML = text;
      msg.className = type;
    }

    function nextStep(n) {
      steps.forEach((s, i) => s.classList.toggle("hidden", i !== n));
    }

    // Auto load email from registration
    window.onload = () => {
      const params = new URLSearchParams(location.search);
      const email = params.get("email");
      if (email && email.includes("@")) {
        document.getElementById("email").value = email;
        showMsg("Email loaded! Ready to send OTP", "success");
      }
    };

    // SEND OTP WITH FULL LOADER
    document.getElementById("sendBtn").onclick = async () => {
      const email = document.getElementById("email").value.trim();
      if (!email || !email.includes("@")) return showMsg("Enter valid email", "error");

      // FULL LOADER DIKHAO
      loader.style.display = "flex";
      document.getElementById("sendBtn").disabled = true;

      try {
        const snap = await db.ref("admins").orderByChild("email").equalTo(email).once("value");
        if (!snap.exists()) throw new Error("Email not registered!");

        snap.forEach(child => currentUserKey = child.key);

        const otp = Math.floor(100000 + Math.random() * 900000);
        const expiry = Date.now() + 600000;

        await db.ref("admins/" + currentUserKey).update({ resetOTP: otp, resetExpiry: expiry });

        await emailjs.send("service_3p5ogj7", "template_kqox2bf", {
          to_email: email,
          passcode: otp
        });

        // LOADER HATAO + NEXT STEP
        loader.style.display = "none";
        showMsg("OTP sent successfully!", "success");
        nextStep(1);
        document.getElementById("otp").focus();

      } catch (err) {
        loader.style.display = "none";
        document.getElementById("sendBtn").disabled = false;
        showMsg(err.message || "Failed to send OTP", "error");
      }
    };

    // Baki steps same (verify + reset)
    document.getElementById("verifyBtn").onclick = async () => {
      const otp = document.getElementById("otp").value.trim();
      if (!/^\d{6}$/.test(otp)) return showMsg("Enter valid 6-digit code", "error");

      showMsg("Verifying...", "info");
      try {
        const snap = await db.ref("admins/" + currentUserKey).once("value");
        const user = snap.val();
        if (user.resetOTP == otp && user.resetExpiry > Date.now()) {
          showMsg("Verified!", "success");
          nextStep(2);
        } else {
          showMsg("Invalid or expired code", "error");
        }
      } catch (err) {
        showMsg("Verification failed", "error");
      }
    };

    document.getElementById("resetBtn").onclick = async () => {
      const p1 = document.getElementById("newPass").value;
      const p2 = document.getElementById("confirmPass").value;
      if (p1 !== p2) return showMsg("Passwords don't match!", "error");
      if (p1.length < 6) return showMsg("Password too short!", "error");

      loader.style.display = "flex";
      loader.querySelector(".loader-text").textContent = "Updating your password...";

      try {
        await db.ref("admins/" + currentUserKey).update({
          password: btoa(p1),
          resetOTP: null,
          resetExpiry: null
        });
        loader.style.display = "none";
        showMsg("Password changed successfully!", "success");
        setTimeout(() => {
          alert("Login with your new password!");
          window.location.href = "admin-login.html";
        }, 1500);
      } catch (err) {
        loader.style.display = "none";
        showMsg("Failed to update password", "error");
      }
    };

    // Enter key support
    document.addEventListener("keypress", e => {
      if (e.key === "Enter") {
        const btn = document.querySelector(".step:not(.hidden) button");
        btn && !btn.disabled && btn.click();
      }
    });
  </script>
</body>
</html>
