<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Reset | NoteZilla</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body{font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);color:white;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;}
    .box{background:#fff;color:#333;padding:50px;border-radius:25px;width:100%;max-width:480px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.6);}
    h1{font-size:2.3rem;color:#203a43;margin-bottom:15px;}
    input{width:100%;padding:16px;margin:15px 0;border-radius:12px;border:2px solid #ddd;font-size:16px;transition:0.3s;}
    input:focus{border-color:#2c5364;outline:none;box-shadow:0 0 12px rgba(44,83,100,0.4);}
    button{width:100%;padding:16px;background:#2c5364;color:white;border:none;border-radius:12px;font-size:1.3rem;cursor:pointer;margin-top:10px;}
    button:hover{background:#203a43;transform:scale(1.03);}
    .msg{margin-top:25px;font-size:1.2rem;line-height:1.6;}
    .success{color:#155724;background:#d4edda;padding:20px;border-radius:12px;}
    .error{color:#721c24;background:#f8d7da;padding:20px;border-radius:12px;}
  </style>
</head>
<body>
  <div class="box">
    <h1>NoteZilla</h1>
    <h2>Secure Password Reset</h2>
    <p>Enter OTP (sent to your email) and new password</p>

    <input type="text" id="otp" placeholder="6-Digit OTP" maxlength="6" required>
    <input type="password" id="newPass" placeholder="New Password" required minlength="6">
    <input type="password" id="confirmPass" placeholder="Confirm Password" required>

    <button onclick="verifyAndReset()">Verify OTP & Reset</button>

    <div id="msg" class="msg"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCVVqQnmO1Q83AucOqA5b5qUC4eo49sq6E",
      authDomain: "chat-box-e01e5.firebaseapp.com",
      databaseURL: "https://chat-box-e01e5-default-rtdb.firebaseio.com",
      projectId: "chat-box-e01e5",
      storageBucket: "chat-box-e01e5.firebasestorage.app",
      messagingSenderId: "597491149800",
      appId: "1:597491149800:web:7bd908925f70b62018125d",
      measurementId: "G-FJ6PKK2FNQ"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    if (!token) {
      document.getElementById("msg").innerHTML = `<div class="error">Invalid access! No token found.</div>`;
    }

    async function verifyAndReset() {
      const otp = document.getElementById("otp").value.trim();
      const newPass = document.getElementById("newPass").value;
      const confirmPass = document.getElementById("confirmPass").value;

      if (!otp || otp.length !== 6) {
        document.getElementById("msg").innerHTML = `<div class="error">Enter valid 6-digit OTP!</div>`;
        return;
      }
      if (newPass !== confirmPass || newPass.length < 6) {
        document.getElementById("msg").innerHTML = `<div class="error">Passwords don't match or too short!</div>`;
        return;
      }

      try {
        const snap = await db.ref("passwordResets").child(token).once("value");
        if (!snap.exists()) {
          document.getElementById("msg").innerHTML = `<div class="error">Invalid or expired link!</div>`;
          return;
        }

        const data = snap.val();
        if (data.otp !== otp) {
          document.getElementById("msg").innerHTML = `<div class="error">Wrong OTP!</div>`;
          return;
        }
        if (data.otpExpiry < Date.now()) {
          document.getElementById("msg").innerHTML = `<div class="error">OTP expired! Request new link.</div>`;
          await db.ref("passwordResets").child(token).remove();
          return;
        }

        // SUCCESS — Change Password
        await db.ref("admins").child(data.userId).update({ password: btoa(newPass) });
        await db.ref("passwordResets").child(token).remove();

        document.getElementById("msg").innerHTML = `
          <div class="success">
            Password changed successfully!<br><br>
            <a href="admin-panel.html" style="color:#155724;font-weight:700;text-decoration:underline;">
              ← Go to Login
            </a>
          </div>
        `;

      } catch (err) {
        document.getElementById("msg").innerHTML = `<div class="error">Error: ${err.message}</div>`;
      }
    }
  </script>
</body>
</html>
