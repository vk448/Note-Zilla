<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Student Links</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #2193b0, #6dd5ed);
      margin: 0;
      padding: 20px;
      color: #333;
    }
    h2 {
      text-align: center;
      color: white;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    th, td {
      padding: 12px 10px;
      border-bottom: 1px solid #ddd;
      text-align: center;
    }
    th {
      background: #0077b6;
      color: white;
    }
    input[type="text"] {
      width: 100%;
      padding: 5px;
      border-radius: 6px;
      border: 1px solid #aaa;
    }
    button {
      background: #28a745;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: #218838;
    }
    .updated {
      background: #d4edda;
    }
  </style>
</head>
<body>
  <h2>📘 Manage Student Notes Links</h2>
  <table id="studentTable">
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Class</th>
        <th>Link</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const scriptURL = "https://script.google.com/macros/s/AKfycbwbLe3Z4OGUFMjfYeqSZkm1kOmjbiucDUVWfWhU4-dvFUcpG-fKg9gpoPwgiJZDV2mi/exec"; // replace with your Web App URL

    async function loadStudents() {
      const res = await fetch(scriptURL);
      const students = await res.json();
      const tbody = document.querySelector("#studentTable tbody");
      tbody.innerHTML = "";

      students.forEach(s => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${s.name}</td>
          <td>${s.email}</td>
          <td>${s.class}</td>
          <td><input type="text" placeholder="Paste PDF Link" value="${s.link}"></td>
          <td><button onclick="updateLink('${s.email}', this)">Update</button></td>
        `;
        tbody.appendChild(row);
      });
    }

    async function updateLink(email, btn) {
      const row = btn.closest("tr");
      const link = row.querySelector("input").value.trim();

      if (!link) {
        alert("⚠️ Please enter a link first!");
        return;
      }

      btn.textContent = "Updating...";
      btn.disabled = true;

      try {
        const formData = new FormData();
        formData.append("action", "updateLink");
        formData.append("email", email);
        formData.append("link", link);

        const res = await fetch(scriptURL, { method: "POST", body: formData });
        const text = await res.text();

        row.classList.add("updated");
        btn.textContent = "✅ Updated";
      } catch (err) {
        alert("Error: " + err.message);
      }

      setTimeout(() => {
        btn.textContent = "Update";
        btn.disabled = false;
        row.classList.remove("updated");
      }, 2000);
    }

    loadStudents();
  </script>
</body>
</html>
