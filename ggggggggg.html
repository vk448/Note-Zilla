<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoteZilla - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #203a43;
      --accent: #4fc3f7;
      --danger: #e74c3c;
      --success: #27ae60;
      --warning: #f39c12;
    }
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
    body{
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      min-height:100vh;display:flex;justify-content:center;align-items:center;color:white;
    }
    .container{
      background:white;color:#333;padding:50px 40px;border-radius:22px;
      box-shadow:0 25px 70px rgba(0,0,0,0.6);width:90%;max-width:420px;text-align:center;
    }
    h1{font-size:2.8rem;color:var(--primary);margin-bottom:8px;font-weight:700;}
    h2{font-size:1.5rem;color:#555;margin-bottom:30px;}
    input{
      width:100%;padding:18px;margin:12px 0;border-radius:14px;
      border:2px solid #ddd;font-size:16px;transition:0.3s;
    }
    input:focus{
      border-color:var(--accent);outline:none;
      box-shadow:0 0 0 5px rgba(79,195,247,0.2);
    }
    button{
      width:100%;padding:18px;background:linear-gradient(135deg,var(--primary),#2c5364);
      color:white;border:none;border-radius:14px;font-size:1.3rem;font-weight:700;
      cursor:pointer;margin-top:10px;transition:0.3s;
    }
    button:hover{
      transform:translateY(-3px);box-shadow:0 15px 30px rgba(0,0,0,0.4);
    }
    #loader{
      display:none;position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:9999;
      color:white;justify-content:center;align-items:center;flex-direction:column;font-size:1.8rem;
    }
    .spinner{
      width:70px;height:70px;border:8px solid #ffffff33;
      border-top:8px solid var(--accent);border-radius:50%;
      animation:s 1s linear infinite;margin-bottom:20px;
    }
    @keyframes s{to{transform:rotate(360deg)}}

    .notice{margin-top:25px;color:#666;}
    .notice a{color:#2c5364;font-weight:600;text-decoration:none;}
    .notice a:hover{color:#1cc88a;text-decoration:underline;}

    /* Toast Messages */
    .toast-container{
      position:fixed;top:30px;right:30px;z-index:10000;
    }
    .toast{
      background:var(--success);color:white;padding:16px 28px;border-radius:12px;
      margin-bottom:12px;box-shadow:0 10px 30px rgba(0,0,0,0.4);
      font-weight:600;min-width:320px;display:flex;align-items:center;gap:14px;
      transform:translateX(120%);transition:transform 0.6s ease, opacity 0.6s ease;opacity:0;
    }
    .toast.show{
      transform:translateX(0);opacity:1;
    }
    .toast.error{background:var(--danger);}
    .toast.warning{background:var(--warning);}
    .toast i{font-size:1.5rem;}
  </style>
</head>
<body>

<div id="loader">
  <div class="spinner"></div>
  <div>Logging in...</div>
</div>

<div class="container">
  <h1>NoteZilla</h1>
  <h2>Admin Login</h2>
 
  <input type="text" id="loginInput" placeholder="Username or Email" autocomplete="off">
  <input type="password" id="password" placeholder="Password">
 
  <button onclick="login()">Login Now</button>
 
  <div class="notice">
    Not registered? <a href="admin-register.html">Register Here</a><br><br>
    <A href="reset-password.html">Forgot Password?</A>
  </div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toastBox"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCVVqQnmO1Q83AucOqA5b5qUC4eo49sq6E",
    authDomain: "chat-box-e01e5.firebaseapp.com",
    databaseURL: "https://chat-box-e01e5-default-rtdb.firebaseio.com",
    projectId: "chat-box-e01e5",
    storageBucket: "chat-box-e01e5.firebasestorage.app",
    messagingSenderId: "597491149800",
    appId: "1:597491149800:web:7bd908925f70b62018125d"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // Toast Function
  function showToast(message, type = "success") {
    const box = document.getElementById("toastBox");
    const toast = document.createElement("div");
    toast.classList.add("toast", type);

    const icons = { success: "Checkmark", error: "Cross", warning: "Warning" };
    toast.innerHTML = `${icons[type]} ${message}`;
    box.appendChild(toast);

    // Trigger animation
    setTimeout(() => toast.classList.add("show"), 100);

    // Remove after 4 seconds
    setTimeout(() => {
      toast.classList.remove("show");
      setTimeout(() => toast.remove(), 600);
    }, 4000);
  }

  async function login() {
    const input = document.getElementById("loginInput").value.trim().toLowerCase();
    const password = document.getElementById("password").value.trim();

    if (!input || !password) {
      showToast("Please fill both fields!", "error");
      return;
    }

    document.getElementById("loader").style.display = "flex";

    try {
      const snapshot = await db.ref("admins").once("value");
      let userFound = null;

      snapshot.forEach(child => {
        const u = child.val();
        if ((u.username?.toLowerCase() === input || u.email?.toLowerCase() === input)) {
          try {
            if (atob(u.password) === password) {
              userFound = { id: child.key, ...u };
            }
          } catch {
            if (u.password === password) {
              userFound = { id: child.key, ...u };
            }
          }
        }
      });

      if (!userFound) {
        showToast("Incorrect username/email or password!", "error");
        document.getElementById("loader").style.display = "none";
        return;
      }

      // Status Check
      if (userFound.status === "pending") {
        showToast("Your account is PENDING admin approval!", "warning");
      } else if (userFound.status === "rejected") {
        showToast("Your account was REJECTED by admin!", "error");
      } else {
        sessionStorage.setItem("adminUser", JSON.stringify(userFound));
        sessionStorage.setItem("userId", userFound.id);
        showToast(`Welcome back, ${userFound.fullName || userFound.username}!`, "success");
        setTimeout(() => {
          window.location.href = "admin-panel.html";
        }, 1500);
        return; // Important: Prevent loader hide below
      }

    } catch (error) {
      console.error(error);
      showToast("Connection failed! Check internet.", "error");
    }

    // Hide loader only if login failed
    document.getElementById("loader").style.display = "none";
  }

  // Press Enter to login
  document.addEventListener("keypress", e => {
    if (e.key === "Enter") login();
  });
</script>
</body>
</html>
