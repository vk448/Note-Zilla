<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maths - NoteZilla</title>
  <link rel="icon" href="../Images/Favicon.png">
  <meta name="google-site-verification" content="C2-yDbzzyS4qMdBWgM3WARN6saZ1KX7ndHrd_Uc38mg" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap');
    :root {
      --primary:#4e73df;
      --secondary:#1cc88a;
      --accent:#f6ad55;
      --bg:#f5f6fa;
      --text:#333;
    }

    * {margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
    body {background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;}

    /* HEADER */
    header {
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:15px 50px;
      background:#fff;
      box-shadow:0 4px 6px rgba(0,0,0,0.1);
      position:sticky;top:0;z-index:100;
    }
    .logo {
      font-weight:900;
      font-size:1.8rem;
      background:linear-gradient(90deg,var(--primary),var(--secondary));
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }
    nav {display:flex;align-items:center;gap:15px;}
    nav a {text-decoration:none;color:#333;font-weight:500;transition:color 0.2s;}
    nav a:hover {color:var(--primary);}
    .login-btn {
      background:var(--secondary);
      color:white;
      border:none;
      padding:8px 16px;
      border-radius:6px;
      cursor:pointer;
      font-weight:bold;
      transition:background 0.2s;
    }
    .login-btn:hover {background:#17a673;}
    .hamburger {display:none;flex-direction:column;cursor:pointer;gap:5px;}
    .hamburger div {width:25px;height:3px;background-color:#333;transition:all 0.3s;}
    @media(max-width:768px){
      nav{display:none;flex-direction:column;width:100%;gap:10px;margin-top:10px;}
      nav.active{display:flex;}
      .hamburger{display:flex;}
    }

    /* HERO */
    .hero {
      text-align:center;
      padding:80px 20px 50px;
      color:white;
      background:linear-gradient(120deg,rgba(78,115,223,0.8),rgba(28,200,138,0.8));
      border-radius:20px;
      margin:30px auto;
      width:90%;
      box-shadow:0 8px 20px rgba(0,0,0,0.2);
    }

    .hero h1 {
      font-size:3rem;
      font-weight:900;
      letter-spacing:1px;
    }
    .hero p {
      font-size:1.2rem;
      margin-top:10px;
      color:#f2f2f2;
    }

    /* SEARCH BAR */
    .search-container {
      display:flex;
      justify-content:center;
      margin:2rem auto;
      width:90%;
      max-width:600px;
    }
    .search-container input {
      width:100%;
      padding:12px 16px;
      border:2px solid var(--primary);
      border-radius:30px;
      font-size:1rem;
      outline:none;
      transition:0.3s;
    }
    .search-container input:focus {
      border-color:var(--secondary);
      box-shadow:0 0 8px var(--secondary);
    }

    /* SUBJECT CARDS */
    .subject-grid {
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:2rem;
      width:90%;
      margin:1rem auto 4rem;
    }
    .subject-card {
      background:#fff;
      border-radius:20px;
      box-shadow:0 5px 20px rgba(0,0,0,0.1);
      text-align:center;
      padding:2rem 1rem;
      transition:all 0.3s ease;
      cursor:pointer;
      position:relative;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      height:150px;
    }
    .subject-card::before {
      content:"";
      position:absolute;
      top:-50%;left:-50%;
      width:200%;height:200%;
      background:linear-gradient(120deg,var(--primary),var(--secondary));
      transform:rotate(45deg);
      opacity:0;
      transition:0.4s;
    }
    .subject-card:hover::before {opacity:0.15;}
    .subject-card:hover {
      transform:translateY(-5px) scale(1.03);
      box-shadow:0 8px 25px rgba(0,0,0,0.15);
    }

    .subject-card h2 {font-size:1.3rem;font-weight:700;color:var(--primary);z-index:1;}
    .subject-card p {font-size:0.9rem;color:#555;margin-top:0.5rem;z-index:1;}

    .loader {
      border:4px solid #f3f3f3;
      border-top:4px solid var(--primary);
      border-radius:50%;
      width:40px;height:40px;
      animation:spin 1s linear infinite;
      margin:0 auto;
    }
    @keyframes spin {0%{transform:rotate(0deg);}100%{transform:rotate(360deg);} }

    /* FOOTER */
    footer {
      background:#fff;
      color:#555;
      text-align:center;
      padding:1rem;
      font-size:0.9rem;
      box-shadow:0 -4px 6px rgba(0,0,0,0.05);
      border-radius:12px;
      margin-top:auto;
    }
    footer span {color:var(--primary);font-weight:600;}
  </style>
</head>
<body>

<header>
  <div class="logo">Note Zilla</div>
  <div class="hamburger" onclick="toggleMenu(this)"><div></div><div></div><div></div></div>
  <nav>
    <a href="../index.html">Home</a>
    <a href="#notes">Maths Notes</a>
    <a href="../credit.html">About</a>
    <a href="../contact.html">Contact</a>
    <button class="login-btn"><a href="../login.html" style="color:white;text-decoration:none;">Login</a></button>
  </nav>
</header>

<section class="hero">
  <h1>Maths Notes</h1>
  <p>All chapters and study materials for Class 9 SST</p>
</section>

<div class="search-container">
  <input type="text" id="searchBar" placeholder="🔍 Search chapters...">
</div>

<section class="subject-grid" id="subjectGrid">
  <div style="text-align:center;width:100%;padding:30px;">
    <div class="loader" style="margin-bottom:10px;"></div>
    <p>Loading notes...</p>
  </div>
</section>

<footer>
  © 2025 <span>NoteZilla</span> All Rights Reserved
</footer>

<script>
function toggleMenu(el){
  document.querySelector('nav').classList.toggle('active');
  el.classList.toggle('open');
}

const sheetURL = "https://script.google.com/macros/s/AKfycbx6Yi6nb-biO1Qw9pz3_1FvCwOQNLEQvi-TUIjdgsF7b9kf8FPgqsH9fIZ4n-neAVhn/exec";
const subjectName = "Maths";
const subjectGrid = document.getElementById("subjectGrid");

// Show cached data instantly if available
const cached = localStorage.getItem(`notes_${subjectName}`);
if (cached) renderNotes(JSON.parse(cached));
fetchData(); // Then fetch fresh data

async function fetchData() {
  try {
    const res = await fetch(sheetURL);
    const data = await res.json();
    const filtered = data.filter(d => d.Subject === subjectName);
    localStorage.setItem(`notes_${subjectName}`, JSON.stringify(filtered));
    renderNotes(filtered);
  } catch (err) {
    console.error("Failed to load:", err);
    subjectGrid.innerHTML = `<p style="text-align:center;color:red;">⚠️ Failed to load notes. Try again later.</p>`;
  }
}

function renderNotes(notes) {
  subjectGrid.innerHTML = "";
  if (!notes.length) {
    subjectGrid.innerHTML = `<p style="text-align:center;color:gray;">No chapters available.</p>`;
    return;
  }
  notes.forEach(chap => {
    const card = document.createElement("div");
    card.className = "subject-card";
    card.innerHTML = `<h2>${chap["Chapter Name"]}</h2><p>${chap.Date || ""}</p>`;
    card.addEventListener("click", () => {
      if (chap.Link?.trim()) window.open(chap.Link, "_blank");
      else alert("Link not available for this chapter.");
    });
    subjectGrid.appendChild(card);
  });
}

// Search Functionality
const searchBar = document.getElementById("searchBar");
searchBar.addEventListener("keyup", () => {
  const value = searchBar.value.toLowerCase();
  document.querySelectorAll(".subject-card").forEach(card => {
    const text = card.querySelector("h2")?.innerText.toLowerCase() || "";
    card.style.display = text.includes(value) ? "flex" : "none";
  });
});
</script>

<script src="../favicon.js"></script>
<script src="../Record.js"></script>

</body>
</html>
