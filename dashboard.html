<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Registered Users | NoteZilla</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
    body{background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);min-height:100vh;color:white;overflow-y:auto;overflow-x:hidden;}

    .header{text-align:center;padding:25px;background:rgba(255,255,255,0.1);border-bottom:2px solid #2c5364;}
    .header h1{font-size:2.5rem;margin-bottom:8px;}

    .stats{text-align:center;padding:25px;}
    .stats h2{font-size:3.5rem;}
    .stats p{font-size:1.3rem;color:#a0d8ef;}

    .user-list{max-width:900px;margin:20px auto;padding:20px;}

    .user-card{
      background:rgba(255,255,255,0.12);border-radius:15px;padding:18px;margin:15px 0;
      display:flex;align-items:center;gap:20px;transition:0.3s;border:1px solid rgba(255,255,255,0.1);
      position:relative;
    }
    .user-card:hover{transform:translateY(-5px);box-shadow:0 10px 30px rgba(0,0,0,0.5);}
    .user-card img{width:85px;height:85px;border-radius:50%;object-fit:cover;border:4px solid #2c5364;}

    .delete-btn{
      position:absolute;
      right:20px;
      top:20px;
      background:#e63946;
      border:none;
      padding:8px 17px;
      border-radius:8px;
      color:white;
      cursor:pointer;
      font-weight:600;
      transition:0.3s;
    }
    .delete-btn:hover{background:#ff4a5c;}

    .info h3{font-size:1.4rem;}
    .info p{margin:5px 0;color:#b0e0e6;}
    .role{background:#2c5364;padding:6px 14px;border-radius:20px;font-size:0.85rem;font-weight:600;}

    .password-field{
      background:#333;color:#fff;padding:8px 12px;border-radius:8px;
      font-family:monospace;letter-spacing:3px;cursor:pointer;font-size:1rem;
    }
    .password-field:hover{background:#555;}

    #loader{
      position:fixed;top:0;left:0;width:100%;height:100%;
      background:rgba(0,0,0,0.95);display:flex;justify-content:center;
      align-items:center;z-index:9999;flex-direction:column;color:white;font-size:1.6rem;
    }
    .spinner{
      width:70px;height:70px;border:10px solid rgba(255,255,255,0.3);
      border-top:10px solid white;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:25px;
    }
    @keyframes spin{to{transform:rotate(360deg)}}

    .toast{
      position:fixed;top:20px;left:50%;transform:translateX(-50%);
      padding:16px 40px;border-radius:12px;color:white;font-weight:600;
      z-index:10000;box-shadow:0 10px 30px rgba(0,0,0,0.4);opacity:0;
      animation:slideDown 0.5s ease forwards;font-size:1.1rem;
    }
    .toast.success{background:#28a745;}
    .toast.error{background:#dc3545;}

    @keyframes slideDown{from{opacity:0;transform:translateX(-50%) translateY(-50px);}to{opacity:1;transform:translateX(-50%) translateY(0)}}
    @keyframes slideUp{to{opacity:0;transform:translateX(-50%) translateY(-50px)}}
  </style>
</head>
<body>

<div id="loader">
  <div class="spinner"></div>
  <div>Loading...</div>
</div>

<div class="header">
  <h1>NoteZilla</h1>
  <p>All Registered Users</p>
</div>

<div class="stats">
  <h2 id="totalUsers">0</h2>
  <p>Total Users Registered</p>
</div>

<div class="user-list" id="userList"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<!-- EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCVVqQnmO1Q83AucOqA5b5qUC4eo49sq6E",
    authDomain: "chat-box-e01e5.firebaseapp.com",
    databaseURL: "https://chat-box-e01e5-default-rtdb.firebaseio.com",
    projectId: "chat-box-e01e5",
    storageBucket: "chat-box-e01e5.firebasestorage.app",
    messagingSenderId: "597491149800",
    appId: "1:597491149800:web:7bd908925f70b62018125d"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // EmailJS Init
  emailjs.init("XjSbu3DTfQtOBKW-l");

  const userList = document.getElementById("userList");
  const totalUsers = document.getElementById("totalUsers");

  function toast(text, type="success"){
    const t=document.createElement("div");
    t.className=`toast ${type}`;
    t.innerHTML=text;
    document.body.appendChild(t);
    setTimeout(()=>{t.style.animation="slideUp 0.5s ease forwards";
      setTimeout(()=>t.remove(),500);
    },4000);
  }

  window.onload = () => loadUsers();

  function loadUsers(){
    db.ref("admins").once("value").then(snapshot=>{
      document.getElementById("loader").style.display="none";

      const total = snapshot.numChildren();
      totalUsers.textContent = total;

      let html="";
      snapshot.forEach(child=>{
        const u = child.val();
        const photo = u.photoURL || `https://api.dicebear.com/7.x/avataaars/svg?seed=${u.username}`;
        const password = atob(u.password || "");

        html += `
          <div class="user-card">
            <img src="${photo}">
            <div class="info">
              <h3>${u.fullName}</h3>
              <p><strong>@${u.username}</strong> • ${u.email}</p>
              <p>Phone: ${u.phone}</p>
              <p>Joined: ${new Date(u.createdAt).toLocaleDateString()}</p>
              <p>Password: <span class="password-field">${password}</span></p>
              <span class="role">${u.role}</span>
            </div>

            <button class="delete-btn"
              onclick="deleteAdmin('${child.key}', '${u.email}', '${u.fullName}')">
              Delete
            </button>
          </div>
        `;
      });

      userList.innerHTML = html;

    }).catch(err=>{
      document.getElementById("loader").style.display="none";
      userList.innerHTML=`<p style="color:red;text-align:center;">Error: ${err.message}</p>`;
    });
  }

  // DELETE + EMAIL
  function deleteAdmin(adminId, adminEmail, adminName){

    if(!confirm(`Are you sure you want to remove ${adminName}?`)) return;

    firebase.database().ref("admins/" + adminId).remove()
      .then(()=>{

        toast("Admin removed successfully!", "success");

        // SEND EMAIL
        emailjs.send("service_3p5ogj7", "template_vwvn4hn", {
          to_name: adminName,
          to_email: adminEmail,
          message: `${adminName}, your NoteZilla admin access has been removed.`
        })
        .then(()=> toast("Email sent successfully!", "success"))
        .catch(err => toast("Email failed: " + err.text, "error"));

        loadUsers();
      })
      .catch(err => toast("Delete error: " + err.message, "error"));
  }
</script>

</body>
</html>
