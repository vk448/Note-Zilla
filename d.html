<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Give Notice</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --gray-100: #f8fafc;
      --gray-200: #e2e8f0;
      --gray-700: #334155;
      --gray-900: #0f172a;
      --success: #10b981;
      --danger: #ef4444;
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1);
      --radius: 12px;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding:20px;
      color:var(--gray-900);
    }
    .container {
      max-width:500px;
      margin:40px auto;
      background:white;
      border-radius:var(--radius);
      overflow:hidden;
      box-shadow:var(--shadow-lg);
    }
    header {
      background:var(--primary);
      color:white;
      padding:2rem;
      text-align:center;
    }
    header h1 { font-size:1.8rem; font-weight:600; margin-bottom:.5rem; }
    header p { opacity:0.9; font-size:0.95rem; }
    .form-container { padding:2rem; }
    .form-group { margin-bottom:1.5rem; }
    label {
      display:block;
      margin-bottom:.5rem;
      font-weight:500;
      color:var(--gray-700);
      font-size:0.95rem;
    }
    input, textarea {
      width:100%;
      padding:.9rem 1rem;
      border:2px solid var(--gray-200);
      border-radius:var(--radius);
      font-size:inherit;
      transition:all .3s ease;
    }
    input:focus, textarea:focus {
      outline:none;
      border-color:var(--primary);
      box-shadow:0 0 0 4px rgba(37,99,235,.15);
    }
    textarea { min-height:140px; resize:vertical; }
    .btn {
      background:var(--primary);
      color:white;
      border:none;
      padding:.9rem 1.5rem;
      font-size:1.05rem;
      font-weight:600;
      border-radius:var(--radius);
      cursor:pointer;
      width:100%;
      transition:background .3s ease, transform .2s;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:.5rem;
    }
    .btn:hover { background:var(--primary-dark); transform:translateY(-2px); }
    .alert {
      padding:1rem;
      border-radius:var(--radius);
      margin-bottom:1rem;
      font-weight:500;
      text-align:center;
      display:none;
    }
    .alert.success { background:#d1fae5; color:#065f46; border:1px solid #a7f3d0; }
    .alert.error   { background:#fee2e2; color:#991b1b; border:1px solid #fca5a5; }
    footer {
      text-align:center;
      padding:1.5rem;
      background:var(--gray-100);
      color:var(--gray-700);
      font-size:.875rem;
    }
    @media (max-width:480px) {
      .container { margin:20px auto; }
      header, .form-container { padding:1.5rem; }
      header h1 { font-size:1.6rem; }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Notice Board</h1>
    <p>Submit an official notice for everyone to see</p>
  </header>

  <div class="form-container">
    <div id="alert" class="alert"></div>

    <div class="form-group">
      <label for="name">Your Name *</label>
      <input type="text" id="name" placeholder="e.g. John Doe" required />
    </div>

    <div class="form-group">
      <label for="title">Notice Title *</label>
      <input type="text" id="title" placeholder="e.g. Meeting Tomorrow at 3 PM" required />
    </div>

    <div class="form-group">
      <label for="notice">Notice Details *</label>
      <textarea id="notice" placeholder="Write your full notice here..." required></textarea>
    </div>

    <button class="btn" onclick="uploadNotice()">
      Submit Notice
    </button>
  </div>

  <footer>
    © 2025 Notice Board • NoteZilla
  </footer>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCVVqQnmO1Q83AucOqA5b5qUC4eo49sq6E",
    authDomain: "chat-box-e01e5.firebaseapp.com",
    databaseURL: "https://chat-box-e01e5-default-rtdb.firebaseio.com",
    projectId: "chat-box-e01e5",
    storageBucket: "chat-box-e01e5.firebasestorage.app",
    messagingSenderId: "597491149800",
    appId: "1:597491149800:web:7bd908925f70b62018125d"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  function showAlert(message, type = 'error') {
    const alertEl = document.getElementById('alert');
    alertEl.textContent = message;
    alertEl.className = `alert ${type}`;
    alertEl.style.display = 'block';
    setTimeout(() => alertEl.style.display = 'none', 5000);
  }

  function uploadNotice() {
    const name = document.getElementById('name').value.trim();
    const title = document.getElementById('title').value.trim();
    const noticeText = document.getElementById('notice').value.trim();

    // This was the bug: missing } 
    if (!name || !title || !noticeText) {
      showAlert("Please fill in all fields!", "error");
      return; // stop execution if validation fails
    }

    const date = new Date().toLocaleString('en-US', {
      weekday: 'short',
      year: 'numeric',
      month: 'short',
      day: 'numeric',
      hour: '2-digit',
      minute: '2-digit'
    });

    const noticeId = db.ref().child('notices').push().key;

    db.ref('notices/' + noticeId).set({
      name,
      title,
      notice: noticeText,
      date,
      timestamp: Date.now()
    })
    .then(() => {
      showAlert("Notice submitted successfully!", "success");
      document.getElementById('name').value = '';
      document.getElementById('title').value = '';
      document.getElementById('notice').value = '';
    })
    .catch((error) => {
      console.error("Error:", error);
      showAlert("Failed to submit notice.", "error");
    });
  }
</script>

</body>
</html>
