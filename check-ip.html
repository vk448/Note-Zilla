<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visitor Dashboard — Login</title>
<style>
/* ================== General layout ================== */
body {
  font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  margin: 0;
  padding: 0;
  background-color: #f0f2f7;
  color: #333;
}

.wrap {
  max-width: 900px;
  margin: 30px auto;
  padding: 20px 25px;
  background: #fff;
  border-radius: 14px;
  box-shadow: 0 12px 30px rgba(0,0,0,0.08);
}

h1 {
  font-size: 1.8rem;
  margin-bottom: 16px;
  color: #1a1a1a;
}

/* ================== Form elements ================== */
input, select, button {
  width: 100%;
  padding: 12px 14px;
  margin-top: 8px;
  font-size: 1rem;
  border-radius: 10px;
  border: 1px solid #ccc;
  box-sizing: border-box;
  transition: all 0.2s ease;
}

input:focus, select:focus, button:focus {
  outline: none;
  border-color: #007bff;
  box-shadow: 0 0 6px rgba(0,123,255,0.35);
}

button {
  background-color: #007bff;
  color: #fff;
  cursor: pointer;
  border: none;
  font-weight: 600;
}

button:hover {
  background-color: #0056b3;
}

/* ================== Sections / Divs ================== */
.result {
  margin-top: 18px;
  padding: 16px;
  background: #f9f9f9;
  border: 1px solid #e0e0e0;
  border-radius: 12px;
  max-height: 420px;
  overflow-y: auto;
}

.device-item {
  padding: 10px 12px;
  margin: 6px 0;
  border-radius: 10px;
  background-color: #fff;
  border: 1px solid #e6e6e6;
}

.row {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}

/* ================== Labels & Small text ================== */
label {
  display: block;
  font-weight: 500;
  margin-top: 12px;
  color: #555;
}

.small {
  font-size: 0.85rem;
  color: #777;
  margin-top: 4px;
}

/* ================== Hidden ================== */
.hidden {
  display: none !important;
}

/* ================== Responsive adjustments ================== */
@media (max-width: 768px) {
  .wrap {
    padding: 18px 20px;
    margin: 20px 12px;
  }
  h1 {
    font-size: 1.5rem;
  }
  input, select, button {
    font-size: 0.95rem;
    padding: 10px 12px;
  }
}

@media (max-width: 480px) {
  .wrap {
    padding: 14px 12px;
    margin: 15px 8px;
  }
  .row {
    flex-direction: column;
    gap: 6px;
  }
  h1 {
    font-size: 1.3rem;
  }
  input, select, button {
    font-size: 0.9rem;
    padding: 8px 10px;
  }
}
</style>
</head>
<body>
<div class="wrap" id="app">
  <h1>Visitor Dashboard</h1>

  <!-- LOGIN -->
  <div id="loginBox">
    <p class="small">Login to view visitor stats. (Client-side demo login)</p>
    <label>Username</label>
    <input id="username" placeholder="admin" value="">
    <label>Password</label>
    <input id="password" type="password" placeholder="password">
    <div style="margin-top:12px">
      <button id="loginBtn">Login</button>
    </div>
    <p class="small">Tip: This is a simple client-side login — not production secure. Use a strong password.</p>
  </div>

  <!-- DASHBOARD -->
  <div id="dash" class="hidden">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div>
        <strong>Logged in as</strong> <span id="who"></span>
      </div>
      <div>
        <button id="logoutBtn">Logout</button>
      </div>
    </div>

    <hr style="margin:12px 0">

    <label>Apps Script URL</label>
    <input id="gasUrl" style="width:100%" value="https://script.google.com/macros/s/AKfycbyrlHaixyn8xHACdX7R6yvbi2XSKhDnUQxjhM9G0B6hZjmTFt2kE46xMz44M9PN0wlO/exec">

    <label>Secret Key</label>
    <input id="secretKey" style="width:100%" value="mySecret123">

    <div style="margin-top:12px" class="row">
      <button id="loadIps">Load IPs</button>
      <button id="refreshBtn">Refresh</button>
      <div style="margin-left:auto;color:#666" id="ipsCount"></div>
    </div>

    <div style="margin-top:10px">
      <label>Select IP</label>
      <select id="ipSelect" style="width:100%;padding:10px"></select>
    </div>

    <div style="margin-top:8px" class="row">
      <button id="showBtn">Show</button>
      <button id="showAllBtn">Show All Details</button>
    </div>

    <div id="result" class="result hidden"></div>
  </div>
</div>

<script>
const loginBtn = document.getElementById('loginBtn');
const logoutBtn = document.getElementById('logoutBtn');
const loginBox = document.getElementById('loginBox');
const dash = document.getElementById('dash');
const who = document.getElementById('who');

// Demo credentials (change if needed)
const DEMO_USER = 'Amarjeet';
const DEMO_PASS = 'Vikash9873547858';

function showDashboard(user){
  who.textContent = user;
  loginBox.classList.add('hidden');
  dash.classList.remove('hidden');
}
function showLogin(){
  loginBox.classList.remove('hidden');
  dash.classList.add('hidden');
  who.textContent = '';
}

loginBtn.addEventListener('click', ()=>{
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;
  if(u===DEMO_USER && p===DEMO_PASS){
    localStorage.setItem('vd_user', u);
    showDashboard(u);
  } else { alert('Invalid credentials'); }
});

logoutBtn.addEventListener('click', ()=>{
  localStorage.removeItem('vd_user');
  setTimeout(showLogin, 50); // small delay to ensure DOM updates
});

// auto login if session exists
window.addEventListener('load', ()=>{
  const s = localStorage.getItem('vd_user');
  if(s) showDashboard(s);
});

// --------- Dashboard JS same as before ---------
// (Copy your fetch/loadIps/showIpDetails functions from previous script)
// For brevity, they remain unchanged. CSS+Logout fixed here.
</script>
</body>
</html>
