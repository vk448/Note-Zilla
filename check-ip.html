<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Visitor Dashboard — Login</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Exo+2:wght@400;600&display=swap');

/* ===== Animated Gradient Background ===== */
@keyframes gradientMove {
  0% {background-position: 0% 50%;}
  50% {background-position: 100% 50%;}
  100% {background-position: 0% 50%;}
}
body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(270deg, #0f2027, #203a43, #2c5364, #121f3e);
  background-size: 800% 800%;
  animation: gradientMove 20s ease infinite;
  font-family: 'Exo 2', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 60px 24px;  /* top/bottom 60px, left/right 24px for balanced spacing */
  color: #c3d0ff;
  overflow-x: hidden;
  user-select: none;
}

/* Removed .wrap:hover selector completely */

.wrap {
  background: rgba(28, 37, 56, 0.75);
  border-radius: 25px;
  box-shadow:
    inset 4px 4px 10px rgba(42, 54, 84, 0.8),
    inset -4px -4px 14px rgba(78, 104, 162, 0.7),
    0 20px 40px rgba(7, 27, 68, 0.6);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1.8px solid rgba(108, 138, 255, 0.25);
  max-width: 720px;
  width: 100%;
  padding: 45px 60px 55px; /* increased padding for more spacious feel */
  transition: box-shadow 0.4s ease;
  position: relative;
  perspective: 1400px;
}

/* Removed .wrap:hover selector completely */


.wrap {
  background: rgba(28, 37, 56, 0.75);
  border-radius: 25px;
  box-shadow:
    inset 4px 4px 10px rgba(42, 54, 84, 0.8),
    inset -4px -4px 14px rgba(78, 104, 162, 0.7),
    0 20px 40px rgba(7, 27, 68, 0.6);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1.8px solid rgba(108, 138, 255, 0.25);
  max-width: 720px;
  width: 100%;
  padding: 45px 60px 55px; /* increased padding for more spacious feel */
  transition: box-shadow 0.4s ease;
  position: relative;
  perspective: 1400px;
}

/* Removed .wrap:hover selector completely */


/* ===== Heading - Orbitron font for tech vibe ===== */
h1 {
  font-family: 'Orbitron', sans-serif;
  font-weight: 700;
  font-size: 3rem;
  text-align: center;
  color: #85a8ff;
  margin-bottom: 40px;
  text-shadow:
    0 0 8px #85a8ff, 
    0 0 20px #5d7dff,
    0 0 40px #4a6bff;
  letter-spacing: 0.35em;
  user-select: text;
}

/* ===== Labels with Neon Glow ===== */
label {
  display: block;
  font-weight: 600;
  margin-top: 18px;
  color: #b8c6ff;
  font-size: 1.1rem;
  text-shadow: 0 0 6px #3a53a0aa;
  letter-spacing: 0.02em;
}

/* ===== Inputs with glowing border and subtle inner shadows ===== */
input, select {
  width: 100%;
  padding: 15px 20px;
  font-size: 1.1rem;
  border-radius: 18px;
  border: none;
  background: rgba(31, 39, 69, 0.85);
  color: #c3d0ff;
  box-shadow:
    inset 1px 1px 3px #4e5d9c,
    inset -1px -1px 5px #2e3c71;
  transition: box-shadow 0.4s ease, background-color 0.4s ease;
  font-family: 'Exo 2', sans-serif;
  letter-spacing: 0.05em;
  user-select: text;
  outline: none;
  position: relative;
  z-index: 1;
}

/* Placeholder styling */
input::placeholder, select::placeholder {
  color: #7b89c1cc;
  font-style: italic;
}

/* Input focus glow effect */
input:focus, select:focus {
  background: rgba(55, 70, 140, 0.9);
  box-shadow:
    0 0 15px #6b8cff,
    inset 0 0 14px #789cff;
  color: #e0e9ff;
  caret-color: #a4d1ff;
  transition: all 0.3s ease;
  z-index: 2;
}

/* Ripple effect for inputs on focus */
input:focus::after {
  content: '';
  pointer-events: none;
  position: absolute;
  left: 50%;
  top: 50%;
  width: 0;
  height: 0;
  background: #6b8cff55;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  animation: ripple 0.6s ease forwards;
  z-index: 0;
}
@keyframes ripple {
  to {
    width: 200%;
    height: 200%;
    opacity: 0;
  }
}

/* ===== Buttons with animated neon glow ===== */
button {
  margin-top: 25px;
  padding: 14px 36px; /* reduced vertical padding slightly and increased horizontal for better shape */
  font-size: 1.25rem;
  font-weight: 700;
  background: linear-gradient(90deg, #407AFF, #3BB5FF);
  color: #e7f0ff;
  border: none;
  border-radius: 25px;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  box-shadow:
    0 0 10px #3bb5ff,
    0 0 40px #407aff,
    inset 0 0 25px #3bb5ff;
  transition: all 0.3s ease;
  user-select: none;
  position: relative;
  overflow: hidden;
  z-index: 1;
}

/* Neon pulse glow animation */
button:hover {
  animation: neonPulse 1.5s infinite alternate ease-in-out;
  transform: scale(1.07) translateY(-3px);
  box-shadow:
    0 0 16px #3bb5ff,
    0 0 60px #59a4ff,
    inset 0 0 30px #3bb5ff;
}

@keyframes neonPulse {
  0% {
    box-shadow:
      0 0 10px #3bb5ff,
      0 0 40px #407aff,
      inset 0 0 25px #3bb5ff;
  }
  100% {
    box-shadow:
      0 0 20px #67aaff,
      0 0 70px #59ccff,
      inset 0 0 40px #55b2ff;
  }
}

/* ===== Result box with layered shadows and slight motion on show ===== */
.result {
  margin-top: 28px;
  background: rgba(17, 26, 48, 0.9);
  border-radius: 22px;
  padding: 25px 30px;
  max-height: 480px;
  overflow-y: auto;
  font-weight: 600;
  font-size: 1rem;
  letter-spacing: 0.03em;
  box-shadow:
    0 0 35px rgba(24, 80, 220, 0.9),
    inset 0 0 20px rgba(20, 45, 99, 0.75);
  color: #b9cdfd;
  user-select: text;
  transition: transform 0.3s ease;
}

/* ===== Device Items with neon edges and glow ===== */
.device-item {
  margin: 12px 0;
  padding: 16px 20px;
  border-radius: 20px;
  background: rgba(58, 77, 115, 0.8);
  color: #a2bdff;
  font-weight: 700;
  box-shadow:
    0 0 10px #3b5affaa,
    inset 0 0 12px #3059e8cc;
  text-shadow: 0 0 10px #5a7fffcc;
  user-select: none;
  transition: box-shadow 0.3s ease;
}
.device-item:hover {
  box-shadow:
    0 0 18px #4d7fffdd,
    inset 0 0 20px #3a5dffdd;
}

/* ===== Rows layout ===== */
.row {
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
  align-items: center;
}

/* ===== Small text styling ===== */
.small {
  font-size: 0.9rem;
  color: #7a89a3cc;
  margin-top: 10px;
  font-style: italic;
  user-select: none;
}

/* ===== Hidden utility ===== */
.hidden {
  display: none !important;
}

/* ===== Responsive ===== */
@media (max-width: 768px) {
  .wrap {
    padding: 30px 30px 40px 30px;
  }
  h1 {
    font-size: 2.6rem;
    letter-spacing: 0.3em;
  }
  input, select {
    font-size: 1rem;
    padding: 12px 16px;
  }
  button {
    font-size: 1.1rem;
  }
}
@media (max-width: 480px) {

  h1 {
    font-size: 2rem;
    letter-spacing: 0.2em;
  }

  .row {
    flex-direction: column;
  }

  input, select {
    padding: 10px 12px;
  }
}
</style>
</head>
<body>
<div class="wrap" id="app" role="main" aria-label="Visitor Dashboard Login">
  <h1>Visitor Dashboard</h1>

  <!-- LOGIN -->
  <div id="loginBox">
    <p class="small" aria-live="polite">Login to view visitor stats. (Client-side demo login)</p>
    <label for="username">Username</label>
    <input id="username" placeholder="admin" autocomplete="username" />
    <label for="password">Password</label>
    <input id="password" type="password" placeholder="password" autocomplete="current-password" />
    <button id="loginBtn" type="button" aria-label="Login to the dashboard">Login</button>
    <p class="small">Tip: This is a client-side demo login — not secure for production. Use a strong password.</p>
  </div>

  <!-- DASHBOARD -->
  <div id="dash" class="hidden">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 10px;">
      <div><strong>Logged in as</strong> <span id="who"></span></div>
      <button id="logoutBtn" type="button" aria-label="Logout from the dashboard">Logout</button>
    </div>

    <hr style="margin: 12px 0; border-top: 1px solid rgba(68, 84, 150, 0.5);" />

    <label for="gasUrl">Apps Script URL</label>
    <br>
    <input id="gasUrl" value="https://script.google.com/macros/s/AKfycbyrlHaixyn8xHACdX7R6yvbi2XSKhDnUQxjhM9G0B6hZjmTFt2kE46xMz44M9PN0wlO/exec" />

    <label for="secretKey">Secret Key</label>
    <br>
    <input id="secretKey" value="mySecret123" />

    <div class="row" style="margin-top: 20px;">
      <button id="loadIps" type="button">Load IPs</button>
      <button id="refreshBtn" type="button">Refresh</button>
      <div style="margin-left:auto; color:#85a7ff; font-weight: 600;" id="ipsCount">0 IPs</div>
    </div>

    <div style="margin-top: 20px;">
      <label for="ipSelect">Select IP</label>
      <select id="ipSelect" style="padding: 14px 18px;"></select>
    </div>

    <div class="row" style="margin-top: 18px;">
      <button id="showBtn" type="button">Show</button>
      <button id="showAllBtn" type="button">Show All Details</button>
    </div>

    <div id="result" class="result hidden" aria-live="polite"></div>
  </div>
</div>

<script>
// ---------- Simple client-side login ----------
const loginBtn = document.getElementById('loginBtn');
const logoutBtn = document.getElementById('logoutBtn');
const loginBox = document.getElementById('loginBox');
const dash = document.getElementById('dash');
const who = document.getElementById('who');

// CHANGE THESE if you want:
const DEMO_USER = 'Amarjeet';
const DEMO_PASS = 'Vikash9873547858';

function showDashboard(user) {
  who.textContent = user;
  loginBox.classList.add('hidden');
  dash.classList.remove('hidden');
}
function showLogin() {
  loginBox.classList.remove('hidden');
  dash.classList.add('hidden');
}

loginBtn.addEventListener('click', () => {
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;
  if (u === DEMO_USER && p === DEMO_PASS) {
    localStorage.setItem('vd_user', u);
    showDashboard(u);
  } else {
    alert('Invalid credentials');
  }
});

logoutBtn.addEventListener('click', () => {
  localStorage.removeItem('vd_user');
  showLogin();
});

// On load, check session
window.addEventListener('load', () => {
  const s = localStorage.getItem('vd_user');
  if (s) showDashboard(s);
});

// ---------- Dashboard logic ----------
const loadIpsBtn = document.getElementById('loadIps');
const gasUrlInput = document.getElementById('gasUrl');
const secretInput = document.getElementById('secretKey');
const ipSelect = document.getElementById('ipSelect');
const showBtn = document.getElementById('showBtn');
const showAllBtn = document.getElementById('showAllBtn');
const resultBox = document.getElementById('result');
const ipsCount = document.getElementById('ipsCount');
const refreshBtn = document.getElementById('refreshBtn');

loadIpsBtn.addEventListener('click', loadIps);
refreshBtn.addEventListener('click', loadIps);

async function loadIps() {
  const gas = gasUrlInput.value.trim();
  const key = secretInput.value.trim();
  if (!gas || !key) return alert('Enter Apps Script URL and Secret Key');

  ipSelect.innerHTML = '';
  resultBox.classList.add('hidden');
  resultBox.textContent = 'Loading IPs…';
  resultBox.classList.remove('hidden');

  try {
    const url = new URL(gas);
    url.searchParams.set('action', 'list');
    url.searchParams.set('key', key);
    const res = await fetch(url.toString());
    const data = await res.json();

    if (data.error) {
      resultBox.innerHTML = '<b>Error:</b> ' + data.error;
      return;
    }

    const ips = data.ips || [];
    if (ips.length === 0) {
      ipSelect.innerHTML = '<option value="">No IPs found</option>';
      ipsCount.textContent = '0 IPs';
      resultBox.innerHTML = '<i>No visitors logged yet</i>';
      return;
    }

    // Fill select options: show IP + count + lastSeen
    ipSelect.innerHTML = '<option value="">-- Select an IP --</option>';
    ips.forEach(item => {
      const lastSeen = item.lastSeen ? new Date(item.lastSeen).toLocaleString() : 'N/A';
      const opt = document.createElement('option');
      opt.value = item.ip;
      opt.textContent = `${item.ip} — ${item.count} views — last: ${lastSeen}`;
      ipSelect.appendChild(opt);
    });

    ipsCount.textContent = ips.length + ' IPs';
    resultBox.classList.add('hidden');

  } catch (err) {
    resultBox.innerHTML = '<b>Error loading IPs:</b> ' + err.message;
  }
}

showBtn.addEventListener('click', async () => {
  const ip = ipSelect.value;
  if (!ip) return alert('Select an IP');
  await showIpDetails(ip);
});

showAllBtn.addEventListener('click', async () => {
  const ip = ipSelect.value;
  if (!ip) return alert('Select an IP');
  await showIpDetails(ip, true);
});

async function showIpDetails(ip, showAll=false) {
  const gas = gasUrlInput.value.trim();
  const key = secretInput.value.trim();
  if (!gas || !key) return alert('Enter Apps Script URL and Secret Key');

  resultBox.classList.remove('hidden');
  resultBox.innerHTML = '<b>Loading details…</b>';

  try {
    const url = new URL(gas);
    url.searchParams.set('action', 'count');
    url.searchParams.set('ip', ip);
    url.searchParams.set('key', key);
    const res = await fetch(url.toString());
    const data = await res.json();

    if (data.error) {
      resultBox.innerHTML = '<b>Error:</b> ' + data.error;
      return;
    }

    let html = `<h3>IP: ${data.ip}</h3><p><strong>Total views:</strong> ${data.count}</p>`;
    html += '<div><h4>Device breakdown</h4>';
    const byDevice = data.byDevice || {};
    const types = ['Mobile','Desktop','Tablet','Unknown'];
    const extra = Object.keys(byDevice).filter(k=>!types.includes(k));
    const all = types.concat(extra);
    all.forEach(t => {
      const c = byDevice[t] || 0;
      html += `<div class="device-item"><strong>${t}:</strong> ${c}</div>`;
    });
    html += '</div>';

    if (showAll) {
      html += '<div style="margin-top:12px"><h4>Recent visits (last 100)</h4><div id="rawRows">Loading rows…</div></div>';
      resultBox.innerHTML = html;
      await loadRawRows(ip);
    } else {
      resultBox.innerHTML = html;
    }

  } catch (err) {
    resultBox.innerHTML = '<b>Error:</b> ' + err.message;
  }
}

async function loadRawRows(ip) {
  const gas = gasUrlInput.value.trim();
  const key = secretInput.value.trim();
  const container = document.getElementById('rawRows');
  container.innerHTML = 'Loading…';

  try {
    const url = new URL(gas);
    url.searchParams.set('action', 'list');
    url.searchParams.set('key', key);
    const res = await fetch(url.toString());
    const data = await res.json();
    if (data.error) { container.innerHTML = 'Error: ' + data.error; return; }
    const ips = data.ips || [];
    const item = ips.find(x => x.ip === ip);
    if (!item) { container.innerHTML = 'No rows found'; return; }

    let html = `<div><strong>Last seen:</strong> ${item.lastSeen ? new Date(item.lastSeen).toLocaleString() : 'N/A'}</div>`;
    html += '<div style="margin-top:8px"><strong>Devices:</strong></div>';
    Object.keys(item.devices || {}).forEach(k => {
      html += `<div class="device-item">${k}: ${item.devices[k]}</div>`;
    });
    container.innerHTML = html;

  } catch (err) {
    container.innerHTML = 'Error: ' + err.message;
  }
}

// optional: auto-load if logged in
if (localStorage.getItem('vd_user')) {
  // auto-load IPs if needed
  // loadIps();
}
</script>

</body>
