<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Note-Zilla Entry Form</title>

<style>
body{margin:0;font-family:'Inter',Arial,sans-serif;background:#eef3ff;padding:28px;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;}
.container{width:100%;max-width:780px;background:#fff;border-radius:16px;box-shadow:0 12px 40px rgba(16,24,40,0.12);padding:32px;transition:transform 0.2s;}
.container:hover{transform:translateY(-3px);}
h1{font-size:28px;font-weight:700;text-align:center;margin-bottom:16px;color:#111827;}
label{display:block;font-weight:600;margin-top:14px;font-size:14px;color:#111827;}
input[type="text"], select{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #e6e9ef;font-size:14px;box-sizing:border-box;transition:border-color 0.2s, box-shadow 0.2s;}
input[type="text"]:focus, select:focus{border-color:#0067c5;box-shadow:0 0 8px rgba(0,103,197,0.2);outline:none;}
button.primary{background:#0067c5;color:white;border:none;padding:12px 18px;border-radius:10px;cursor:pointer;font-weight:600;transition:background 0.2s, transform 0.1s;}
button.primary:hover{background:#0053a3;transform:translateY(-2px);}
button.ghost{background:transparent;border:1px solid #e6e9ef;padding:10px 16px;border-radius:10px;cursor:pointer;transition:background 0.2s,border-color 0.2s,transform 0.1s;}
button.ghost:hover{background:#f1f5f9;border-color:#0067c5;transform:translateY(-2px);}
.status{margin-top:16px;font-size:14px;color:#6b6f76;}
.link-box{margin-top:10px;padding:12px 14px;background:#f3faf7;border-radius:10px;display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid #e6f4ea;}
.link-box .url{font-size:14px;color:#15803d;word-break:break-all;}
.REMOVE {
    display: inline-block;
    padding: 10px 20px;
    margin: 20px 12px;
    
    font-size: 16px;
    font-weight: 600;
    color: white;
    text-decoration: none;
    
    background: #d90429; /* Red modern delete color */
    border: none;
    border-radius: 8px;
    cursor: pointer;
    
    transition: 0.25s ease-in-out;
    box-shadow: 0 4px 10px rgba(217, 4, 41, 0.3);
}
.REMOVE:hover {
    background: #a10321;
    transform: translateY(-2px);
    box-shadow: 0 6px 14px rgba(217,4,41,0.45);
}
.REMOVE:active {
    transform: scale(0.96);
}

</style>
</head>
<body>

<div class="container" role="main">
<h1>Note-Zilla — Chapter Data Base Entry</h1>

<label for="chapter">Chapter Name</label>
<input id="chapter" type="text" placeholder="e.g. Chapter 1: Introduction to Computers" />

<div style="display:flex;gap:16px;margin-top:8px;">
<div style="flex:1;">
<label for="subject">Subject</label>
<select id="subject">
<option>Science</option>
<option>Maths</option>
<option>Hindi</option>
<option>Sanskrit</option>
<option>English</option>
<option>AI</option>
<option>SST</option>
</select>
</div>
<div style="flex:1;">
<label for="folder">Folder (for URL)</label>
<select id="folder">
<option>Science</option>
<option>Maths</option>
<option>Hindi</option>
<option>Sanskrit</option>
<option>English</option>
<option>AI</option>
<option>SST</option>
</select>
</div>
</div>
<div>
<label for="pdf" style="margin-top:12px;">PDF Name (without .pdf)</label>

<input id="pdf" type="text" placeholder="e.g. chapter_1_intro_or_notes_file" />

<label for="direct_link" style="margin-top:12px;">Or Direct Link</label>
<input id="direct_link" type="text" placeholder="https://drive.google.com/..., or https://your-site/path.pdf" />
<a href="delete-database-work-admin-owner-notezilla-database-work-add-on.html" target="_blank" class="REMOVE">Remove Incorrect Link </a>
<div style="margin-top:20px;display:flex;gap:12px;align-items:center;">
<button class="primary" onclick="generateAndSave()">Generate & Save</button>
<button class="ghost" onclick="clearForm()">Clear</button>
<div style="margin-left:auto;">
<div class="small">Auto date:</div>
<div id="autoDate" style="padding-left:8px;font-weight:600;"></div>
</div>
</div>

<div id="status" class="status"></div>

<div id="linkBox" class="link-box hidden">
<div>
<div class="small">✅ Link</div>
<div id="previewLink" class="url"></div>
</div>
<div style="display:flex;gap:8px;">
<button class="ghost" onclick="openLink()">Open</button>
<button class="ghost" onclick="copyLink()">Copy</button>
</div>
</div>
</div>

<script>
// 🔐 Access Control
const role = localStorage.getItem("userRole");
if (!role || !["admin","co-admin","owner"].includes(role.toLowerCase())) {
    alert("❌ Access Denied! Only Admins and Co-Admins can access this page.");
    window.location.href = "login.html";
}

// ✅ Fixed DD/MM/YYYY
const indiaTime = new Date().toLocaleString("en-US",{timeZone:"Asia/Kolkata"});
const d = new Date(indiaTime);
document.getElementById("autoDate").textContent = `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;

function toSlug(text){ return text.trim().replace(/\s+/g,'_').replace(/[^a-zA-Z0-9_\-]/g,'').toLowerCase(); }

const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyRZo_3MZ8X4v-zzDZObCI6dFXMnq79isXOVpE8XH7s-TZ0OjxjzjyRYZP5Z4Yv_34A/exec";

async function generateAndSave(){
const chapter=document.getElementById("chapter").value.trim();
const subject=document.getElementById("subject").value.trim();
const folder=document.getElementById("folder").value.trim().toLowerCase();
const pdfRaw=document.getElementById("pdf").value.trim();
const directLink=document.getElementById("direct_link").value.trim();

if(!chapter){alert("Enter Chapter Name");return;}
if(!pdfRaw && !directLink){alert("Enter PDF Name or Direct Link");return;}

const pdfSlug = pdfRaw?toSlug(pdfRaw):toSlug(chapter);
const generatedUrl = directLink || `https://note-zilla.netlify.app/${folder}/${pdfSlug}.pdf`;

const params = new URLSearchParams({chapter_name:chapter,subject:subject,folder:folder,pdf_name:pdfSlug,link:generatedUrl,direct_link:directLink,date:document.getElementById("autoDate").textContent});

document.getElementById("status").innerText="Saving...";
try{
const res=await fetch(`${WEB_APP_URL}?${params.toString()}`);
const json=await res.json();
if(json.status==="success"){
document.getElementById("status").innerText="✅ Saved successfully!";
document.getElementById("previewLink").innerText=generatedUrl;
document.getElementById("linkBox").classList.remove("hidden");
}else{document.getElementById("status").innerText="❌ Error: "+json.message;}
}catch(err){console.error(err);document.getElementById("status").innerText="❌ Network or script error.";}
}

function clearForm(){
document.getElementById("chapter").value="";
document.getElementById("pdf").value="";
document.getElementById("direct_link").value="";
document.getElementById("subject").selectedIndex=0;
document.getElementById("folder").selectedIndex=0;
document.getElementById("status").innerText="";
document.getElementById("linkBox").classList.add("hidden");
}

function openLink(){const url=document.getElementById("previewLink").innerText;if(url)window.open(url,"_blank");}
function copyLink(){const url=document.getElementById("previewLink").innerText;if(!url)return;navigator.clipboard.writeText(url).then(()=>{document.getElementById("status").innerText="Link copied ✅";}).catch(()=>alert("Copy manually: "+url));}
</script>

</body>
</html>
