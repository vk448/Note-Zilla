<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Approval Panel | NoteZilla</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--primary:#203a43;--success:#27ae60;--danger:#e74c3c;--warning:#f39c12;}
    body{font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);color:white;padding:20px;min-height:100vh;}
    .box{background:white;color:#333;border-radius:18px;padding:35px;max-width:1100px;margin:20px auto;box-shadow:0 20px 50px rgba(0,0,0,0.5);}
    h1{text-align:center;color:var(--primary);font-size:2.6rem;margin-bottom:10px;}
    table{width:100%;border-collapse:collapse;margin-top:20px;}
    th,td{padding:16px;text-align:left;border-bottom:1px solid #eee;}
    th{background:var(--primary);color:white;font-weight:600;}
    img{width:65px;height:65px;border-radius:50%;object-fit:cover;border:4px solid var(--primary);}
    button{padding:11px 22px;margin:0 6px;border:none;border-radius:10px;color:white;font-weight:600;cursor:pointer;transition:0.3s;}
    .approve{background:var(--success);}
    .reject{background:var(--danger);}
    button:hover{transform:scale(1.08);box-shadow:0 8px 20px rgba(0,0,0,0.3);}
    .role-tag{background:#fff3cd;color:#856404;padding:6px 14px;border-radius:20px;font-size:0.9rem;}
    .no-data{text-align:center;padding:60px;color:#777;font-size:1.3rem;}

    .toast-container{position:fixed;top:30px;right:30px;z-index:10000;}
    .toast{background:var(--success);color:white;padding:18px 28px;border-radius:14px;margin-bottom:15px;box-shadow:0 10px 30px rgba(0,0,0,0.5);font-weight:600;min-width:340px;display:flex;align-items:center;gap:16px;border-left:6px solid #1e8449;transform:translateX(120%);transition:0.6s;opacity:0;}
    .toast.show{transform:translateX(0);opacity:1;}
    .toast.error{background:var(--danger);border-left-color:#c0392b;}
    .toast i{font-size:1.8rem;font-weight:bold;}
  </style>
</head>
<body>

<div class="box">
  <h1>Pending Approvals</h1>
  <p style="text-align:center;color:#f39c12;margin-bottom:30px;">Approve = Active Account | Reject = Delete Forever</p>

  <table>
    <thead>
      <tr><th>Photo</th><th>Name</th><th>Username</th><th>Email</th><th>Role</th><th>Action</th></tr>
    </thead>
    <tbody id="list"></tbody>
  </table>
  <p id="no" class="no-data" style="display:none;">No pending requests right now</p>
</div>

<div class="toast-container" id="toastBox"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCVVqQnmO1Q83AucOqA5b5qUC4eo49sq6E",
    authDomain: "chat-box-e01e5.firebaseapp.com",
    databaseURL: "https://chat-box-e01e5-default-rtdb.firebaseio.com",
    projectId: "chat-box-e01e5",
    storageBucket: "chat-box-e01e5.firebasestorage.app",
    messagingSenderId: "597491149800",
    appId: "1:597491149800:web:7bd908925f70b62018125d"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  function showToast(msg, type = "success") {
    const box = document.getElementById("toastBox");
    const toast = document.createElement("div");
    toast.classList.add("toast", type);
    toast.innerHTML = `${type === "error" ? "Cross" : "Checkmark"} ${msg}`;
    box.appendChild(toast);
    setTimeout(() => toast.classList.add("show"), 100);
    setTimeout(() => {
      toast.classList.remove("show");
      setTimeout(() => toast.remove(), 600);
    }, 4000);
  }

  const list = document.getElementById("list");
  const noMsg = document.getElementById("no");

  // Real-time listener for pending users
  db.ref("admins").orderByChild("status").equalTo("pending").on("value", snap => {
    list.innerHTML = "";
    if (!snap.exists()) {
      noMsg.style.display = "block";
      return;
    }
    noMsg.style.display = "none";

    snap.forEach(child => {
      const u = child.val();
      const key = child.key;

      const row = document.createElement("tr");
      row.innerHTML = `
        <td><img src="${u.photoURL || 'https://api.dicebear.com/7.x/avataaars/svg?seed=' + u.username}" onerror="this.src='https://api.dicebear.com/7.x/avataaars/svg?seed=${u.username}'"></td>
        <td><b>${u.fullName || "N/A"}</b></td>
        <td>${u.username}</td>
        <td>${u.email}</td>
        <td><span class="role-tag">${u.role}</span></td>
        <td>
          <button class="approve" onclick="approveUser('${key}')">Approve</button>
          <button class="reject" onclick="rejectUser('${key}')">Reject & Delete</button>
        </td>
      `;
      list.appendChild(row);
    });
  });

  // APPROVE USER → status = approved
  function approveUser(id) {
    if (confirm("Approve this user? They will be able to login.")) {
      db.ref("admins/" + id).update({ status: "approved" })
        .then(() => showToast("User approved successfully!", "success"))
        .catch(() => showToast("Failed to approve!", "error"));
    }
  }

  // REJECT USER → DELETE ACCOUNT FROM DATABASE
  function rejectUser(id) {
    if (confirm("Reject this user?\nThis will PERMANENTLY DELETE their account!")) {
      db.ref("admins/" + id).remove()
        .then(() => showToast("User rejected and deleted!", "success"))
        .catch(() => showToast("Failed to delete user!", "error"));
    }
  }
</script>
</body>
</html>
