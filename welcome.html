<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NoteZilla: User Profile</title>
<!-- Using Inter font for clean, modern look -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"> 
<style>
/* 1. Variables and Global Setup (Light Mode) */
*, *::before, *::after {
  box-sizing: border-box;
}

:root {
  --font-family: 'Inter', sans-serif;
  
  /* Light Mode Palette - Refined for softer colors and better hierarchy */
  --bg-light: #f9fafc;     /* Lighter background */
  --card-light: #ffffff;   /* Pure white card background */
  --text-dark: #1f2937;    /* Dark gray primary text (professional) */
  --text-muted-light: #6b7280; /* Medium gray secondary text */
  --accent-color: #3f90ff; /* Bright Blue accent */
  --accent-soft: #eaf3ff;  /* Very light blue background for badges */
  --button-hover: #1e80ff; /* Slightly darker blue for button hover */
  --border-color-light: #e5e7eb; /* Subtle light border */
  --shadow-light: rgba(0, 0, 0, 0.08); /* Softer, more spread-out shadow */
  --shadow-hover: rgba(0, 0, 0, 0.15);
  --radius-small: 8px;
  --radius-large: 16px;
}

body {
  font-family: var(--font-family);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh; 
  margin: 0;
  background-color: var(--bg-light); 
  color: var(--text-dark); 
  padding: 20px;
}

/* 2. Main Application Container */
.app-container {
  width: 100%;
  max-width: 450px; 
  text-align: left;
  animation: fadeIn 0.6s ease-out;
}

/* 3. Profile Card (The Core Panel) */
.profile-card {
  background-color: var(--card-light); 
  padding: 24px;
  border-radius: var(--radius-large);
  border: 1px solid var(--border-color-light); 
  /* Softer, more spread out shadow for a floating effect */
  box-shadow: 0 6px 20px var(--shadow-light); 
  transition: all 0.3s ease;
}

.profile-card:hover {
  /* Deeper shadow and slight scale for better visual feedback */
  box-shadow: 0 10px 30px var(--shadow-hover); 
  transform: translateY(-2px) scale(1.005); 
}

/* 4. Header Section */
.card-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}

.user-avatar {
  font-size: 1.8rem;
  background-color: var(--accent-color);
  border-radius: 50%;
  width: 48px;
  height: 48px;
  display: flex;
  justify-content: center;
  align-items: center;
  color: var(--card-light); 
  border: 2px solid var(--accent-color);
}

h1 {
  font-size: 1.8rem;
  margin: 0;
  font-weight: 600;
  color: var(--text-dark); 
}

.greeting-message {
  font-size: 0.95rem;
  line-height: 1.4;
  color: var(--text-muted-light); 
  margin-top: -10px;
  margin-bottom: 24px;
  padding-bottom: 15px;
  border-bottom: 1px dashed var(--border-color-light); 
}

/* 5. Info Grid (Data Presentation) */
.info-grid {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.info-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--border-color-light); 
  border-top: none;
  border-left: none;
  border-right: none;
}

.info-item:last-child {
  border-bottom: none;
  padding-bottom: 0;
}

.label {
  font-size: 1rem;
  font-weight: 500;
  color: var(--text-muted-light); 
}

.value {
  font-weight: 700;
  color: var(--text-dark); 
}

/* 6. Role Badge (Stands out) */
.role-badge {
  font-size: 0.85rem;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--accent-color); 
  background-color: var(--accent-soft); 
  padding: 4px 10px;
  border-radius: var(--radius-small);
  letter-spacing: 1px;
  /* subtle border/shadow for definition */
  box-shadow: inset 0 0 0 1px rgba(63, 144, 255, 0.3);
}

/* 7. Action Button Styling (NEW) */
.action-button {
  width: 100%;
  margin-top: 30px; /* More space above the button */
  padding: 12px;
  border: none;
  border-radius: var(--radius-small);
  background-color: var(--accent-color);
  color: var(--card-light);
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: background-color 0.2s ease, transform 0.1s ease;
  box-shadow: 0 4px 10px rgba(63, 144, 255, 0.3);
}

.action-button:hover {
  background-color: var(--button-hover);
  box-shadow: 0 6px 15px rgba(63, 144, 255, 0.4);
}

.action-button:active {
  transform: scale(0.99); /* Press down effect */
}


/* 8. Animations */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>
  <!-- Main application container for structure -->
  <div class="app-container">
    
    <div class="profile-card">
      <div class="card-header">
        <!-- Icon/Avatar Placeholder -->
        <span class="user-avatar">👤</span> 
        <h1 id="welcomeText">Welcome Back!</h1>
      </div>

      <p class="greeting-message">Your NoteZilla access details and current role are listed below. Stay organized and productive!</p>

      <div class="info-grid">
        <div class="info-item">
          <span class="label">User Name:</span>
          <span class="value" id="userName">-</span>
        </div>
        <div class="info-item">
          <span class="label">Current Role:</span>
          <span class="value">
            <span class="role-badge" id="userRole">-</span>
          </span>
        </div>
      </div>
      
      <!-- New Call-to-Action Button -->
      <button class="action-button">Go to Dashboard</button>

    </div>
    
  </div>

<script>
// Retrieve data from local storage
const name = localStorage.getItem("adminName") || "Unknown User";
const role = localStorage.getItem("role") || "user";

// Update the displayed elements
document.getElementById("userName").textContent = name;
document.getElementById("userRole").textContent = role.toUpperCase();

// Update the main heading to be concise (e.g., "Hello, John!")
document.getElementById("welcomeText").textContent = `Hello, ${name.split(' ')[0]}!`; 
</script>
</body>
</html>
