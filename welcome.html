<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome - NoteZilla</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 50%, #3b82f6 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    padding: 20px;
  }
  .card {
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-radius: 28px;
    padding: 60px 40px;
    max-width: 460px;
    width: 100%;
    text-align: center;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.2);
    animation: float 8s ease-in-out infinite;
  }
  .photo {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    object-fit: cover;
    border: 7px solid rgba(255, 255, 255, 0.3);
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
    margin-bottom: 25px;
  }
  h1 {
    font-size: 2.8rem;
    font-weight: 800;
    margin: 15px 0;
    background: linear-gradient(90deg, #ffffff, #bde0fe);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle {
    font-size: 1.25rem;
    opacity: 0.9;
    margin-bottom: 30px;
    font-weight: 500;
  }
  .role {
    display: inline-block;
    padding: 12px 32px;
    border-radius: 50px;
    font-weight: 800;
    font-size: 1rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
  }
  .message {
    margin-top: 35px;
    font-size: 1.1rem;
    opacity: 0.85;
    line-height: 1.6;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-18px); }
  }
  @media (max-width: 480px) {
    .card { padding: 50px 25px; }
    h1 { font-size: 2.4rem; }
  }
</style>
</head>
<body>

  <div class="card">
    <img id="photo" class="photo" src="" alt="Profile Photo">
    
    <h1 id="name">Hello!</h1>
    <p class="subtitle">Welcome back to your dashboard</p>
    
    <div class="role" id="roleBadge">USER</div>

    <p class="message">
      Your NoteZilla account is active and ready.<br>
      Stay organized • Stay productive
    </p>
  </div>

<script>
// Super Fast & Instant Update - No Delay!
function updateWelcome() {
  const user = JSON.parse(sessionStorage.getItem("currentUser") || "{}");
  const fullName = user.fullName || "Admin";
  const role = (user.role || "user").toLowerCase();
  const photoURL = user.photoURL;

  // Name
  document.getElementById("name").textContent = `Hello, ${fullName.split(" ")[0]}!`;

  // Role + Color
  let roleText = "USER";
  let bgColor = "rgba(59, 130, 246, 0.7)";

  if (role === "owner")       { roleText = "Owner";      bgColor = "#fbbf24"; }
  else if (role === "admin")  { roleText = "Admin";      bgColor = "#ef4444"; }
  else if (role.includes("co")) { roleText = "Co-Admin"; bgColor = "#a855f7"; }

  const badge = document.getElementById("roleBadge");
  badge.textContent = roleText;
  badge.style.background = bgColor;

  // Photo (Real or DiceBear)
  const defaultAvatar = `https://api.dicebear.com/7.x/avataaars/svg?seed=${fullName}&backgroundColor=3b82f6`;
  document.getElementById("photo").src = 
    (photoURL && photoURL.startsWith("data:")) ? photoURL : 
    (photoURL || defaultAvatar);
}

// Run immediately + listen for storage changes
updateWelcome();

// Agar koi aur tab se login kare toh bhi update ho jaye
window.addEventListener("storage", (e) => {
  if (e.key === "currentUser") updateWelcome();
});

// Har 1 second check karega (backup - 100% sure update)
setInterval(updateWelcome, 1000);
</script>

</body>
</html>
