<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanskrit - NoteZilla</title>
  <link rel="icon" href="../Images/Favicon.png">
  <meta name="google-site-verification" content="C2-yDbzzyS4qMdBWgM3WARN6saZ1KX7ndHrd_Uc38mg" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Shared premium + Christmas CSS -->
  <link rel="stylesheet" href="../subject.css">
</head>
<body>

  <header>
    <div class="logo" onclick="window.location.href='../'">NoteZilla</div>
    <div class="hamburger" onclick="toggleMenu(this)">
      <div></div><div></div><div></div>
    </div>
    <nav>
      <a href="../index.html">Home</a>
      <a href="#notes" class="active">Sanskrit Notes</a>
      <a href="../credit.html">About</a>
      <a href="../contact.html">Contact</a>
      <a href="../login.html"><button class="login-btn">Login</button></a>
      <button class="toggle-dark" id="darkToggle">☾</button>
    </nav>
  </header>

  <section class="page-hero">
    <h1>Sanskrit Notes</h1>
    <p>All chapters and study materials for Class 9 Sanskrit – beautifully explained with meanings, grammar, and exercises.</p>
  </section>

  <!-- Fixed Search Bar - No Shifting -->
  <div class="search-container">
    <input type="text" id="searchBar" placeholder="🔍 Search chapters, shlokas, grammar...">
  </div>

  <section class="subject-grid" id="subjectGrid">
    <div style="grid-column: 1 / -1; text-align:center; padding:60px 20px;">
      <div class="loader"></div>
      <p class="loading-text">Loading Sanskrit chapters...</p>
    </div>
  </section>

  <footer>
    <p>© 2025 <span>NoteZilla</span> · All Rights Reserved</p>
  </footer>

  <script>
    // Hamburger Menu Toggle
    function toggleMenu(el) {
      document.querySelector('nav').classList.toggle('active');
      el.classList.toggle('open');
    }

    // Dark Mode Toggle
    document.getElementById('darkToggle')?.addEventListener('click', () => {
      document.body.classList.toggle('dark');
    });

    // Optional: Header scroll effect for extra smoothness
    window.addEventListener('scroll', () => {
      const header = document.querySelector('header');
      if (window.scrollY > 50) {
        header.style.background = 'rgba(15, 12, 41, 0.8)';
        header.style.backdropFilter = 'blur(40px)';
      } else {
        header.style.background = 'rgba(15, 12, 41, 0.4)';
        header.style.backdropFilter = 'blur(30px)';
      }
    });
  </script>

  <script src="skt.js"></script>
  <script src="../favicon.js"></script>
  <script src="../Record.js"></script>
</body>
</html>
