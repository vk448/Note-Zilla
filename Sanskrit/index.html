<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Science Notes - Note Zilla</title>
<link rel="icon" href="../Images/Favicon.png">

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap');

/* ============================ General Reset =========================== */
* { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }
body { background:#f5f6fa; color:#333; line-height:1.6; }

/* ============================ Header =========================== */
header {
  display:flex; justify-content:center; align-items:center;
  padding:15px 50px; background:#fff;
  box-shadow:0 4px 6px rgba(0,0,0,0.1);
  position:sticky; top:0; z-index:100;
}
header .logo { font-weight:900; font-size:1.8rem; text-align: left; margin-left: 0; background:linear-gradient(90deg, #4e73df, #1cc88a); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
nav { display:flex; align-items:center; gap:15px; margin-left:50px; }
nav a { text-decoration:none; color:#333; font-weight:500; transition:color 0.2s; }
nav a:hover { color:#4e73df; }
.login-btn { background:#1cc88a; color:white; border:none; padding:8px 16px; border-radius:6px; cursor:pointer; font-weight:bold; transition:background 0.2s; }
.login-btn:hover { background:#17a673; }

/* ============================ Hero Section =========================== */
.hero { text-align:center; padding:60px 20px; background:#eef2f7; border-radius:12px; margin:20px; }
.hero h1 { font-size:2.5rem; font-weight:900; color:#4e73df; margin-bottom:15px; }
.hero p { font-size:1.2rem; color:#555; margin-bottom:20px; }
.cta-btn { padding:12px 30px; background:#4e73df; color:white; border:none; border-radius:8px; cursor:pointer; font-weight:bold; text-decoration:none; transition:all 0.3s; display:inline-block; }
.cta-btn:hover { background:#1cc88a; transform:scale(1.05); }

/* ============================ Notes Section =========================== */
.notes-preview { max-width:1200px; margin:0 auto; padding:50px 20px; }
.notes-preview h2 { text-align:center; font-size:2rem; margin-bottom:40px; color:#4e73df; }
.notes-container { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:20px; }

.note-card {
  background: linear-gradient(135deg, #ffffff, #e0f7fa);
  padding:25px; border-radius:15px; box-shadow:0 6px 15px rgba(0,0,0,0.1);
  transition: transform 0.3s, box-shadow 0.3s;
  text-align:center;
}
.note-card h4 { margin-bottom:15px; color:#4e73df; font-weight:700; }
.note-card a {
  text-decoration:none; 
  padding:10px 20px; 
  background:#1cc88a; 
  color:white; 
  border-radius:8px; 
  font-weight:bold; 
  transition:all 0.3s;
}
.note-card a:hover {
  background:#4e73df;
  transform:scale(1.05);
  box-shadow:0 8px 20px rgba(0,0,0,0.2);
}

/* Back link */
.back { color:#4e73df; text-decoration:none; font-weight:bold; display:inline-block; margin:20px; }
.back:hover { text-decoration:underline; }

/* ============================ Footer =========================== */
footer { text-align:center; padding:20px; background:#fff; box-shadow:0 -4px 6px rgba(0,0,0,0.05); margin-top:50px; border-radius:12px; }
footer p { color:#555; }

/* ============================ Responsive =========================== */
@media(max-width:768px){
  .hero h1 { font-size:2.2rem; }
  .hero p { font-size:1rem; }
}
@media(max-width:480px){
  .hero h1 { font-size:1.8rem; }
  .hero p { font-size:0.9rem; }
  .note-card { padding:15px; }
  nav { flex-direction: column; gap:10px; margin-left:0; }
}
</style>
</head>
<body>

<!-- Header -->
<header>
  <div class="logo">Note Zilla</div>
  <nav>
    <a href="../index.html">Home</a>
    <a href="#notes">Science Notes</a>
    <a href="../credit.html">About</a>
   <a href="../Contact.html">Contact</a>
    <button class="login-btn"><a href="login.html">Login</a></button>
  </nav>
</header>

<!-- Hero Section -->
<section class="hero">
  <h1>Sanskrit Teacher - Ritu Mam</h1>
  <p>Access all Class 9 Science PDFs in one place</p>
  <a href="../index.html" class="cta-btn">Back to Home</a>
</section>

<!-- Notes Section -->
<section class="notes-preview" id="notes">
  <h2>Science PDFs</h2>
  <div class="notes-container">
    <div class="note-card">
      <h4>It Available Soon !</h4>
    </div>
  </div>
</section>

<!-- Footer -->
<footer>
  <p>&copy; 2025 Note Zilla. All rights reserved.</p>
</footer>
<script src="../Record.js"></script>
</body>
</html>
