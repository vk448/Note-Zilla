<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0e1f" />
  <title>Mega Chat — Global Anonymous Room</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: 'Inter', sans-serif; background: #0a0e1f; color: white; }
    .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(0, 231, 255, 0.2); border-radius: 20px; }
    #messages { height: calc(100vh - 170px); overflow-y: auto; padding: 20px 16px 140px 16px; }
    .input-bar { position: fixed; bottom: 0; left: 0; right: 0; padding: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom)); background: #0a0e1f; border-top: 1px solid rgba(0,231,255,0.2); z-index: 9999; }

    #msgInput { flex: 1; padding: 12px 20px; background: rgba(255,255,255,0.1); border-radius: 16px; font-size: 16px; height: 52px; line-height: 24px; padding-right: 70px; outline: none; }
    #sendBtn { position: absolute; right: 8px; top: 50%; transform: translateY(-50%) scale(0.8); width: 56px; height: 56px; background: linear-gradient(135deg, #06b6d4, #8b5cf6); color: white; border-radius: 50%; display: grid; place-items: center; font-size: 28px; font-weight: bold; opacity: 0; visibility: hidden; transition: all 0.25s; box-shadow: 0 4px 20px rgba(139,92,246,0.5); cursor: pointer; z-index: 10; }
    #sendBtn.show { opacity: 1; visibility: visible; transform: translateY(-50%) scale(1); }

    /* FIXED: Mention Dropdown – Ab Input ke UPAR dikhega */
    .mention-suggestions {
      position: absolute;
      bottom: 100%;           /* Input ke upar */
      left: 50%;
      transform: translateX(-50%);
      width: 88%;
      max-width: 600px;
      background: rgba(15,23,42,0.98);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(139,92,246,0.4);
      border-radius: 16px;
      max-height: 240px;
      overflow-y: auto;
      z-index: 99999;
      display: none;
      box-shadow: 0 -12px 40px rgba(0,0,0,0.7);
      margin-bottom: 8px;
    }
    .mention-item {
      padding: 14px 18px;
      cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      transition: all 0.2s;
      font-size: 15px;
    }
    .mention-item:hover {
      background: rgba(139,92,246,0.5);
      padding-left: 24px;
    }
    .mention-item:last-child { border-bottom: none; }

    .mention { color: #c4b5fd; background: rgba(139,92,246,0.4); padding: 2px 8px; border-radius: 8px; font-weight: 700; }
    .mentioned-message { animation: glow 2s infinite alternate; }
    @keyframes glow { from { box-shadow: 0 0 15px #a78bfa; } to { box-shadow: 0 0 25px #c4b5fd; } }

    .delete-btn { position: absolute; top: -10px; right: -10px; background: #ef4444; color: white; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; cursor: pointer; opacity: 0; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    .message-wrapper:hover .delete-btn, .message-wrapper.long-press .delete-btn { opacity: 1; transform: scale(1.1); }
  </style>
</head>
<body>

<header class="glass mx-4 mt-4 rounded-2xl p-5 shadow-2xl">
  <div class="flex items-center gap-4">
    <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center text-2xl font-black">MZ</div>
    <div>
      <h1 class="text-2xl font-bold bg-gradient-to-r from-cyan-300 to-purple-400 bg-clip-text text-transparent">
        Global Anonymous Room
      </h1>
      <p class="text-sm opacity-80" id="anonNameDisplay">Choosing name...</p>
    </div>
  </div>
</header>

<div id="messages" class="px-4">
  <div class="text-center text-sm opacity-60 py-32">Welcome! Keep chat clean</div>
</div>

<!-- INPUT BAR KE ANDAR HI DROPDOWN RAKHA (Perfect alignment ke liye) -->
<div class="input-bar">
  <div class="max-w-5xl mx-auto relative"> <!-- relative add kiya -->
    <div id="mentionSuggestions" class="mention-suggestions glass"></div>
    <div class="glass shadow-2xl rounded-2xl relative overflow-hidden">
      <div class="flex items-center gap-3 p-4">
        <input type="file" id="mediaInput" accept="image/*,video/*" hidden>
        <button id="mediaBtn" class="p-4 rounded-xl bg-white/10 hover:bg-white/20 transition">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
        </button>
        <input id="msgInput" type="text" placeholder="Message or @mention..." class="flex-1">
        <button id="sendBtn">↑</button>
      </div>
    </div>
  </div>
</div>

<div id="imageViewerModal" onclick="closeImageViewer()">
  <img id="viewerImage" src="">
</div>

<div id="toastHolder" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 space-y-2"></div>

<script>
  const messagesEl = document.getElementById('messages');
  const msgInput = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');
  const mediaInput = document.getElementById('mediaInput');
  const mediaBtn = document.getElementById('mediaBtn');
  const anonNameDisplay = document.getElementById('anonNameDisplay');
  const mentionSuggestions = document.getElementById('mentionSuggestions');

  const firebaseConfig = { 
    apiKey: "AIzaSyCVVqQnmO1Q83AucOqA5b5qUC4eo49sq6E", 
    authDomain: "chat-box-e01e5.firebaseapp.com", 
    databaseURL: "https://chat-box-e01e5-default-rtdb.firebaseio.com", 
    projectId: "chat-box-e01e5" 
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const chatRef = db.ref('megaChatChannel');

  let anonName = "";
  let isBanned = false;
  let currentBanLevel = 0;
  let banTimer;
  const recentNames = new Set();

  function showToast(t, e=false) {
    const el = document.createElement('div');
    el.className = 'glass px-6 py-3 rounded-xl shadow-2xl';
    el.style.background = e ? 'rgba(255,0,0,0.7)' : 'rgba(0,200,0,0.4)';
    el.textContent = t;
    document.getElementById('toastHolder').appendChild(el);
    setTimeout(() => el.remove(), 4000);
  }

  const abuseWords = ["madarchod","bhenchod","chutiya","gandu","bc","mc","fuck","shit","lund","chut","randi","harami","bhosdike"];
  function containsAbuse(t) { return abuseWords.some(w => t.toLowerCase().includes(w)); }
  function applyBan() {
    currentBanLevel++;
    const s = 60 * Math.pow(2, currentBanLevel - 1);
    const m = Math.floor(s/60);
    isBanned = true; msgInput.disabled = true;
    msgInput.placeholder = `Banned! Wait ${m}m`;
    showToast(`Gaali mat bol! Ban: ${m} min`, true);
    clearTimeout(banTimer);
    banTimer = setTimeout(() => {
      isBanned = false; msgInput.disabled = false;
      msgInput.placeholder = "Message or @mention...32";
      showToast("Ban khatam!");
    }, s * 1000);
  }

  // Name Popup
  window.addEventListener('load', () => {
    const overlay = document.createElement('div');
    overlay.style.cssText = `position:fixed;inset:0;background:rgba(0,0,0,0.95);backdrop-filter:blur(12px);z-index:999999;display:flex;align-items:center;justify-content:center;padding:20px;`;
    overlay.innerHTML = `
      <div class="glass p-8 rounded-3xl max-w-sm w-full text-center shadow-2xl">
        <h2 class="text-3xl font-bold mb-6 bg-gradient-to-r from-cyan-300 to-purple-400 bg-clip-text text-transparent">Choose Name</h2>
        <input type="text" id="nameInputPopup" placeholder="Write Any Name" maxlength="20" class="w-full px-6 py-4 rounded-2xl bg-white/10 text-white text-center mb-6 focus:outline-none">
        <button id="saveNameBtn" class="w-full py-4 rounded-2xl bg-gradient-to-r from-cyan-500 to-purple-600 font-bold text-lg hover:scale-105 transition">Join Chat</button>
      </div>`;
    document.body.appendChild(overlay);
    const input = overlay.querySelector('#nameInputPopup');
    input.focus();
    const save = () => {
      anonName = input.value.trim() || "User" + Math.floor(Math.random()*9999);
      if (anonName.length > 20) anonName = anonName.slice(0,20);
      anonNameDisplay.textContent = `You are: ${anonName}`;
      overlay.remove();
    };
    input.addEventListener('keydown', e => e.key === 'Enter' && save());
    overlay.querySelector('#saveNameBtn').onclick = save;
  });

  // @Mention – Fixed position
  msgInput.addEventListener('input', () => {
    const val = msgInput.value;
    const cursor = msgInput.selectionStart;
    const lastAt = val.lastIndexOf('@', cursor - 1);

    if (lastAt !== -1 && (lastAt === 0 || /\s/.test(val[lastAt - 1]))) {
      const query = val.slice(lastAt + 1, cursor).toLowerCase();
      const matches = Array.from(recentNames).filter(n => n.toLowerCase().includes(query)).slice(0, 8);
      if (matches.length > 0) {
        mentionSuggestions.innerHTML = matches.map(n => 
          `<div class="mention-item" onclick="selectMention('${n}')">@${n}</div>`
        ).join('');
        mentionSuggestions.style.display = 'block';
      } else {
        mentionSuggestions.style.display = 'none';
      }
    } else {
      mentionSuggestions.style.display = 'none';
    }

    sendBtn.classList.toggle('show', val.trim().length > 0);
  });

  window.selectMention = function(name) {
    const val = msgInput.value;
    const cursor = msgInput.selectionStart;
    const lastAt = val.lastIndexOf('@', cursor - 1);
    msgInput.value = val.slice(0, lastAt) + `@${name} ` + val.slice(cursor);
    mentionSuggestions.style.display = 'none';
    msgInput.focus();
  };

  // Send Message
  function sendMessage() {
    if (isBanned) return showToast("Banned hai tu!", true);
    let text = msgInput.value.trim();
    if (!text) return;

    if (containsAbuse(text)) { applyBan(); msgInput.value=''; sendBtn.classList.remove('show'); return; }

    const yt = text.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&\n?#]+)/i);
    const payload = yt ? 
      { name: anonName, videoId: yt[1], text, type: 'video_link', time: Date.now() } :
      { name: anonName, text, type: 'text', time: Date.now() };

    chatRef.push(payload);
    msgInput.value = ''; sendBtn.classList.remove('show');
    mentionSuggestions.style.display = 'none';
  }

  msgInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  sendBtn.onclick = sendMessage;

  // Media Upload
  mediaBtn.onclick = () => isBanned ? showToast("Banned!", true) : mediaInput.click();
  mediaInput.onchange = () => {
    if (isBanned) return;
    const file = mediaInput.files[0];
    if (!file || file.size > 2*1024*1024) return showToast("Max 2MB", true);
    const reader = new FileReader();
    reader.onload = e => chatRef.push({
      name: anonName,
      type: file.type.startsWith('image/') ? 'image' : 'video_file',
      [file.type.startsWith('image/') ? 'image' : 'video']: e.target.result,
      time: Date.now()
    });
    reader.readAsDataURL(file);
    mediaInput.value = '';
  };

  function openImageViewer(u) { document.getElementById('viewerImage').src = u; document.getElementById('imageViewerModal').classList.add('show'); }
  function closeImageViewer() { document.getElementById('imageViewerModal').classList.remove('show'); }

  // Render Messages + Delete
  function render(s) {
    const v = s.val(), key = s.key;
    if (!v) return;
    recentNames.add(v.name);

    const mine = v.name === anonName;
    const wrapper = document.createElement('div');
    wrapper.className = `message-wrapper relative flex gap-3 items-end mb-4 ${mine ? 'flex-row-reverse' : ''}`;

    if (!mine) {
      const av = document.createElement('div');
      av.className = 'w-10 h-10 rounded-xl bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center font-bold text-sm';
      av.textContent = (v.name[0]||'?').toUpperCase();
      wrapper.appendChild(av);
    }

    const bubble = document.createElement('div');
    bubble.className = `max-w-xs px-5 py-3 rounded-2xl glass ${mine ? 'bg-gradient-to-r from-cyan-500 to-purple-600' : 'bg-white/10'}`;
    const time = new Date(v.time).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    let content = `<div class="text-xs opacity-70 mb-1">${mine?'You':v.name} • ${time}</div>`;

    if (v.type === 'image') content += `<img src="${v.image}" class="max-w-full rounded-xl mt-2 cursor-pointer" onclick="openImageViewer('${v.image}')">`;
    else if (v.type === 'video_file') content += `<video src="${v.video}" controls class="max-w-full rounded-xl mt-2"></video>`;
    else if (v.type === 'video_link') content += `<a href="https://youtube.com/watch?v=${v.videoId}" target="_blank" class="block"><img src="https://img.youtube.com/vi/${v.videoId}/hqdefault.jpg" class="w-full rounded-xl"><div class="text-center mt-2 text-sm">Play on YouTube</div></a>`;
    else {
      let text = (v.text||'').replace(/\n/g,'<br>');
      text = text.replace(/@([\w]+)/g, '<span class="mention">@$1</span>');
      content += `<p class="break-words">${text}</p>`;
    }

    bubble.innerHTML = content;
    wrapper.appendChild(bubble);

    if (mine) {
      const del = document.createElement('div');
      del.className = 'delete-btn'; del.innerHTML = '×';
      del.onclick = e => { e.stopPropagation(); if(confirm("Delete?")) chatRef.child(key).remove(); };
      wrapper.appendChild(del);
    }

    if (!mine && v.text && v.text.includes(`@${anonName}`)) {
      wrapper.classList.add('mentioned-message');
      wrapper.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    messagesEl.appendChild(wrapper);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  chatRef.limitToLast(200).on('child_added', render);
  chatRef.on('child_removed', () => {
    messagesEl.innerHTML = '<div class="text-center text-sm opacity-60 py-32">Welcome! Keep chat clean</div>';
    chatRef.limitToLast(200).once('value', s => s.forEach(render));
  });
</script>
</body>
</html>
