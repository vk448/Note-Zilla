<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Web</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

<!-- Name Screen -->
<div id="nameScreen">
    <div class="container">
        <img src="images/worldchat.png" alt="WhatsApp" width="100" style="border-radius: 50%;">
        <h2>NoteZilla Chat Web App</h2>
        <p>Enter your name to join</p>
        <input type="text" id="nameInput" placeholder="Your Name" maxlength="30">
        <div class="profile-upload">
            <img id="profilePreview" src="https://via.placeholder.com/120/00a884/ffffff?text=👤" alt="Profile">
            <input type="file" id="profilePhoto" accept="image/*">
             <label for="profilePhoto">Choose Profile Photo</label>
        </div>
        <button id="joinBtn">Continue →</button>
    </div>
</div>

<!-- Main App -->
<div id="app" class="app">
    <div class="sidebar">
        <div class="header">
            <div class="profile-section">
                <img id="myAvatar" src="">
                <h3 id="myName">You</h3>
            </div>
            <div class="header-right">
                <button id="worldGroupBtn" title="World Group Chat">👥</button>
            </div>
        </div>
        <div class="chat-list" id="chatList"></div>
    </div>

    <div class="main-chat">
        <div class="chat-header">
            <button id="backBtn" class="back-btn">←</button>
            <img id="partnerAvatar" src="">
            <div>
                <h3 id="partnerName">Select a chat</h3>
                <p id="partnerStatus">Click a user or group</p>
            </div>
        </div>
        <div class="messages" id="messages"></div>
        <div class="footer">
            <input type="text" id="msgInput" placeholder="Type a message">
            <label class="attach-btn">📎
                <input type="file" id="mediaInput" accept="image/*,video/*" hidden>
            </label>
            <button id="recordBtn">🎙️</button>
            <button id="sendBtn">➤</button>
        </div>
    </div>
</div>

<!-- Full Screen Image Modal -->
<div id="imageModal" class="image-modal">
    <span class="close-modal" onclick="closeImageModal()">×</span>
    <img id="modalImage" src="">
</div>

<!-- Sounds -->
<audio id="incoming" src="sound/s1.mp3"></audio>
<audio id="outgoing" src="sound/s2.mp3"></audio>
<audio id="typingSound" src="sound/s3.mp3"></audio>

<script src="js/firebase.js"></script>
<script src="js/recorder.js"></script>
<script src="js/main.js"></script>
<script>
    // Profile photo preview on select (immediate preview)
document.getElementById('profilePhoto').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = (ev) => {
            document.getElementById('profilePreview').src = ev.target.result;
        };
        reader.readAsDataURL(file);
    } else {
        document.getElementById('profilePreview').src = 'https://via.placeholder.com/120/00a884/ffffff?text=👤';
    }
});
</script>
</body>
</html>
