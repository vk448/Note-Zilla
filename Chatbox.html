<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anonymous Chat</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<link rel="stylesheet" href="chatbox.css">

</head>

<body class="h-screen flex flex-col">

<!-- TOP BAR -->
<div class="glass-header w-full p-4 text-center text-2xl font-semibold tracking-wide shadow-lg">
  Anonymous Chat
</div>

<!-- CHAT BOX -->
<div id="messages" class="flex-1 overflow-y-auto p-4 space-y-3"></div>

<!-- INPUT BAR -->
<div class="p-4 backdrop-blur-lg bg-[rgba(255,255,255,0.05)] border-t border-[rgba(255,255,255,0.08)] flex gap-3">
  <input id="msgInput"
         type="text"
         placeholder="Type a message..."
         class="flex-1 p-3 rounded-full bg-[rgba(255,255,255,0.12)] border border-white/10 outline-none text-white placeholder-gray-300">
  <button onclick="sendMessage()"
          class="px-5 py-3 bg-blue-600 rounded-full shadow-lg hover:bg-blue-700 active:scale-95 transition">
    Send
  </button>
</div>

<!-- Toast container -->
<div id="toastWrapper"></div>

<script>
// Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyCVVqQnmO1Q83AucOqA5b5qUC4eo49sq6E",
  authDomain: "chat-box-e01e5.firebaseapp.com",
  databaseURL: "https://chat-box-e01e5-default-rtdb.firebaseio.com",
  projectId: "chat-box-e01e5",
  storageBucket: "chat-box-e01e5.appspot.com",
  messagingSenderId: "77418949896",
  appId: "1:77418949896:web:e789dca08f4a6e9af86e49",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// Ask Notification Permission
if ("Notification" in window) {
  Notification.requestPermission();
}

// Toast message fallback
function showToast(text) {
  const div = document.createElement("div");
  div.className = "toast";
  div.textContent = text;

  document.getElementById("toastWrapper").appendChild(div);

  setTimeout(() => {
    div.style.opacity = "0";
    div.style.transform = "translateY(10px)";
    setTimeout(() => div.remove(), 400);
  }, 3000);
}

// Browser notification
function showMessageNotification(title, body) {
  if ("Notification" in window && Notification.permission === "granted") {
    try { new Notification(title, { body }); return; }
    catch (err) {}
  }
  showToast(`${title}: ${body}`);
}

// Generate random anonymous name
let anonName = "anonymous" + Math.floor(Math.random() * 9999);

// Send message
function sendMessage() {
  let text = msgInput.value.trim();
  if (!text) return;

  db.ref("anonChat").push({
    name: anonName,
    text: text,
    time: Date.now()
  });

  msgInput.value = "";
}

// Receive messages
db.ref("anonChat").on("child_added", snap => {
  const v = snap.val();
  const mine = (v.name === anonName);

  const box = document.createElement("div");
  box.className =
    "message max-w-[70%] p-3 rounded-2xl shadow-lg break-words " +
    (mine
      ? "bg-blue-600 text-white ml-auto rounded-br-none"
      : "bg-white/10 backdrop-blur-md border border-white/10 rounded-bl-none");

  box.innerHTML = `<span class="text-xs opacity-70">${v.name}</span><br>${v.text}`;

  messages.appendChild(box);

  messages.scrollTop = messages.scrollHeight;

  if (!mine) showMessageNotification(v.name, v.text);
});

msgInput.addEventListener("keydown", e => {
  if (e.key === "Enter") sendMessage();
});
</script>

</body>
</html>
