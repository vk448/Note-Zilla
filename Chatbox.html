<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0e1f" />
  <title>Mega Chat — Global Anonymous Room</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: 'Inter', sans-serif; background: #0a0e1f; }
    .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(0, 231, 255, 0.2); border-radius: 20px; }
    #messages { height: calc(100vh - 170px); overflow-y: auto; padding: 20px 16px 140px 16px; }
    .input-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom));
      background: #0a0e1f; border-top: 1px solid rgba(0,231,255,0.2); z-index: 9999;
    }

    /* IMAGE VIEWER MODAL */
    #imageViewerModal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 99999;
      display: none; align-items: center; justify-content: center; padding: 20px;
    }
    #imageViewerModal.show { display: flex; }
    #viewerImage {
      max-width: 100%; max-height: 100%; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.8);
      object-fit: contain; cursor: zoom-in;
    }
    #viewerImage.zoomed { cursor: zoom-out; transform: scale(2); transition: transform 0.3s; }
    .close-viewer {
      position: absolute; top: 20px; right: 20px; width: 50px; height: 50px;
      background: rgba(255,255,255,0.2); border-radius: 50%; display: grid; place-items: center;
      font-size: 28px; cursor: pointer; z-index: 100;
    }
  </style>
</head>
<body class="text-white">

  <!-- Header -->
  <header class="glass mx-4 mt-4 rounded-2xl p-5 shadow-2xl">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center text-2xl font-black">MZ</div>
        <div>
          <h1 class="text-2xl font-bold bg-gradient-to-r from-cyan-300 to-purple-400 bg-clip-text text-transparent">
            Global Anonymous Room
          </h1>
          <p class="text-sm opacity-80" id="anonNameDisplay">You are: Loading...</p>
        </div>
      </div>
    </div>
  </header>

  <!-- Messages -->
  <div id="messages" class="px-4">
    <div class="text-center text-sm opacity-60 py-32">Welcome to Mega Chat 👋</div>
  </div>

  <!-- Fixed Input Bar -->
  <div class="input-bar">
    <div class="max-w-5xl mx-auto">
      <div class="glass shadow-2xl flex items-center gap-3 p-4 rounded-2xl">
        <input type="file" id="mediaInput" accept="image/*,video/*" hidden>
        <button id="mediaBtn" class="p-4 rounded-xl bg-white/10 hover:bg-white/20 active:scale-95">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
        </button>
        <input id="msgInput" type="text" placeholder="Message or YouTube link..."
               class="flex-1 px-5 py-4 bg-white/10 rounded-2xl focus:outline-none focus:ring-4 focus:ring-cyan-500/40 text-base">
       
      </div>
    </div>
  </div>

  <!-- IMAGE VIEWER MODAL (NEW & BEAUTIFUL) -->
  <div id="imageViewerModal" onclick="closeImageViewer()">
    <div class="close-viewer" onclick="closeImageViewer()">×</div>
    <img id="viewerImage" src="" alt="Full view" onclick="event.stopPropagation(); this.classList.toggle('zoomed')">
  </div>

  <!-- Toast -->
  <div id="toastHolder" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 space-y-2"></div>

  <!-- FULL SCRIPT WITH IMAGE VIEWER SUPPORT -->
  <script>
    const messagesEl = document.getElementById('messages');
    const msgInput = document.getElementById('msgInput');
    const mediaInput = document.getElementById('mediaInput');
    const mediaBtn = document.getElementById('mediaBtn');
    const sendBtn = document.getElementById('sendBtn');
    const anonNameDisplay = document.getElementById('anonNameDisplay');
    const imageViewerModal = document.getElementById('imageViewerModal');
    const viewerImage = document.getElementById('viewerImage');

    const firebaseConfig = {
      apiKey: "AIzaSyCVVqQnmO1Q83AucOqA5b5qUC4eo49sq6E",
      authDomain: "chat-box-e01e5.firebaseapp.com",
      databaseURL: "https://chat-box-e01e5-default-rtdb.firebaseio.com",
      projectId: "chat-box-e01e5",
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let anonName = localStorage.getItem('megaAnonName') || ("User-" + Math.floor(Math.random() * 9000 + 1000));
    localStorage.setItem('megaAnonName', anonName);
    anonNameDisplay.textContent = `You are: ${anonName}`;

    function showToast(t, err = false) {
      const d = document.createElement('div');
      d.className = 'glass px-6 py-3 rounded-xl';
      d.style.background = err ? 'rgba(255,0,0,0.5)' : 'rgba(0,200,0,0.4)';
      d.textContent = t;
      document.getElementById('toastHolder').appendChild(d);
      setTimeout(() => d.remove(), 3000);
    }

    // IMAGE VIEWER FUNCTIONS
    function openImageViewer(url) {
      viewerImage.src = url;
      imageViewerModal.classList.add('show');
    }
    function closeImageViewer() {
      imageViewerModal.classList.remove('show');
      viewerImage.src = '';
      viewerImage.classList.remove('zoomed');
    }

    function sendMessage() {
      const text = msgInput.value.trim();
      if (!text) return;
      const yt = text.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&\n?#]+)/i);
      const payload = yt ? 
        { name: anonName, videoId: yt[1], text, type: 'video_link', time: Date.now() } :
        { name: anonName, text, type: 'text', time: Date.now() };
      db.ref('megaChatChannel').push(payload);
      msgInput.value = '';
    }

    sendBtn.onclick = sendMessage;
    msgInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    mediaBtn.onclick = () => mediaInput.click();
    mediaInput.onchange = () => {
      const file = mediaInput.files[0];
      if (!file) return;
      if (file.size > 2*1024*1024) return showToast('Max 2MB', true);
      const reader = new FileReader();
      reader.onload = e => {
        db.ref('megaChatChannel').push({
          name: anonName,
          type: file.type.startsWith('image/') ? 'image' : 'video_file',
          [file.type.startsWith('image/') ? 'image' : 'video']: e.target.result,
          time: Date.now()
        });
        mediaInput.value = '';
      };
      reader.readAsDataURL(file);
    };

    function render(v) {
      if (!v) return;
      const mine = v.name === anonName;
      const row = document.createElement('div');
      row.className = `flex gap-3 items-end mb-4 ${mine ? 'flex-row-reverse' : ''}`;

      if (!mine) {
        const av = document.createElement('div');
        av.className = 'w-10 h-10 rounded-xl bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center font-bold text-sm';
        av.textContent = v.name[0];
        row.appendChild(av);
      }

      const bubble = document.createElement('div');
      bubble.className = `max-w-xs px-5 py-3 rounded-2xl glass ${mine ? 'bg-gradient-to-r from-cyan-500 to-purple-600' : 'bg-white/10'}`;
      const time = new Date(v.time).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      bubble.innerHTML = `<div class="text-xs opacity-70 mb-1">${mine ? 'You' : v.name} • ${time}</div>`;

      if (v.type === 'image' || (v.image && v.type !== 'video_file')) {
        bubble.innerHTML += `<img src="${v.image}" class="max-w-full rounded-xl mt-2 cursor-pointer" onclick="openImageViewer('${v.image}')">`;
      } else if (v.type === 'video_file') {
        bubble.innerHTML += `<video src="${v.video}" controls class="max-w-full rounded-xl mt-2"></video>`;
      } else if (v.type === 'video_link') {
        bubble.innerHTML += `<a href="https://youtube.com/watch?v=${v.videoId}" target="_blank" class="block">
          <img src="https://img.youtube.com/vi/${v.videoId}/hqdefault.jpg" class="w-full rounded-xl">
          <div class="text-center mt-2 text-sm">▶ Play on YouTube</div></a>`;
      } else {
        bubble.innerHTML += `<p class="break-words">${(v.text||'').replace(/\n/g,'<br>')}</p>`;
      }

      row.appendChild(bubble);
      messagesEl.appendChild(row);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    db.ref('megaChatChannel').limitToLast(200).on('child_added', s => render(s.val()));
  </script>
</body>
</html>
