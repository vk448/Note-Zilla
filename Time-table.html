<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class IX A - Time Table</title>
  <link rel="icon" href="Images/Favicon.png">
  <meta name="google-site-verification" content="C2-yDbzzyS4qMdBWgM3WARN6saZ1KX7ndHrd_Uc38mg" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* ===================================
       FULL STANDALONE CSS - COSMIC PREMIUM DESIGN (LIKE HOME PAGE)
       =================================== */

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: #0f0c29;
      color: #e0e7ff;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background 0.8s ease;
    }

    body.dark {
      background: #0a0719;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* Header */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      padding: clamp(1.2rem, 3vw, 2rem) 5% clamp(1.5rem, 4vw, 2.5rem);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 12, 41, 0.4);
      backdrop-filter: blur(30px);
      border-bottom: 1px solid rgba(124, 58, 237, 0.2);
      z-index: 1000;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    }

    .logo {
      font-size: clamp(2.2rem, 6vw, 3rem);
      font-weight: 900;
      background: linear-gradient(135deg, #a78bfa, #ec4899, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      cursor: pointer;
      transition: transform 0.4s ease;
    }

    .logo:hover {
      transform: scale(1.05) rotate(2deg);
    }

    nav {
      display: flex;
      align-items: center;
      gap: clamp(2rem, 5vw, 4rem);
    }

    nav a {
      font-weight: 600;
      font-size: clamp(1.1rem, 2.5vw, 1.3rem);
      position: relative;
      transition: all 0.4s ease;
    }

    nav a::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 0;
      height: 3px;
      background: linear-gradient(135deg, #7c3aed, #ec4899);
      border-radius: 4px;
      transition: all 0.5s ease;
      transform: translateX(-50%);
    }

    nav a:hover::after, nav a.active::after { width: 100%; }
    nav a:hover, nav a.active { color: #fbbf24; transform: translateY(-4px); }

    .hamburger {
      display: none;
      flex-direction: column;
      gap: 8px;
      cursor: pointer;
      z-index: 1001;
    }

    .hamburger div {
      width: 40px;
      height: 5px;
      background: #c4b5fd;
      border-radius: 3px;
      transition: all 0.4s ease;
    }

    /* Page Hero */
    .page-hero {
      position: relative;
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: clamp(100px, 15vw, 180px) 5% 80px;
      margin-top: 80px;
      overflow: hidden;
    }

    .page-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -2;
      background: radial-gradient(circle at 20% 80%, #7c3aed 0%, transparent 50%),
                  radial-gradient(circle at 80% 20%, #ec4899 0%, transparent 50%),
                  radial-gradient(circle at 50% 50%, #3b82f6 0%, transparent 40%);
      opacity: 0.6;
      animation: smoothFloat 28s ease-in-out infinite;
    }

    .page-hero::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(135deg, #1e1b4b 0%, #2d1b69 60%, #4c1d95 100%);
      opacity: 0.95;
    }

    @keyframes smoothFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(4%, -4%) scale(1.03); }
      66% { transform: translate(-3%, 3%) scale(1.02); }
    }

    .page-hero h1 {
      font-size: clamp(3.5rem, 9vw, 6rem);
      font-weight: 900;
      margin-bottom: 1.5rem;
      background: linear-gradient(135deg, #c4b5fd, #fbbf24, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .page-hero p {
      font-size: clamp(1.4rem, 4vw, 2rem);
      max-width: 800px;
      opacity: 0.9;
    }

    /* Table */
    .table-container {
      margin: 100px auto;
      padding: 0 5%;
      max-width: 1400px;
    }

    .table-wrapper {
      background: rgba(30, 27, 75, 0.4);
      backdrop-filter: blur(30px);
      border-radius: 40px;
      padding: clamp(2rem, 5vw, 3rem);
      box-shadow: 0 30px 80px rgba(124, 58, 237, 0.3);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
    }

    th, td {
      padding: clamp(1rem, 2vw, 1.5rem);
      text-align: center;
      font-size: clamp(1rem, 2vw, 1.2rem);
    }

    th {
      background: rgba(124, 58, 237, 0.6);
      color: white;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    td {
      background: rgba(255, 255, 255, 0.05);
      transition: background 0.3s ease;
    }

    tr:hover td {
      background: rgba(236, 72, 153, 0.2);
    }

    tr.recess td {
      color: #ff6b6b !important;
      font-weight: bold;
      background: rgba(255, 107, 107, 0.15) !important;
    }

    /* Footer */
    footer {
      background: linear-gradient(135deg, #1e1b4b, #0f0c29);
      padding: clamp(4rem, 8vw, 6rem) 5%;
      text-align: center;
      border-top: 1px solid rgba(124, 58, 237, 0.3);
    }

    footer p {
      font-size: clamp(1rem, 2vw, 1.3rem);
      opacity: 0.9;
    }

    footer span {
      background: linear-gradient(135deg, #a78bfa, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
    }

    @media (max-width: 768px) {
      .hamburger { display: flex; }
      nav {
        position: fixed;
        top: 100%;
        left: -100%;
        width: 100%;
        background: rgba(15, 12, 41, 0.95);
        flex-direction: column;
        padding: 4rem 0;
        transition: left 0.6s ease;
        gap: 2.5rem;
        align-items: center;
        backdrop-filter: blur(30px);
      }
      nav.active { left: 0; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo" onclick="window.location.href='index.html'">NoteZilla</div>
    <div class="hamburger" onclick="toggleMenu(this)">
      <div></div><div></div><div></div>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="#timetable" class="active">Time Table</a>
      <a href="credit.html">About</a>
      <a href="contact.html">Contact</a>
      <button class="toggle-dark" id="darkToggle">☾</button>
    </nav>
  </header>

  <section class="page-hero">
    <h1>Class IX A - Time Table</h1>
    <p>Complete daily schedule with periods, subjects, teachers, and timings.</p>
  </section>

  <div class="table-container">
    <div class="table-wrapper">
      <table id="timetableTable">
        <thead>
          <tr>
            <th>Time</th>
            <th>Period</th>
            <th>Subject / Teacher</th>
            <th>Days</th>
          </tr>
        </thead>
        <tbody>
          <!-- Filled by JS -->
        </tbody>
      </table>
    </div>
  </div>

  <footer>
    <p>© 2025 <span>NoteZilla</span> · All Rights Reserved</p>
  </footer>

  <script>
    // Hamburger Menu
    function toggleMenu(el) {
      document.querySelector('nav').classList.toggle('active');
      el.classList.toggle('open');
    }

    // Dark Mode Toggle
    document.getElementById('darkToggle')?.addEventListener('click', () => {
      document.body.classList.toggle('dark');
    });

    // Header Scroll Effect
    window.addEventListener('scroll', () => {
      const header = document.querySelector('header');
      if (window.scrollY > 50) {
        header.style.background = 'rgba(15, 12, 41, 0.8)';
        header.style.backdropFilter = 'blur(40px)';
      } else {
        header.style.background = 'rgba(15, 12, 41, 0.4)';
        header.style.backdropFilter = 'blur(30px)';
      }
    });

    // Time Table Script - FULLY WORKING
    const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbyWteSKyyQH_5c1FPCO8018ih5rl1J8uAMN0QQ2YWg8n5JBKwgZEh2XGn4SKRXmpx1-/exec";
    const STORAGE_KEY = "timetableData";

    function renderTable(rows) {
      const tbody = document.querySelector("#timetableTable tbody");
      tbody.innerHTML = "";

      if (!rows || rows.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4">No timetable data available.</td></tr>`;
        return;
      }

      rows.forEach(row => {
        const tr = document.createElement("tr");

        const isRecess = (row.Period || "").toLowerCase().includes("recess") || 
                         (row.SubjectTeacher || "").toLowerCase().includes("recess");

        if (isRecess) tr.classList.add("recess");

        tr.innerHTML = `
          <td>${row.Time || ''}</td>
          <td>${row.Period || ''}</td>
          <td>${row.SubjectTeacher || ''}</td>
          <td>${row.Days || ''}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Load cached data instantly
    const cached = localStorage.getItem(STORAGE_KEY);
    if (cached) {
      try {
        renderTable(JSON.parse(cached));
      } catch (e) {
        localStorage.removeItem(STORAGE_KEY);
      }
    }

    // Fetch fresh data
    fetch(SHEET_API_URL)
      .then(res => res.json())
      .then(data => {
        renderTable(data);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      })
      .catch(err => {
        console.error("Failed to load timetable:", err);
        if (!document.querySelector("#timetableTable tbody").innerHTML) {
          document.querySelector("#timetableTable tbody").innerHTML = 
            `<tr><td colspan="4">Unable to load timetable. Please try again later.</td></tr>`;
        }
      });
  </script>

  <script src="Record.js"></script>
</body>
</html>
