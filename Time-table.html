<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class IX A - Time Table</title>
  <link rel="icon" href="Images/Favicon.png">
  <meta name="google-site-verification" content="C2-yDbzzyS4qMdBWgM3WARN6saZ1KX7ndHrd_Uc38mg" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* ===================================
       FULL STANDALONE CSS - EXACTLY LIKE HOME PAGE (COSMIC PREMIUM DESIGN)
       =================================== */

    /* Global Reset & Base */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: #0f0c29;
      color: #e0e7ff;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background 0.8s ease;
    }

    body.dark {
      background: #0a0719;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      outline: none;
      font-family: inherit;
    }

    /* Hero Background Animation */
    .page-hero {
      position: relative;
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: clamp(100px, 15vw, 180px) 5% 80px;
      margin-top: 80px;
      overflow: hidden;
    }

    .page-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -2;
      background: 
        radial-gradient(circle at 20% 80%, #7c3aed 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, #ec4899 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, #3b82f6 0%, transparent 40%);
      opacity: 0.6;
      animation: smoothFloat 28s ease-in-out infinite;
      will-change: transform;
    }

    .page-hero::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(135deg, #1e1b4b 0%, #2d1b69 60%, #4c1d95 100%);
      opacity: 0.95;
    }

    @keyframes smoothFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(4%, -4%) scale(1.03); }
      66% { transform: translate(-3%, 3%) scale(1.02); }
    }

    @media (prefers-reduced-motion: reduce) {
      .page-hero::before { animation: none; }
    }

    /* Header */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      padding: clamp(1.2rem, 3vw, 2rem) 5% clamp(1.5rem, 4vw, 2.5rem);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 12, 41, 0.4);
      backdrop-filter: blur(30px);
      border-bottom: 1px solid rgba(124, 58, 237, 0.2);
      z-index: 1000;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      transition: all 0.4s ease;
    }

    .logo {
      font-size: clamp(2.2rem, 6vw, 3rem);
      font-weight: 900;
      background: linear-gradient(135deg, #a78bfa, #ec4899, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      transition: transform 0.4s ease;
      cursor: pointer;
    }

    .logo:hover {
      transform: scale(1.05) rotate(2deg);
    }

    nav {
      display: flex;
      align-items: center;
      gap: clamp(2rem, 5vw, 4rem);
    }

    nav a {
      font-weight: 600;
      font-size: clamp(1.1rem, 2.5vw, 1.3rem);
      position: relative;
      transition: all 0.4s ease;
      padding: 0.5rem 0;
    }

    nav a::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 0;
      height: 3px;
      background: linear-gradient(135deg, #7c3aed, #ec4899);
      border-radius: 4px;
      transition: all 0.5s ease;
      transform: translateX(-50%);
    }

    nav a:hover::after, nav a.active::after { width: 100%; }
    nav a:hover, nav a.active { color: #fbbf24; transform: translateY(-4px); }

    .hamburger {
      display: none;
      flex-direction: column;
      gap: 8px;
      cursor: pointer;
      z-index: 1001;
    }

    .hamburger div {
      width: 40px;
      height: 5px;
      background: #c4b5fd;
      border-radius: 3px;
      transition: all 0.4s ease;
    }

    /* Page Hero Text */
    .page-hero h1 {
      font-size: clamp(3.5rem, 9vw, 6rem);
      font-weight: 900;
      margin-bottom: 1.5rem;
      background: linear-gradient(135deg, #c4b5fd, #fbbf24, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .page-hero p {
      font-size: clamp(1.4rem, 4vw, 2rem);
      max-width: 800px;
      opacity: 0.9;
    }

    /* Table Container */
    .table-container {
      margin-top: 100px;
      padding: 0 5%;
      max-width: 1400px;
      margin-left: auto;
      margin-right: auto;
    }

    .table-wrapper {
      background: rgba(30, 27, 75, 0.4);
      backdrop-filter: blur(30px);
      border-radius: 40px;
      padding: clamp(2rem, 5vw, 3rem);
      box-shadow: 0 30px 80px rgba(124, 58, 237, 0.3);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
    }

    th, td {
      padding: clamp(1rem, 2vw, 1.5rem);
      text-align: center;
      font-size: clamp(1rem, 2vw, 1.2rem);
    }

    th {
      background: rgba(124, 58, 237, 0.6);
      color: white;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    td {
      background: rgba(255, 255, 255, 0.05);
      transition: background 0.3s ease;
    }

    tr:hover td {
      background: rgba(236, 72, 153, 0.2);
    }

    /* Recess Highlight */
    tr.recess td {
      color: #ff6b6b !important;
      font-weight: bold;
      background: rgba(255, 107, 107, 0.15) !important;
    }

    /* Footer */
    footer {
      background: linear-gradient(135deg, #1e1b4b, #0f0c29);
      padding: clamp(4rem, 8vw, 6rem) 5%;
      text-align: center;
      border-top: 1px solid rgba(124, 58, 237, 0.3);
      margin-top: auto;
    }

    footer p {
      font-size: clamp(1rem, 2vw, 1.3rem);
      opacity: 0.9;
    }

    footer span {
      background: linear-gradient(135deg, #a78bfa, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .hamburger { display: flex; }
      nav {
        position: fixed;
        top: 100%;
        left: -100%;
        width: 100%;
        background: rgba(15, 12, 41, 0.95);
        flex-direction: column;
        padding: 4rem 0;
        transition: left 0.6s ease;
        gap: 2.5rem;
        align-items: center;
        backdrop-filter: blur(30px);
      }
      nav.active { left: 0; }
      th, td { padding: 12px 8px; font-size: 14px; }
    }

    @media (max-width: 480px) {
      th, td { padding: 10px 6px; font-size: 13px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo" onclick="window.location.href='index.html'">NoteZilla</div>
    <div class="hamburger" onclick="toggleMenu(this)">
      <div></div><div></div><div></div>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="#timetable" class="active">Time Table</a>
      <a href="credit.html">About</a>
      <a href="contact.html">Contact</a>
      <button class="toggle-dark" id="darkToggle">☾</button>
    </nav>
  </header>

  <section class="page-hero">
    <h1>Class IX A - Time Table</h1>
    <p>Complete daily schedule with periods, subjects, teachers, and timings.</p>
  </section>

  <div class="table-container">
    <div class="table-wrapper">
      <table id="timetableTable">
        <thead>
          <tr>
            <th>Time</th>
            <th>Period</th>
            <th>Subject / Teacher</th>
            <th>Days</th>
          </tr>
        </thead>
        <tbody>
          <!-- Rows will be populated by JS -->
        </tbody>
      </table>
    </div>
  </div>

  <footer>
    <p>© 2025 <span>NoteZilla</span> · All Rights Reserved</p>
  </footer>

 <script>
function toggleMenu(element) {
  const nav = document.querySelector('header nav');
  nav.classList.toggle('active');
  element.classList.toggle('open');
}

const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbyWteSKyyQH_5c1FPCO8018ih5rl1J8uAMN0QQ2YWg8n5JBKwgZEh2XGn4SKRXmpx1-/exec"; // replace with your URL
const STORAGE_KEY = "timetableData";

function renderTable(rows) {
  const tbody = document.querySelector("#timetableTable tbody");
  tbody.innerHTML = "";
  rows.forEach(row => {
    const tr = document.createElement("tr");

    // Check if the period is "Recess" (case-insensitive)
    const isRecess = (row.Period || "").toLowerCase().includes("recess") || 
                     (row.SubjectTeacher || "").toLowerCase().includes("recess");

    tr.innerHTML = `
      <td>${row.Time}</td>
      <td style="${isRecess ? 'color:red; font-weight:bold;' : ''}">${row.Period}</td>
      <td style="${isRecess ? 'color:red; font-weight:bold;' : ''}">${row.SubjectTeacher}</td>
      <td>${row.Days}</td>
    `;
    tbody.appendChild(tr);
  });
}

// Load from localStorage first
const cachedData = localStorage.getItem(STORAGE_KEY);
if (cachedData) {
  try {
    const parsedData = JSON.parse(cachedData);
    renderTable(parsedData);
  } catch(e) {
    console.warn("Failed to parse cached timetable:", e);
    localStorage.removeItem(STORAGE_KEY);
  }
}

// Fetch fresh data in background
fetch(SHEET_API_URL)
  .then(response => response.json())
  .then(rows => {
    renderTable(rows);
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(rows));
    } catch(e) {
      console.warn("Failed to store timetable in localStorage:", e);
    }
  })
  .catch(error => {
    console.error("Error loading timetable data:", error);
    const tbody = document.querySelector("#timetableTable tbody");
    if (!tbody.innerHTML) {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td colspan="4">Unable to load timetable.</td>`;
      tbody.appendChild(tr);
    }
  });
</script>


  <script src="Record.js"></script>
</body>
</html>
