<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoteZilla - Official Notice Board</title>
  <link rel="icon" href="Images/Favicon.png">
  <meta name="google-site-verification" content="C2-yDbzzyS4qMdBWgM3WARN6saZ1KX7ndHrd_Uc38mg" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <style>
    /* Your existing beautiful CSS remains unchanged */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: #0f0c29;
      color: #e0e7ff;
      min-height: 100vh;
      padding: clamp(2rem, 5vw, 4rem) 5%;
      overflow-y: auto;
      transition: background 0.8s ease;
    }

    body.dark { background: #0a0719; }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -2;
      background: radial-gradient(circle at 20% 80%, #7c3aed 0%, transparent 50%),
                  radial-gradient(circle at 80% 20%, #ec4899 0%, transparent 50%),
                  radial-gradient(circle at 50% 50%, #3b82f6 0%, transparent 40%);
      opacity: 0.6;
      animation: smoothFloat 28s ease-in-out infinite;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      background: linear-gradient(135deg, #1e1b4b 0%, #2d1b69 60%, #4c1d95 100%);
      opacity: 0.95;
    }

    @keyframes smoothFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(4%, -4%) scale(1.03); }
      66% { transform: translate(-3%, 3%) scale(1.02); }
    }

    .container { max-width: 1200px; margin: 0 auto; }

    header { text-align: center; margin-bottom: clamp(3rem, 8vw, 5rem); }

    header h1 {
      font-size: clamp(3.5rem, 9vw, 6rem);
      font-weight: 900;
      background: linear-gradient(135deg, #c4b5fd, #fbbf24, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1.5rem;
    }

    header p { font-size: clamp(1.4rem, 4vw, 2rem); opacity: 0.9; }

    .search-box {
      max-width: 800px;
      margin: 0 auto clamp(3rem, 8vw, 5rem);
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: clamp(1.2rem, 3vw, 1.6rem) clamp(4rem, 8vw, 5rem) clamp(1.2rem, 3vw, 1.6rem) clamp(2rem, 5vw, 3rem);
      border: none;
      border-radius: 60px;
      background: rgba(30, 27, 75, 0.6);
      backdrop-filter: blur(30px);
      color: white;
      font-size: clamp(1.2rem, 3vw, 1.6rem);
      outline: none;
      box-shadow: 0 15px 40px rgba(124, 58, 237, 0.3);
      transition: all 0.6s ease;
    }

    .search-box input::placeholder { color: rgba(255, 255, 255, 0.6); }
    .search-box input:focus { transform: scale(1.03); box-shadow: 0 25px 60px rgba(124, 58, 237, 0.5); }
    .search-box i {
      position: absolute;
      left: clamp(2rem, 5vw, 3rem);
      top: 50%;
      transform: translateY(-50%);
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      color: #a78bfa;
    }

    .notice-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: clamp(2rem, 5vw, 3rem);
    }

    .notice-card {
      background: rgba(30, 27, 75, 0.4);
      backdrop-filter: blur(30px);
      border-radius: 40px;
      padding: clamp(2rem, 5vw, 3rem);
      box-shadow: 0 30px 80px rgba(124, 58, 237, 0.3);
      border: 1px solid rgba(167, 139, 250, 0.2);
      transition: all 0.8s ease;
    }

    .notice-card:hover {
      transform: translateY(-20px) scale(1.05);
      box-shadow: 0 50px 100px rgba(124, 58, 237, 0.5);
    }

    .notice-title {
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      font-weight: 800;
      margin-bottom: 1.5rem;
      background: linear-gradient(135deg, #c4b5fd, #fbbf24);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .notice-meta {
      font-size: clamp(1rem, 2.5vw, 1.3rem);
      opacity: 0.9;
      margin-bottom: 2rem;
      line-height: 1.8;
    }

    .notice-meta span { display: block; }

    .download-pdf-btn {
      width: 100%;
      padding: clamp(1.2rem, 3vw, 1.6rem);
      background: linear-gradient(135deg, #7c3aed, #ec4899);
      color: white;
      border: none;
      border-radius: 60px;
      font-size: clamp(1.2rem, 3vw, 1.6rem);
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      box-shadow: 0 15px 40px rgba(124, 58, 237, 0.4);
      transition: all 0.6s ease;
    }

    .download-pdf-btn:hover {
      transform: translateY(-10px) scale(1.08);
      box-shadow: 0 30px 70px rgba(124, 58, 237, 0.6);
    }

    .download-pdf-btn i { font-size: clamp(1.4rem, 4vw, 1.8rem); }

    .loading, .empty-state {
      text-align: center;
      padding: clamp(5rem, 10vw, 8rem);
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 700;
      opacity: 0.9;
    }

    .loading i {
      font-size: clamp(4rem, 10vw, 6rem);
      margin-bottom: 2rem;
      animation: spin 1.5s linear infinite;
      color: #fbbf24;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state { color: #ff6b6b; }

    @media (max-width: 768px) {
      .notice-list { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>NoteZilla Notice Board</h1>
      <p>Important Announcements & Official Circulars</p>
    </header>

    <div class="search-box">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" placeholder="Search notices by title, content or issuer...">
    </div>

    <div id="loading" class="loading">
      <i class="fas fa-spinner"></i>
      <br>Loading Official Notices...
    </div>

    <div id="noticeList" class="notice-list"></div>

    <div id="emptyState" class="empty-state" style="display:none;">
      No notices found matching your search.
    </div>
  </div>

  <!-- jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <script>
    const { jsPDF } = window.jspdf;

    const firebaseConfig = {
      apiKey: "AIzaSyCVVqQnmO1Q83AucOqA5b5qUC4eo49sq6E",
      authDomain: "chat-box-e01e5.firebaseapp.com",
      databaseURL: "https://chat-box-e01e5-default-rtdb.firebaseio.com",
      projectId: "chat-box-e01e5",
      storageBucket: "chat-box-e01e5.firebasestorage.app",
      messagingSenderId: "597491149800",
      appId: "1:597491149800:web:7bd908925f70b62018125d"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const noticeList = document.getElementById('noticeList');
    const loading = document.getElementById('loading');
    const emptyState = document.getElementById('emptyState');
    const searchInput = document.getElementById('searchInput');

    let allNotices = [];

    function formatDate(timestamp) {
      if (!timestamp) return "Unknown Date";
      const date = new Date(timestamp);
      const options = { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
      return date.toLocaleDateString('en-IN', options);
    }

    // === MULTILINGUAL PDF SUPPORT ===
    async function downloadAsPDF(notice) {
      const doc = new jsPDF();

      // Load Noto Sans Devanagari + Global font (supports Hindi, English, Arabic, Chinese, etc.)
      const fontUrl = 'https://cdn.jsdelivr.net/npm/noto-sans@4.0.0/fonts/NotoSans-Regular.ttf';
      const fontResponse = await fetch(fontUrl);
      const fontArrayBuffer = await fontResponse.arrayBuffer();
      const base64Font = btoa(new Uint8Array(fontArrayBuffer).reduce((data, byte) => data + String.fromCharCode(byte), ''));

      doc.addFileToVFS('NotoSans-Regular.ttf', base64Font);
      doc.addFont('NotoSans-Regular.ttf', 'NotoSans', 'normal');
      doc.setFont('NotoSans');

      const pageWidth = doc.internal.pageSize.getWidth();
      const pageHeight = doc.internal.pageSize.getHeight();

      // Header
      doc.setFontSize(28);
      doc.setFont('helvetica', 'bold');
      doc.setTextColor(30, 64, 175);
      doc.text("OFFICIAL NOTICE", pageWidth / 2, 30, { align: "center" });

      // Title
      doc.setFont('NotoSans', 'normal');
      doc.setFontSize(20);
      doc.setTextColor(0, 0, 0);
      let y = 50;
      const titleLines = doc.splitTextToSize(notice.title || "Untitled Notice", 170);
      doc.text(titleLines, 20, y);
      y += titleLines.length * 10 + 15;

      // Meta
      doc.setFontSize(12);
      doc.setTextColor(100, 100, 100);
      doc.text(`Issued by: ${notice.name || "Admin"}`, 20, y);
      doc.text(`Date: ${formatDate(notice.timestamp)}`, 20, y + 10);
      y += 30;

      // Content - Now supports Hindi and all languages perfectly
      doc.setFontSize(14);
      doc.setTextColor(0, 0, 0);
      const content = notice.notice || "No content available.";
      const contentLines = doc.splitTextToSize(content, 170);
      doc.text(contentLines, 20, y);

      // Watermark
      doc.setFontSize(40);
      doc.setTextColor(150, 150, 150);
      doc.setGState(new doc.GState({ opacity: 0.15 }));
      doc.text("NoteZilla", pageWidth / 2, pageHeight / 2, { align: "center", angle: 45 });
      doc.setGState(new doc.GState({ opacity: 1 }));

      // Footer
      doc.setFontSize(10);
      doc.setTextColor(150, 150, 150);
      doc.text("© 2025 NoteZilla - Official Notice Board", pageWidth / 2, pageHeight - 10, { align: "center" });

      doc.save(`${(notice.title || "Notice").substring(0, 30).replace(/[^a-zA-Z0-9]/g, "_")}.pdf`);
    }

    function createNoticeCard(notice) {
      const card = document.createElement("div");
      card.className = "notice-card";

      card.innerHTML = `
        <div class="notice-title">${notice.title || "Untitled Notice"}</div>
        <div class="notice-meta">
          <span>Issued by: ${notice.name || "Admin"}</span>
          <span>Date: ${formatDate(notice.timestamp)}</span>
        </div>
        <button class="download-pdf-btn">
          <i class="fas fa-file-pdf"></i> Download PDF
        </button>
      `;

      card.querySelector('.download-pdf-btn').addEventListener('click', () => {
        downloadAsPDF(notice);
      });

      return card;
    }

    function renderNotices(notices) {
      noticeList.innerHTML = "";
      if (notices.length === 0) {
        emptyState.style.display = "block";
        return;
      }
      emptyState.style.display = "none";
      notices.forEach(notice => noticeList.appendChild(createNoticeCard(notice)));
    }

    function loadNotices() {
      db.ref("notices")
        .orderByChild("timestamp")
        .once("value")
        .then(snapshot => {
          const notices = [];
          snapshot.forEach(child => notices.push({ id: child.key, ...child.val() }));
          allNotices = notices.reverse();
          renderNotices(allNotices);
        })
        .catch(err => {
          console.error("Error:", err);
          emptyState.innerHTML = "<p>Failed to load notices. Please check your connection.</p>";
          emptyState.style.display = "block";
        })
        .finally(() => loading.style.display = "none");
    }

    searchInput.addEventListener("input", () => {
      const term = searchInput.value.toLowerCase().trim();
      if (term === "") return renderNotices(allNotices);
      const filtered = allNotices.filter(n =>
        (n.title || "").toLowerCase().includes(term) ||
        (n.notice || "").toLowerCase().includes(term) ||
        (n.name || "").toLowerCase().includes(term)
      );
      renderNotices(filtered);
    });

    loadNotices();
  </script>
</body>
</html>
