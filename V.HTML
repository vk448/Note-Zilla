<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Official Notice Board</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
  :root {
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --gray: #f3f4f6;
    --border: #e5e7eb;
    --text-dark: #1f2937;
    --text-light: #6b7280;
    --radius: 10px;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(120deg, rgb(15, 153, 112)), rgb(0, 162, 255);
    color: var(--text-dark);
    padding-bottom: 2rem;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem 1rem;
  }

  header {
    text-align: center;
    margin-bottom: 2.5rem;
  }

  header h1 {
    font-size: 2.2rem;
    font-weight: 700;
    color:white;
  }

  header p {
    font-size: 1rem;
    color:white;
    margin-top: 0.4rem;
  }

  /* SEARCH */
  .search-box {
    max-width: 600px;
    margin: 0 auto 2rem;
    position: relative;
  }

  .search-box input {
    width: 100%;
    padding: 0.9rem 1rem 0.9rem 3rem;
    border: 1px solid var(--border);
    background: white;
    border-radius: var(--radius);
    font-size: 1rem;
  }

  .search-box i {
    position: absolute;
    left: 1rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-light);
  }

  /* NOTICE LIST */
  .notice-list {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .notice-row {
    background: white;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 1rem 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: 0.2s;
  }

  .notice-row:hover {
    background: #f9fafb;
  }

  .notice-title {
    font-size: 1.1rem;
    font-weight: 600;
  }

  .download-pdf-btn {
    background: var(--primary);
    color: white;
    border: none;
    padding: 0.6rem 1.2rem;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 500;
    font-size: 0.9rem;
    transition: 0.2s;
  }

  .download-pdf-btn:hover {
    background: var(--primary-hover);
  }

  .empty-state,
  .loading {
    text-align: center;
    padding: 3rem 1rem;
    font-size: 1.1rem;
    color: var(--text-light);
  }

  .loading i {
    font-size: 2rem;
    color: var(--primary);
    margin-bottom: 1rem;
  }
</style>

</head>
<body>

<div class="container">
  <header>
    <h1>NoteZilla Notice Board</h1>
    <p>Important Announcements & Circulars</p>
  </header>

  <div class="search-box">
    <i class="fas fa-search"></i>
    <input type="text" id="searchInput" placeholder="Search notices by title or content..." />
  </div>

  <div id="loading" class="loading">
    <i class="fas fa-spinner fa-spin"></i><br><br>Loading Official Notices...
  </div>

  <div id="noticeList" class="notice-list" style="display:none;"></div>

  <div id="emptyState" class="empty-state" style="display:none;">
    <p>No notices found matching your search.</p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<script>
  const { jsPDF } = window.jspdf;

  const firebaseConfig = {
    apiKey: "AIzaSyCVVqQnmO1Q83AucOqA5b5qUC4eo49sq6E",
    authDomain: "chat-box-e01e5.firebaseapp.com",
    databaseURL: "https://chat-box-e01e5-default-rtdb.firebaseio.com",
    projectId: "chat-box-e01e5",
    storageBucket: "chat-box-e01e5.firebasestorage.app",
    messagingSenderId: "597491149800",
    appId: "1:597491149800:web:7bd908925f70b62018125d"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const noticeList = document.getElementById('noticeList');
  const loading = document.getElementById('loading');
  const emptyState = document.getElementById('emptyState');
  const searchInput = document.getElementById('searchInput');

  let allNotices = [];

  function formatDate(dateString) {
    const options = { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
    return new Date(dateString).toLocaleDateString('en-IN', options);
  }

  function downloadAsPDF(notice) {
    const doc = new jsPDF();
    const pageWidth = doc.internal.pageSize.getWidth();
    const pageHeight = doc.internal.pageSize.getHeight();

    // Watermark
    doc.setFontSize(50);
    doc.setTextColor(240, 240, 240);
    doc.setFont("helvetica", "bold");
    doc.text("OFFICIAL NOTICE", pageWidth / 2, pageHeight / 2, {
      align: "center",
      angle: 45
    });

    // Header
    doc.setTextColor(30, 64, 175);
    doc.setFontSize(28);
    doc.setFont("helvetica", "bold");
    doc.text("NOTICE", pageWidth / 2, 30, { align: "center" });

    // Title
    doc.setTextColor(0, 0, 0);
    doc.setFontSize(18);
    doc.setFont("helvetica", "bold");
    let y = 50;
    const titleLines = doc.splitTextToSize(notice.title || "Untitled Notice", 170);
    doc.text(titleLines, 20, y);
    y += titleLines.length * 8 + 10;

    // Meta
    doc.setFontSize(11);
    doc.setTextColor(100, 100, 100);
    doc.setFont("helvetica", "normal");
    doc.text(`Issued by: ${notice.name || "Admin"}`, 20, y);
    doc.text(`Date: ${formatDate(notice.date || notice.timestamp)}`, 20, y + 8);
    y += 25;

    // Content
    doc.setTextColor(0, 0, 0);
    doc.setFontSize(13);
    doc.setFont("helvetica", "normal");
    const content = notice.notice || "No content available.";
    const splitContent = doc.splitTextToSize(content, 170);
    doc.text(splitContent, 20, y);
    y += splitContent.length * 7 + 30;

    // Signature
    doc.setFontSize(14);
    doc.setFont("helvetica", "italic");
    doc.text("___________________________", 20, y);
    doc.setFontSize(13);
    doc.setFont("helvetica", "normal");
    doc.text("Authorized Signatory", 20, y + 10);
    doc.text("Notice Provider / Admin", 20, y + 18);

    // Footer
    doc.setFontSize(10);
    doc.setTextColor(150, 150, 150);
    doc.text("This is an officially issued notice.", pageWidth / 2, pageHeight - 20, { align: "center" });

    doc.save(`${(notice.title || "Notice").replace(/[^a-zA-Z0-9]/g, "_")}.pdf`);
  }

  function createNoticeRow(notice) {
    const row = document.createElement("div");
    row.className = "notice-row";

    row.innerHTML = `
      <div class="notice-title">${notice.title || "Untitled Notice"}</div>
      <button class="download-pdf-btn">
        <i class="fas fa-file-pdf"></i> Download PDF
      </button>
    `;

    row.querySelector(".download-pdf-btn").addEventListener("click", () => {
      downloadAsPDF(notice);
    });

    return row;
  }

  function renderNotices(notices) {
    noticeList.innerHTML = "";
    if (notices.length === 0) {
      emptyState.style.display = "block";
      noticeList.style.display = "none";
      return;
    }
    emptyState.style.display = "none";
    noticeList.style.display = "flex";

    notices.forEach(notice => {
      noticeList.appendChild(createNoticeRow(notice));
    });
  }

  function loadNotices() {
    loading.style.display = "block";

    db.ref("notices")
      .orderByChild("timestamp")
      .once("value")
      .then(snapshot => {
        const notices = [];
        snapshot.forEach(child => {
          notices.push({ key: child.key, ...child.val() });
        });
        allNotices = notices.reverse();
        renderNotices(allNotices);
      })
      .catch(err => {
        console.error(err);
        emptyState.innerHTML = "<p>Failed to load notices. Please try again later.</p>";
        emptyState.style.display = "block";
      })
      .finally(() => {
        loading.style.display = "none";
      });
  }

  // Search functionality
  searchInput.addEventListener("input", () => {
    const term = searchInput.value.toLowerCase();
    const filtered = allNotices.filter(n =>
      (n.title || "").toLowerCase().includes(term) ||
      (n.notice || "").toLowerCase().includes(term) ||
      (n.name || "").toLowerCase().includes(term)
    );
    renderNotices(filtered);
  });

  // Load on start
  loadNotices();
</script>

</body>
</html>
