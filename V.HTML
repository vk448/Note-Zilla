<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Official Notice Board</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-gradient: linear-gradient(135deg, #0f9960 0%, #00a2ff 50%, #7c3aed 100%);
      --card-bg: rgba(255, 255, 255, 0.95);
      --card-border: rgba(226, 232, 240, 0.8);
      --text-dark: #1e293b;
      --text-medium: #475569;
      --text-light: #64748b;
      --shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
      --radius-lg: 16px;
      --radius-md: 12px;
      --transition: all 0.4s ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Manrope', sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-dark);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 3rem;
    }

    header h1 {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 4rem;
      font-weight: 800;
      color: white;
      text-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      letter-spacing: 1px;
    }

    header p {
      font-size: 1.25rem;
      color: rgba(255, 255, 255, 0.95);
      margin-top: 0.75rem;
      font-weight: 500;
    }

    .search-box {
      max-width: 680px;
      margin: 0 auto 3rem;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 1.1rem 1.5rem 1.1rem 4rem;
      font-size: 1.1rem;
      border: none;
      border-radius: var(--radius-lg);
      background: white;
      box-shadow: var(--shadow);
      transition: var(--transition);
    }

    .search-box input:focus {
      outline: none;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.25);
      transform: scale(1.02);
    }

    .search-box i {
      position: absolute;
      left: 1.5rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.4rem;
      color: var(--text-light);
    }

    .notice-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 2rem;
    }

    .notice-card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      border: 1px solid var(--card-border);
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: var(--transition);
    }

    .notice-card:hover {
      transform: translateY(-12px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    }

    .card-content {
      padding: 1.8rem;
    }

    .notice-title {
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 1rem;
      line-height: 1.3;
    }

    .notice-meta {
      font-size: 0.95rem;
      color: var(--text-medium);
      margin-bottom: 1.5rem;
    }

    .notice-meta span {
      display: block;
      margin-bottom: 0.4rem;
    }

    .download-pdf-btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 1rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: var(--radius-md);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      transition: var(--transition);
    }

    .download-pdf-btn:hover {
      background: var(--primary-hover);
      transform: translateY(-3px);
    }

    .download-pdf-btn i {
      font-size: 1.3rem;
    }

    .loading,
    .empty-state {
      text-align: center;
      padding: 5rem 1rem;
      color: white;
      font-size: 1.4rem;
      font-weight: 500;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .loading i {
      font-size: 4rem;
      margin-bottom: 1.5rem;
      animation: spin 1.2s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @media (max-width: 768px) {
      header h1 {
        font-size: 2.8rem;
      }
      .notice-list {
        grid-template-columns: 1fr;
      }
      .card-content {
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>NoteZilla Notice Board</h1>
    <p>Important Announcements & Circulars</p>
  </header>

  <div class="search-box">
    <i class="fas fa-search"></i>
    <input type="text" id="searchInput" placeholder="Search notices by title or content..." />
  </div>

  <div id="loading" class="loading">
    <i class="fas fa-spinner fa-spin"></i><br><br>Loading Official Notices...
  </div>

  <div id="noticeList" class="notice-list" style="display:none;"></div>

  <div id="emptyState" class="empty-state" style="display:none;">
    <p>No notices found matching your search.</p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<script>
  const { jsPDF } = window.jspdf;

  const firebaseConfig = {
    apiKey: "AIzaSyCVVqQnmO1Q83AucOqA5b5qUC4eo49sq6E",
    authDomain: "chat-box-e01e5.firebaseapp.com",
    databaseURL: "https://chat-box-e01e5-default-rtdb.firebaseio.com",
    projectId: "chat-box-e01e5",
    storageBucket: "chat-box-e01e5.firebasestorage.app",
    messagingSenderId: "597491149800",
    appId: "1:597491149800:web:7bd908925f70b62018125d"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const noticeList = document.getElementById('noticeList');
  const loading = document.getElementById('loading');
  const emptyState = document.getElementById('emptyState');
  const searchInput = document.getElementById('searchInput');

  let allNotices = [];

  function formatDate(dateString) {
    const options = { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
    return new Date(dateString).toLocaleDateString('en-IN', options);
  }

  function downloadAsPDF(notice) {
    const doc = new jsPDF();
    const pageWidth = doc.internal.pageSize.getWidth();
    const pageHeight = doc.internal.pageSize.getHeight();

    // Watermark
    doc.setFontSize(50);
    doc.setTextColor(240, 240, 240);
    doc.setFont("helvetica", "bold");
    doc.text("Note Zilla", pageWidth / 2, pageHeight / 2, {
      align: "center",
      angle: 45
    });

    // Header
    doc.setTextColor(30, 64, 175);
    doc.setFontSize(28);
    doc.setFont("helvetica", "bold");
    doc.text("NOTICE", pageWidth / 2, 30, { align: "center" });

    // Title
    doc.setTextColor(0, 0, 0);
    doc.setFontSize(18);
    doc.setFont("helvetica", "bold");
    let y = 50;
    const titleLines = doc.splitTextToSize(notice.title || "Untitled Notice", 170);
    doc.text(titleLines, 20, y);
    y += titleLines.length * 8 + 10;

    // Meta
    doc.setFontSize(11);
    doc.setTextColor(100, 100, 100);
    doc.setFont("helvetica", "normal");
    doc.text(`Issued by: ${notice.name || "Admin"}`, 20, y);
    doc.text(`Date: ${formatDate(notice.date || notice.timestamp)}`, 20, y + 8);
    y += 25;

    // Content
    doc.setTextColor(0, 0, 0);
    doc.setFontSize(13);
    doc.setFont("helvetica", "normal");
    const content = notice.notice || "No content available.";
    const splitContent = doc.splitTextToSize(content, 170);
    doc.text(splitContent, 20, y);
    y += splitContent.length * 7 + 30;

    // Signature
    doc.setFontSize(14);
    doc.setFont("helvetica", "italic");
    doc.text(`${notice.name || "Admin"}`, 20, y);
    doc.setFontSize(13);
    doc.setFont("helvetica", "normal");
    doc.text("Authorized Signatory", 20, y + 10);
    doc.text("Notice Provider / Admin", 20, y + 18);

    // Footer
    doc.setFontSize(10);
    doc.setTextColor(150, 150, 150);
    doc.text("This is an officially issued notice by Note Zilla.", pageWidth / 2, pageHeight - 20, { align: "center" });

    doc.save(`${(notice.title || "Notice").replace(/[^a-zA-Z0-9]/g, "_")}.pdf`);
  }

  function createNoticeRow(notice) {
    const card = document.createElement("div");
    card.className = "notice-card";

    card.innerHTML = `
      <div class="card-content">
        <div class="notice-title">${notice.title || "Untitled Notice"}</div>
        <div class="notice-meta">
          <span>Issued by: ${notice.name || "Admin"}</span>
          <span>Date: ${formatDate(notice.date || notice.timestamp)}</span>
        </div>
        <button class="download-pdf-btn">
          <i class="fas fa-file-pdf"></i> Download PDF
        </button>
      </div>
    `;

    card.querySelector(".download-pdf-btn").addEventListener("click", () => {
      downloadAsPDF(notice);
    });

    return card;
  }

  function renderNotices(notices) {
    noticeList.innerHTML = "";
    if (notices.length === 0) {
      emptyState.style.display = "block";
      noticeList.style.display = "none";
      return;
    }
    emptyState.style.display = "none";
    noticeList.style.display = "grid";

    notices.forEach(notice => {
      noticeList.appendChild(createNoticeRow(notice));
    });
  }

  function loadNotices() {
    loading.style.display = "block";

    db.ref("notices")
      .orderByChild("timestamp")
      .once("value")
      .then(snapshot => {
        const notices = [];
        snapshot.forEach(child => {
          notices.push({ key: child.key, ...child.val() });
        });
        allNotices = notices.reverse();
        renderNotices(allNotices);
      })
      .catch(err => {
        console.error(err);
        emptyState.innerHTML = "<p>Failed to load notices. Please try again later.</p>";
        emptyState.style.display = "block";
      })
      .finally(() => {
        loading.style.display = "none";
      });
  }

  // Search functionality
  searchInput.addEventListener("input", () => {
    const term = searchInput.value.toLowerCase();
    const filtered = allNotices.filter(n =>
      (n.title || "").toLowerCase().includes(term) ||
      (n.notice || "").toLowerCase().includes(term) ||
      (n.name || "").toLowerCase().includes(term)
    );
    renderNotices(filtered);
  });

  // Load on start
  loadNotices();
</script>

</body>
</html>
