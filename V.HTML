<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Notice Board</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --gray-100: #f8fafc;
      --gray-200: #e2e8f0;
      --gray-300: #cbd5e1;
      --gray-600: #475569;
      --gray-800: #1e293b;
      --gray-900: #0f172a;
      --radius: 16px;
      --shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      color: var(--gray-900);
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding-top: 2rem;
    }

    header {
      text-align: center;
      color: white;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    header p {
      opacity: 0.9;
      font-size: 1.1rem;
    }

    .controls {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 250px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 0.9rem 1rem 0.9rem 3rem;
      border: none;
      border-radius: var(--radius);
      font-size: 1rem;
      box-shadow: var(--shadow);
      outline: none;
    }

    .search-box i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray-600);
    }

    .notice-list {
      display: grid;
      gap: 1.5rem;
    }

    .notice-card {
      background: white;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .notice-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px -10px rgba(0,0,0,0.15);
    }

    .card-header {
      background: var(--primary);
      color: white;
      padding: 1.2rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .card-header h2 {
      font-size: 1.3rem;
      font-weight: 600;
      max-width: 70%;
    }

    .card-meta {
      font-size: 0.9rem;
      opacity: 0.95;
    }

    .card-body {
      padding: 1.5rem;
    }

    .card-body p {
      color: var(--gray-800);
      line-height: 1.7;
      white-space: pre-wrap;
      margin-bottom: 1rem;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--primary);
      color: white;
      padding: 0.7rem 1.2rem;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }

    .download-btn:hover {
      background: var(--primary-dark);
      transform: scale(1.05);
    }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: white;
      font-size: 1.2rem;
      opacity: 0.9;
    }

    .loading {
      text-align: center;
      padding: 3rem;
      color: white;
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header h1 { font-size: 2rem; }
      .card-header { flex-direction: column; align-items: flex-start; }
      .card-header h2 { max-width: 100%; }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Notice Board</h1>
    <p>Latest updates and announcements</p>
  </header>

  <div class="controls">
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" placeholder="Search notices by title or author..." />
    </div>
  </div>

  <div id="loading" class="loading">
    <i class="fas fa-spinner fa-spin fa-2x"></i><br><br>Loading notices...
  </div>

  <div id="noticeList" class="notice-list"></div>

  <div id="emptyState" class="empty-state" style="display:none;">
    <i class="fas fa-clipboard-list fa-3x" style="font-size:3rem; opacity:0.7;"></i>
    <p>No notices found.</p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCVVqQnmO1Q83AucOqA5b5qUC4eo49sq6E",
    authDomain: "chat-box-e01e5.firebaseapp.com",
    databaseURL: "https://chat-box-e01e5-default-rtdb.firebaseio.com",
    projectId: "chat-box-e01e5",
    storageBucket: "chat-box-e01e5.firebasestorage.app",
    messagingSenderId: "597491149800",
    appId: "1:597491149800:web:7bd908925f70b62018125d"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const noticeList = document.getElementById('noticeList');
  const loading = document.getElementById('loading');
  const emptyState = document.getElementById('emptyState');
  const searchInput = document.getElementById('searchInput');

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function formatDate(dateString) {
    try {
      const date = new Date(dateString);
      return date.toLocaleDateString('en-US', {
        weekday: 'short',
        year: 'numeric',
        month: 'short',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    } catch {
      return dateString || "Just now";
    }
  }

  function createNoticeCard(notice) {
    const title = escapeHtml(notice.title || "Untitled Notice");
    const name = escapeHtml(notice.name || "Anonymous");
    const date = formatDate(notice.date || notice.timestamp);
    const text = escapeHtml(notice.notice || "");

    const content = `NOTICE\n\nTitle: ${title}\nBy: ${name}\nDate: ${date}\n\n${text.replace(/<br>/g, '\n')}`;
    const blob = new Blob([content], { type: "text/plain" });
    const url = URL.createObjectURL(blob);

    const card = document.createElement('div');
    card.className = 'notice-card';
    card.innerHTML = `
      <div class="card-header">
        <h2>${title}</h2>
        <div class="card-meta">By ${name} • ${date}</div>
      </div>
      <div class="card-body">
        <p>${text.replace(/\n/g, '<br>')}</p>
        <a href="${url}" download="${title.replace(/[^a-z0-9]/gi, '_')}.txt" class="download-btn">
          Download Notice
        </a>
      </div>
    `;
    return card;
  }

  function renderNotices(notices) {
    noticeList.innerHTML = '';
    
    if (notices.length === 0) {
      emptyState.style.display = 'block';
      noticeList.style.display = 'none';
      return;
    }

    emptyState.style.display = 'none';
    noticeList.style.display = 'grid';

    notices.forEach(notice => {
      noticeList.appendChild(createNoticeCard(notice));
    });
  }

  let allNotices = [];

  function loadNotices() {
    loading.style.display = 'block';

    db.ref('notices')
      .orderByChild('timestamp')
      .once('value')
      .then(snapshot => {
        const notices = [];
        snapshot.forEach(child => {
          notices.push({ key: child.key, ...child.val() });
        });

        // Sort newest first
        allNotices = notices.reverse();
        renderNotices(allNotices);
      })
      .catch(err => {
        console.error(err);
        noticeList.innerHTML = `<p style="color:white; text-align:center;">Error loading notices.</p>`;
      })
      .finally(() => {
        loading.style.display = 'none';
      });
  }

  // Live search
  searchInput.addEventListener('input', (e) => {
    const term = e.target.value.toLowerCase();
    const filtered = allNotices.filter(n => 
      (n.title || "").toLowerCase().includes(term) ||
      (n.name || "").toLowerCase().includes(term) ||
      (n.notice || "").toLowerCase().includes(term)
    );
    renderNotices(filtered);
  });

  // Auto-refresh every 30 seconds (optional)
  // setInterval(loadNotices, 30000);

  // Initial load
  loadNotices();
</script>

</body>
</html>
