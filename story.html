<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0e1f" />
  <title>Mega Chat — Global Anonymous Room</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase v8 (matches your original) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    :root{ --neon:#7c3aed; --neon-2:#06b6d4; --bg:#0a0e1f; }
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: 'Inter', sans-serif; background: var(--bg); color: white; }
    .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(0, 231, 255, 0.12); border-radius: 20px; }
    #messages { height: calc(100vh - 190px); overflow-y: auto; padding: 20px 16px 140px 16px; }
    .input-bar { position: fixed; bottom: 0; left: 0; right: 0; padding: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid rgba(0,231,255,0.08); z-index: 9999; }

    #msgInput { flex: 1; padding: 12px 20px; background: rgba(255,255,255,0.06); border-radius: 16px; font-size: 16px; height: 52px; line-height: 24px; padding-right: 110px; outline: none; border: none; color: #fff; }
    #sendBtn { position: absolute; right: 8px; top: 50%; transform: translateY(-50%) scale(0.8); width: 56px; height: 56px; background: linear-gradient(135deg, var(--neon-2), var(--neon)); color: white; border-radius: 50%; display: grid; place-items: center; font-size: 28px; font-weight: bold; opacity: 0; visibility: hidden; transition: all 0.25s; box-shadow: 0 4px 20px rgba(124,58,237,0.45); cursor: pointer; z-index: 10; }
    #sendBtn.show { opacity: 1; visibility: visible; transform: translateY(-50%) scale(1); }

    .mention-suggestions {
      position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
      width: 88%; max-width: 680px; background: rgba(15,23,42,0.98); backdrop-filter: blur(16px);
      border: 1px solid rgba(139,92,246,0.25); border-radius: 16px; max-height: 240px; overflow-y: auto;
      z-index: 99999; display: none; box-shadow: 0 -12px 40px rgba(0,0,0,0.7); margin-bottom: 8px;
    }
    .mention-item { padding: 12px 16px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.04); transition: all 0.16s; font-size: 14.5px; }
    .mention-item:hover { background: rgba(139,92,246,0.45); padding-left: 22px; }
    .mention-item:last-child { border-bottom: none; }

    .mention { color: #c4b5fd; background: rgba(139,92,246,0.32); padding: 2px 8px; border-radius: 8px; font-weight: 700; }
    .mentioned-message {
      /* stronger highlight when the message mentions you exactly */
      animation: mentionGlow 2.2s ease-in-out infinite;
      background: rgba(28, 9, 44, 0.55) !important;
      border-left: 5px solid var(--neon);
      padding-left: 12px !important;
      border-radius: 20px;
      box-shadow: 0 6px 28px rgba(124,58,237,0.18);
    }
    @keyframes mentionGlow { 0% { box-shadow: 0 0 8px rgba(124,58,237,0.16);} 50% { box-shadow: 0 0 30px rgba(124,58,237,0.35);} 100% { box-shadow: 0 0 8px rgba(124,58,237,0.16);} }

    .delete-btn { position: absolute; top: -10px; right: -10px; background: #ef4444; color: white; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; cursor: pointer; opacity: 0; transition: 0.14s; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 10; }
    .message-wrapper:hover .delete-btn { opacity: 1; transform: scale(1.06); }

    /* No-Zoom Viewer */
    #imageViewerModal { position: fixed; inset: 0; background: #000; z-index: 100000; display: none; align-items: center; justify-content: center; padding: 20px; }
    #imageViewerModal.show { display: flex; }
    .media-container { max-width: 95vw; max-height: 95vh; object-fit: contain; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.8); }

    /* Reactions */
    .reactions { display:flex; gap:8px; margin-top:8px; align-items:center; position:relative; }
    .reaction-btn { padding:6px 10px; background: rgba(255,255,255,0.03); border-radius:999px; cursor:pointer; font-size:14px; display:inline-flex; gap:6px; align-items:center; box-shadow: inset 0 -2px 0 rgba(0,0,0,0.15); transition: all .14s; }
    .reaction-btn.active { background: linear-gradient(90deg, rgba(124,58,237,0.22), rgba(6,182,212,0.12)); box-shadow: 0 6px 18px rgba(124,58,237,0.12); transform: translateY(-1px); }
    .reaction-picker { position:absolute; bottom: 34px; left: 0; display:flex; gap:8px; background: rgba(12,12,15,0.95); padding:8px; border-radius: 999px; border:1px solid rgba(255,255,255,0.04); box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
    .reaction-picker button { font-size:20px; padding:6px; border-radius:8px; background:transparent; border:none; cursor:pointer; }

    /* Typing & presence (darker neon highlight) */
    #topStatus { display:flex; gap:12px; align-items:center; justify-content:space-between; margin:10px 16px; }
    .typing-ind { color:#fff; font-size:13px; min-height:22px; padding:6px 12px; border-radius:999px; background: linear-gradient(90deg, rgba(0,0,0,0.55), rgba(7,11,20,0.7)); border: 1px solid rgba(124,58,237,0.18); box-shadow: 0 6px 24px rgba(124,58,237,0.08); }
    .typing-ind .dot { display:inline-block; width:7px; height:7px; margin-left:8px; background: var(--neon); border-radius:50%; box-shadow: 0 0 10px var(--neon); animation: pulse 1s infinite; vertical-align:middle; }
    @keyframes pulse { 0% { transform:scale(1); opacity:1 } 50% { transform:scale(.7); opacity:.6 } 100% { transform:scale(1); opacity:1 } }

    .online-count { color: #93c5fd; font-size:13px; opacity:0.95; }

    /* Reply preview */
    .reply-preview { background: rgba(255,255,255,0.03); padding:8px 12px; border-left:3px solid rgba(139,92,246,0.6); border-radius:8px; margin-bottom:8px; font-size:13px; color:#d1d5db; }

    .small { font-size:12px; color: #9ca3af; }

    /* responsive tweak for message bubble width */
    @media (max-width: 700px) {
      .max-w-[60%] { max-width: 85% !important; }
    }
  </style>
</head>
<body>

<header class="glass mx-4 mt-4 rounded-2xl p-5 shadow-2xl">
  <div class="flex items-center gap-4">
    <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center text-2xl font-black">MZ</div>
    <div>
      <h1 class="text-2xl font-bold bg-gradient-to-r from-cyan-300 to-purple-400 bg-clip-text text-transparent">Global Anonymous Room</h1>
      <p class="text-sm opacity-80" id="anonNameDisplay">Choosing name...</p>
    </div>
  </div>
</header>

<div id="topStatus">
  <div class="typing-ind" id="typingIndicator"></div>
  <div class="online-count small" id="onlineCount">Online: 0</div>
</div>

<div id="messages" class="px-4">
  <div class="text-center text-sm opacity-60 py-32">Welcome! Keep chat clean & respectful</div>
</div>

<div class="input-bar">
  <div class="max-w-5xl mx-auto relative">
    <div id="mentionSuggestions" class="mention-suggestions glass"></div>
    <div class="glass shadow-2xl rounded-2xl relative overflow-hidden">
      <div class="flex items-center gap-3 p-4">
        <input type="file" id="mediaInput" accept="image/*,video/*" hidden>
        <button id="mediaBtn" class="p-3 rounded-xl bg-white/6 hover:bg-white/12 transition" title="Upload media (max 3MB)">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
        </button>

        <div class="flex-1">
          <div id="replyPreviewHolder"></div>
          <input id="msgInput" type="text" placeholder="Message or @mention..." class="" />
        </div>

        <button id="sendBtn">↑</button>
      </div>
    </div>
  </div>
</div>

<!-- Viewer -->
<div id="imageViewerModal" onclick="closeMediaViewer(event)">
  <button onclick="closeMediaViewer()" class="absolute top-5 right-5 text-white text-6xl hover:scale-125 transition z-50">×</button>
  <img id="viewerImage" class="media-container hidden" />
  <video id="viewerVideo" class="media-container hidden" controls></video>
</div>

<div id="toastHolder" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 space-y-2 pointer-events-none"></div>

<!-- tiny beep -->
<audio id="notifSound" src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA="></audio>

<script>
  /* ---------------- Firebase (v8) ---------------- */
  const firebaseConfig = { 
    apiKey: "AIzaSyCVVqQnmO1Q83AucOqA5b5qUC4eo49sq6E", 
    authDomain: "chat-box-e01e5.firebaseapp.com", 
    databaseURL: "https://chat-box-e01e5-default-rtdb.firebaseio.com", 
    projectId: "chat-box-e01e5"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  /* ---------------- Refs ---------------- */
  const chatRef = db.ref('megaChatChannel');
  const typingRef = db.ref('typingStatus');
  const presenceRef = db.ref('presence');
  const connectionsRef = db.ref('.info/connected');

  /* ---------------- UI elements ---------------- */
  const messagesEl = document.getElementById('messages');
  const msgInput = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');
  const mediaInput = document.getElementById('mediaInput');
  const mediaBtn = document.getElementById('mediaBtn');
  const anonNameDisplay = document.getElementById('anonNameDisplay');
  const mentionSuggestions = document.getElementById('mentionSuggestions');
  const typingIndicator = document.getElementById('typingIndicator');
  const onlineCountEl = document.getElementById('onlineCount');
  const toastHolder = document.getElementById('toastHolder');
  const replyPreviewHolder = document.getElementById('replyPreviewHolder');
  const notifSound = document.getElementById('notifSound');

  /* ---------------- Local state ---------------- */
  let anonName = "";
  let anonId = localStorage.getItem('mega_chat_anonId') || null;
  if (!anonId) { anonId = 'u' + Math.floor(Math.random()*1e9); localStorage.setItem('mega_chat_anonId', anonId); }
  let isBanned = false;
  let currentBanLevel = 0;
  let banTimer = null;
  const recentNames = new Set();
  let typingTimeout = null;
  let currentReplyTo = null; // {key,name,text,type}

  /* ---------------- Toast ---------------- */
  function showToast(t, error = false) {
    const el = document.createElement('div');
    el.className = `glass px-6 py-3 rounded-xl shadow-2xl pointer-events-auto ${error ? 'bg-red-600/80' : 'bg-green-600/70'}`;
    el.textContent = t;
    toastHolder.appendChild(el);
    setTimeout(() => el.remove(), 4000);
  }

  /* ---------------- Abuse / ban ---------------- */
  const abuseWords = ["madarchod","bhenchod","chutiya","gandu","bc","mc","fuck","shit","lund","chut","randi","harami","bhosdike","sex"];
  function containsAbuse(t) { return abuseWords.some(w => t.toLowerCase().includes(w)); }

  function applyBan() {
    currentBanLevel++;
    const seconds = 60 * Math.pow(2, currentBanLevel - 1);
    const minutes = Math.floor(seconds / 60);
    isBanned = true; msgInput.disabled = true;
    msgInput.placeholder = `Banned! Wait ${minutes}m`;
    showToast(`Gaali mat bol! Ban: ${minutes} minute${minutes>1?'s':''}`, true);
    clearTimeout(banTimer);
    banTimer = setTimeout(() => {
      isBanned = false; msgInput.disabled = false;
      msgInput.placeholder = "Message or @mention...";
      showToast("Ban khatam! Ab theek se chat karo");
    }, seconds * 1000);
  }

  /* ---------------- Name popup ---------------- */
  window.addEventListener('load', () => {
    const overlay = document.createElement('div');
    overlay.style.cssText = `position:fixed;inset:0;background:rgba(0,0,0,0.95);backdrop-filter:blur(12px);z-index:999999;display:flex;align-items:center;justify-content:center;padding:20px;`;
    overlay.innerHTML = `
      <div class="glass p-8 rounded-3xl max-w-sm w-full text-center shadow-2xl">
        <h2 class="text-3xl font-bold mb-6 bg-gradient-to-r from-cyan-300 to-purple-400 bg-clip-text text-transparent">Choose Name</h2>
        <input type="text" id="nameInputPopup" placeholder="Choose Any name" maxlength="20" class="w-full px-6 py-4 rounded-2xl bg-white/10 text-white text-center mb-6 focus:outline-none text-lg">
        <button id="saveNameBtn" class="w-full py-4 rounded-2xl bg-gradient-to-r from-cyan-500 to-purple-600 font-bold text-lg hover:scale-105 transition">Join Chat</button>
      </div>`;
    document.body.appendChild(overlay);
    const input = overlay.querySelector('#nameInputPopup');
    input.focus();
    const save = () => {
      anonName = input.value.trim() || "User" + Math.floor(Math.random()*9999);
      if (anonName.length > 20) anonName = anonName.slice(0,20);
      anonNameDisplay.textContent = `You: ${anonName}`;
      overlay.remove();
      setupPresence();
    };
    input.addEventListener('keydown', e => e.key === 'Enter' && save());
    overlay.querySelector('#saveNameBtn').onclick = save;
  });

  /* ---------------- Presence ---------------- */
  function setupPresence() {
    connectionsRef.on('value', snap => {
      const connected = !!snap.val();
      if (connected) {
        const userRef = presenceRef.child(anonId);
        userRef.set({ name: anonName, ts: Date.now() });
        userRef.onDisconnect().remove();
        setInterval(() => userRef.update({ ts: Date.now() }), 20 * 1000);
      }
    });

    presenceRef.on('value', snap => {
      const val = snap.val() || {};
      const keys = Object.keys(val);
      onlineCountEl.textContent = `Online: ${keys.length}`;
    });
  }

  /* ---------------- Typing ---------------- */
  function setTyping() {
    if (!anonName) return;
    typingRef.child(anonId).set(anonName);
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => typingRef.child(anonId).remove(), 2000);
  }

  typingRef.on('value', snap => {
    const val = snap.val() || {};
    const names = Object.entries(val).filter(([id, name]) => id !== anonId).map(([id,name]) => name);
    if (names.length === 0) typingIndicator.innerHTML = '';
    else if (names.length === 1) typingIndicator.innerHTML = `<span style="opacity:.9">${escapeHtml(names[0])} is typing</span><span class="dot"></span>`;
    else typingIndicator.innerHTML = `<span style="opacity:.9">${escapeHtml(names.slice(0,3).join(', '))} and ${Math.max(0, names.length-1)} others</span><span class="dot"></span>`;
  });

  /* ---------------- Mention suggestions ---------------- */
  msgInput.addEventListener('input', () => {
    setTyping();
    const val = msgInput.value;
    const cursor = msgInput.selectionStart;
    const lastAt = val.lastIndexOf('@', cursor - 1);

    if (lastAt !== -1 && (lastAt === 0 || /\s/.test(val[lastAt - 1]))) {
      const query = val.slice(lastAt + 1, cursor).toLowerCase();
      const matches = Array.from(recentNames).filter(n => n.toLowerCase().includes(query)).slice(0, 8);
      if (matches.length > 0) {
        mentionSuggestions.innerHTML = matches.map(n => `<div class="mention-item" onclick="selectMention('${n.replace(/'/g,"\\'")}')">@${n}</div>` ).join('');
        mentionSuggestions.style.display = 'block';
      } else mentionSuggestions.style.display = 'none';
    } else mentionSuggestions.style.display = 'none';
    sendBtn.classList.toggle('show', val.trim().length > 0);
  });

  window.selectMention = function(name) {
    const val = msgInput.value;
    const cursor = msgInput.selectionStart;
    const lastAt = val.lastIndexOf('@', cursor - 1);
    msgInput.value = val.slice(0, lastAt) + `@${name} ` + val.slice(cursor);
    mentionSuggestions.style.display = 'none';
    msgInput.focus();
  };

  /* ---------------- Media upload ---------------- */
  mediaBtn.onclick = () => isBanned ? showToast("Banned hai tu!", true) : mediaInput.click();
  mediaInput.onchange = () => {
    if (isBanned) return;
    const file = mediaInput.files[0];
    if (!file || file.size > 3*1024*1024) return showToast("Max 3MB allowed!", true);
    const reader = new FileReader();
    reader.onload = e => {
      const payload = {
        name: anonName,
        type: file.type.startsWith('image/') ? 'image' : 'video_file',
        time: Date.now()
      };
      if (file.type.startsWith('image/')) payload.image = e.target.result;
      else payload.video = e.target.result;
      chatRef.push(payload);
    };
    reader.readAsDataURL(file);
    mediaInput.value = '';
  };

  /* ---------------- Media viewer ---------------- */
  function openMediaViewer(src, type = 'image') {
    const modal = document.getElementById('imageViewerModal');
    const img = document.getElementById('viewerImage');
    const video = document.getElementById('viewerVideo');

    img.classList.add('hidden');
    video.classList.add('hidden');
    img.src = ''; video.src = '';

    if (type === 'image') { img.src = src; img.classList.remove('hidden'); }
    else { video.src = src; video.classList.remove('hidden'); }

    modal.classList.add('show');
  }
  function closeMediaViewer(e) {
    if (e && e.target !== e.currentTarget && e.target.tagName !== 'BUTTON') return;
    const modal = document.getElementById('imageViewerModal');
    modal.classList.remove('show');
    document.getElementById('viewerImage').src = '';
    document.getElementById('viewerVideo').src = '';
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMediaViewer(); });

  /* ---------------- Sending messages ---------------- */
  function sendMessage() {
    if (isBanned) return showToast("Tu banned hai abhi!", true);
    let text = msgInput.value.trim();
    if (!text && !currentReplyTo) return;

    let replyData = null;
    if (currentReplyTo) replyData = { key: currentReplyTo.key, name: currentReplyTo.name, text: currentReplyTo.text ? currentReplyTo.text.slice(0,120) : '' };

    if (containsAbuse(text)) { applyBan(); msgInput.value=''; sendBtn.classList.remove('show'); clearReply(); return; }

    const yt = text ? text.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&\n?#]+)/i) : null;
    const payload = yt ? 
      { name: anonName, videoId: yt[1], text, type: 'video_link', time: Date.now(), reply: replyData } :
      { name: anonName, text, type: text ? 'text' : 'empty', time: Date.now(), reply: replyData };

    chatRef.push(payload);
    msgInput.value = '';
    sendBtn.classList.remove('show');
    mentionSuggestions.style.display = 'none';
    typingRef.child(anonId).remove();
    clearReply();
  }

  msgInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
  sendBtn.onclick = sendMessage;

  /* ---------------- Reactions logic (WhatsApp-like emojis) ---------------- */
  const REACTION_EMOJIS = ['👍','❤️','😂','😮','😢','🙏'];

  function toggleReaction(msgKey, emoji) {
    const rRef = chatRef.child(msgKey).child('reactions').child(encodeEmojiKey(emoji));
    rRef.once('value', snap => {
      const val = snap.val() || {};
      if (val[anonId]) rRef.child(anonId).remove();
      else { const obj = {}; obj[anonId] = true; rRef.update(obj); }
    });
  }

  function encodeEmojiKey(emoji) {
    // use simple encode to keep firebase keys safe
    return btoa(encodeURIComponent(emoji));
  }
  function decodeEmojiKey(k) {
    try { return decodeURIComponent(atob(k)); } catch(e){ return k; }
  }

  // Build reactions UI with improved picker
  function buildReactionsUI(msgKey, reactions = {}) {
    const wrapper = document.createElement('div');
    wrapper.className = 'reactions';

    const mainBtn = document.createElement('button');
    mainBtn.className = 'reaction-btn';
    mainBtn.textContent = 'React';
    wrapper.appendChild(mainBtn);

    // reaction counts inline
    const countsDiv = document.createElement('div');
    countsDiv.style.display = 'flex'; countsDiv.style.gap = '8px'; countsDiv.style.alignItems = 'center';
    wrapper.appendChild(countsDiv);

    // fill counts
    Object.keys(reactions).forEach(k => {
      const users = reactions[k] || {};
      const count = Object.keys(users).length;
      const emoji = decodeEmojiKey(k);
      const btn = document.createElement('div');
      btn.className = 'reaction-btn' + (users[anonId] ? ' active' : '');
      btn.innerHTML = `<span style="font-size:16px">${emoji}</span><span style="opacity:.9;margin-left:6px">${count}</span>`;
      btn.onclick = (ev) => { ev.stopPropagation(); toggleReaction(msgKey, emoji); };
      countsDiv.appendChild(btn);
    });

    // add a picker popup (hidden)
    const picker = document.createElement('div');
    picker.className = 'reaction-picker';
    picker.style.display = 'none';
    REACTION_EMOJIS.forEach(e => {
      const b = document.createElement('button');
      b.textContent = e;
      b.title = e;
      b.onclick = (ev) => { ev.stopPropagation(); toggleReaction(msgKey, e); picker.style.display = 'none'; };
      picker.appendChild(b);
    });
    wrapper.appendChild(picker);

    // open/close picker
    mainBtn.onclick = (ev) => {
      ev.stopPropagation();
      // toggle
      picker.style.display = picker.style.display === 'flex' ? 'none' : 'flex';
    };

    // clicking outside should close picker
    document.addEventListener('click', () => { try{ picker.style.display='none'; } catch(e){} });

    return wrapper;
  }

  /* ---------------- Render messages ---------------- */
  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
  }

  function renderMessage(snap) {
    const v = snap.val();
    const key = snap.key;
    if (!v) return;
    recentNames.add(v.name || 'Unknown');

    const mine = (v.name === anonName);
    const wrapper = document.createElement('div');
    wrapper.className = `message-wrapper relative flex gap-3 items-end mb-5 ${mine ? 'flex-row-reverse' : ''}`;

    if (!mine) {
      const av = document.createElement('div');
      av.className = 'w-10 h-10 rounded-xl bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center font-bold text-sm shrink-0';
      av.textContent = (v.name && v.name[0]) ? v.name[0].toUpperCase() : '?';
      wrapper.appendChild(av);
    }

    const bubble = document.createElement('div');
    bubble.className = `max-w-[60%] px-5 py-3 rounded-2xl glass ${mine ? 'bg-gradient-to-r from-cyan-500 to-purple-600 text-white' : 'bg-white/6'}`;

    const time = v.time ? new Date(v.time).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '';
    let content = `<div class="text-xs opacity-70 mb-1">${mine ? 'You' : escapeHtml(v.name||'Unknown')} • ${time}</div>`;

    // reply preview
    if (v.reply) {
      content += `<div class="small opacity-80 mb-2" style="font-size:12px;background:rgba(255,255,255,0.02);padding:6px;border-radius:8px;">Reply to <b>${escapeHtml(v.reply.name)}</b>: ${escapeHtml(v.reply.text || '')}</div>`;
    }

    if (v.type === 'image' && v.image) {
      content += `<img src="${v.image}" class="max-w-full rounded-xl mt-2 cursor-pointer hover:opacity-90 transition shadow-lg" onclick="openMediaViewer('${v.image}', 'image')">`;
    } else if (v.type === 'video_file' && v.video) {
      content += `<video src="${v.video}" controls class="max-w-full rounded-xl mt-2 cursor-pointer hover:opacity-90 transition shadow-lg"></video>`;
    } else if (v.type === 'video_link' && v.videoId) {
      content += `<a href="https://youtube.com/watch?v=${v.videoId}" target="_blank" class="block"><img src="https://img.youtube.com/vi/${v.videoId}/hqdefault.jpg" class="w-full rounded-xl"><div class="text-center mt-2 text-sm font-medium">Play on YouTube</div></a>`;
    } else {
      let text = (v.text||'').replace(/\n/g,'<br>');
      // mention exact-match highlight: only if @Name exactly matches anonName (case-insensitive)
      const myNameLower = (anonName || '').toLowerCase();
      let mentioned = false;
      text = text.replace(/@([\w]+)/g, (match, name) => {
        const nameLower = (name || '').toLowerCase();
        if (nameLower === myNameLower) {
          mentioned = true;
          return `<span class="mention">@${escapeHtml(name)}</span>`;
        }
        // not exact -> show as dim mention
        return `<span class="small opacity-70">@${escapeHtml(name)}</span>`;
      });

      if (mentioned && !mine) {
        wrapper.classList.add('mentioned-message');
        setTimeout(() => wrapper.scrollIntoView({ behavior: 'smooth', block: 'center' }), 120);
      }
      content += `<p class="break-words text-base">${text ? text : '<i class="small">[no text]</i>'}</p>`;
    }

    bubble.innerHTML = content;
    wrapper.appendChild(bubble);

    // reactions container
    const reactionsContainer = document.createElement('div');
    reactionsContainer.className = 'mt-2';
    wrapper.appendChild(reactionsContainer);

    // actions (reply / delete)
    const actions = document.createElement('div');
    actions.style = 'display:flex;gap:8px;margin-top:8px;align-items:center;';
    const replyBtn = document.createElement('button');
    replyBtn.className = 'small';
    replyBtn.textContent = 'Reply';
    replyBtn.onclick = (e) => { e.stopPropagation(); setReplyTo(key, v.name, v.text, v.type); msgInput.focus(); };
    actions.appendChild(replyBtn);

    if (mine) {
      const del = document.createElement('div');
      del.className = 'delete-btn'; del.innerHTML = '×';
      del.onclick = e => { e.stopPropagation(); if(confirm("Delete this message?")) chatRef.child(key).remove(); };
      wrapper.appendChild(del);
    }

    messagesEl.appendChild(wrapper);

    // observe reactions for this message and update reaction UI
    chatRef.child(key).child('reactions').on('value', rsnap => {
      const val = rsnap.val() || {};
      reactionsContainer.innerHTML = '';
      reactionsContainer.appendChild(buildReactionsUI(key, val));
    });

    // scroll to bottom
    messagesEl.scrollTop = messagesEl.scrollHeight;

    // play notification if not mine
    maybePlayNotif(v);
  }

  /* ---------------- Notification helper ---------------- */
  let lastSeenMsgTs = Date.now();
  function maybePlayNotif(msgObj) {
    if (!msgObj || !msgObj.time) return;
    if (msgObj.name !== anonName && msgObj.time > lastSeenMsgTs) {
      try { notifSound.currentTime = 0; notifSound.play().catch(()=>{}); } catch(e){}
    }
    lastSeenMsgTs = Math.max(lastSeenMsgTs, msgObj.time || 0);
  }

  /* ---------------- Reply handling ---------------- */
  function setReplyTo(msgKey, name, text, type) {
    currentReplyTo = { key: msgKey, name, text, type };
    replyPreviewHolder.innerHTML = `<div class="reply-preview">Replying to <b>${escapeHtml(name)}</b>: ${ text ? (escapeHtml(text.length>120 ? text.slice(0,120) + '...' : text)) : (type==='image'?'[image]':(type==='video_file'?'[video]':'')) } <button style="float:right" onclick="clearReply()">✕</button></div>`;
  }
  window.clearReply = function() { currentReplyTo = null; replyPreviewHolder.innerHTML = ''; };

  /* ---------------- Listen to chat ---------------- */
  chatRef.limitToLast(500).on('child_added', snap => renderMessage(snap));
  chatRef.on('child_removed', () => {
    messagesEl.innerHTML = '<div class="text-center text-sm opacity-60 py-32">Welcome! Keep chat clean & respectful</div>';
    chatRef.limitToLast(200).once('value', s => s.forEach(renderMessage));
  });

  /* ---------------- Initial recent names (mentions suggestions) ---------------- */
  chatRef.limitToLast(300).once('value', snap => {
    snap.forEach(s => {
      const v = s.val();
      if (v && v.name) recentNames.add(v.name);
    });
  });

  /* ---------------- small UX helpers ---------------- */
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.mention-suggestions')) mentionSuggestions.style.display = 'none';
  });

  window.openMediaViewer = openMediaViewer;

  window.addEventListener('beforeunload', () => {
    typingRef.child(anonId).remove();
    presenceRef.child(anonId).remove();
  });

  // Expose toggleReaction for inline clicks (not needed but safe)
  window.toggleReaction = toggleReaction;

</script>
</body>
</html>
