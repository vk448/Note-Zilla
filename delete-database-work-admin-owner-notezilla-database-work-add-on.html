<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NoteZilla — Edit & Delete Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #0f172a;
        --card-bg: rgba(30, 41, 59, 0.6);
        --text: #e2e8f0;
        --text-muted: #94a3b8;
        --accent: #60a5fa;
        --accent-hover: #3b82f6;
        --success: #34d399;
        --error: #f87171;
        --border: rgba(148, 163, 184, 0.2);
        --shadow: 0 10px 30px rgba(0,0,0,0.4);
        --radius: 16px;
        --transition: all 0.3s ease;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
        font-family: 'Inter', sans-serif;
        background: linear-gradient(135deg, #020617 0%, #1e293b 100%);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    .card {
        width: 100%;
        max-width: 1200px;
        background: var(--card-bg);
        backdrop-filter: blur(12px);
        border-radius: var(--radius);
        padding: 32px;
        box-shadow: var(--shadow);
        border: 1px solid var(--border);
        position: relative;
    }
    h2 {
        text-align: center;
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 24px;
        color: #ffffff;
    }
    .controls {
        display: flex;
        gap: 12px;
        margin-bottom: 24px;
        flex-wrap: wrap;
    }
    .search-input {
        flex: 1;
        min-width: 250px;
        padding: 12px 16px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: rgba(30, 41, 59, 0.8);
        color: var(--text);
        font-size: 1rem;
        transition: var(--transition);
    }
    .search-input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(96,165,250,0.2);
    }
    .btn {
        padding: 12px 24px;
        border-radius: 12px;
        border: none;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition);
        display: inline-flex;
        align-items: center;
        gap: 8px;
    }
    .btn-refresh {
        background: var(--accent);
        color: white;
    }
    .btn-refresh:hover {
        background: var(--accent-hover);
        transform: translateY(-2px);
    }
    .table-container {
        overflow-x: auto;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        background: rgba(15, 23, 42, 0.6);
    }
    table {
        width: 100%;
        border-collapse: collapse;
    }
    th, td {
        padding: 16px;
        text-align: left;
        border-bottom: 1px solid var(--border);
    }
    th {
        background: rgba(30, 41, 59, 0.8);
        font-weight: 600;
        color: #cbd5e1;
        font-size: 0.95rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }
    tr:hover {
        background: rgba(59, 130, 246, 0.1);
    }
    .link-cell a {
        color: var(--accent);
        text-decoration: underline;
    }
    .action-btns {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }
    .btn-edit {
        background: var(--accent);
        color: white;
        padding: 8px 16px;
        font-size: 0.9rem;
    }
    .btn-edit:hover {
        background: var(--accent-hover);
    }
    .btn-delete {
        background: var(--error);
        color: white;
        padding: 8px 16px;
        font-size: 0.9rem;
    }
    .btn-delete:hover {
        background: #dc2626;
    }
    .status {
        margin-top: 20px;
        padding: 16px;
        border-radius: 12px;
        font-weight: 600;
        text-align: center;
        opacity: 0;
        transition: opacity 0.4s;
    }
    .status.show {
        opacity: 1;
    }
    .status-success {
        background: rgba(52, 211, 153, 0.15);
        color: var(--success);
        border: 1px solid rgba(52, 211, 153, 0.3);
    }
    .status-error {
        background: rgba(248, 113, 113, 0.15);
        color: var(--error);
        border: 1px solid rgba(248, 113, 113, 0.3);
    }
    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        border-radius: var(--radius);
        z-index: 50;
    }
    .loading-overlay.active {
        display: flex;
    }
    .spinner {
        width: 60px;
        height: 60px;
        border: 6px solid rgba(96,165,250,0.2);
        border-top: 6px solid var(--accent);
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
    }
    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    .loading-text {
        font-size: 1.2rem;
        font-weight: 600;
        color: var(--accent);
    }
    .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.7);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        backdrop-filter: blur(8px);
    }
    .overlay.open {
        display: flex;
    }
    .dialog, .modal-content {
        background: var(--card-bg);
        padding: 32px;
        border-radius: var(--radius);
        width: 90%;
        max-width: 500px;
        box-shadow: var(--shadow);
        border: 1px solid var(--border);
        text-align: center;
    }
    .dialog h3, .modal-content h3 {
        margin-bottom: 16px;
        font-size: 1.5rem;
        color: var(--text);
    }
    .dialog p {
        margin-bottom: 28px;
        color: var(--text-muted);
        line-height: 1.5;
    }
    .dialog-actions, .modal-actions {
        display: flex;
        justify-content: center;
        gap: 16px;
        margin-top: 24px;
    }
    .modal-actions { justify-content: flex-end; }
    .btn-cancel {
        background: #64748b;
        color: white;
        padding: 12px 28px;
    }
    .btn-cancel:hover {
        background: #475569;
    }
    .btn-confirm, .btn-save {
        background: var(--error);
        color: white;
        padding: 12px 28px;
    }
    .btn-confirm:hover {
        background: #dc2626;
    }
    .btn-save {
        background: var(--success);
    }
    .btn-save:hover {
        background: #059669;
    }
    .form-group {
        margin-bottom: 20px;
    }
    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: var(--text-muted);
    }
    .form-group input {
        width: 100%;
        padding: 12px 16px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: rgba(30, 41, 59, 0.8);
        color: var(--text);
    }
    .form-group input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(96,165,250,0.2);
    }
    @media (max-width: 768px) {
        .controls { flex-direction: column; }
        .search-input { min-width: auto; }
        .action-btns { flex-direction: column; }
        th, td { padding: 12px; font-size: 0.9rem; }
    }
</style>
</head>
<body>
<div class="card">
    <h2>🗂️ NoteZilla — Edit & Delete Panel</h2>

    <div class="controls">
        <input id="filterInput" class="search-input" placeholder="Search in any column..." />
        <button id="refreshBtn" class="btn btn-refresh">🔄 Refresh</button>
    </div>

    <div id="statusBox" class="status"></div>

    <div class="table-container">
        <table id="dataTable">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
        <div class="loading-text">Loading data...</div>
    </div>
</div>

<!-- Delete Confirmation -->
<div id="deleteConfirm" class="overlay">
    <div class="dialog">
        <h3>Confirm Delete</h3>
        <p>Are you sure you want to delete this entry?<br><strong id="deleteName"></strong><br>This action cannot be undone.</p>
        <div class="dialog-actions">
            <button id="cancelDelete" class="btn btn-cancel">Cancel</button>
            <button id="confirmDelete" class="btn btn-confirm">Delete</button>
        </div>
    </div>
</div>

<!-- Edit Modal -->
<div id="editModal" class="overlay">
    <div class="modal-content">
        <h3>Edit Entry</h3>
        <div class="form-group">
            <label>Chapter Name</label>
            <input id="editChapter" type="text">
        </div>
        <div class="form-group">
            <label>Direct Link</label>
            <input id="editLink" type="text">
        </div>
        <div class="form-group">
            <label>Date (YYYY-MM-DD)</label>
            <input id="editDate" type="date">
        </div>
        <div class="form-group">
            <label>Subject</label>
            <input id="editSubject" type="text">
        </div>
        <div class="modal-actions">
            <button id="cancelEdit" class="btn btn-cancel">Cancel</button>
            <button id="saveEdit" class="btn btn-save">Save Changes</button>
        </div>
    </div>
</div>

<script>
// === UPDATE THIS URL WITH YOUR DEPLOYED WEB APP URL ===
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwB0mWBqMAYIdiXP6WBxaIKUl9USE6UlYRkE5oYrZP_3Z8p9UZvfj0JwxSglfxj6FW9/exec";

const loadingOverlay = document.getElementById("loadingOverlay");
const tableHead = document.getElementById("tableHead");
const tableBody = document.getElementById("tableBody");
const statusBox = document.getElementById("statusBox");
const filterInput = document.getElementById("filterInput");
const refreshBtn = document.getElementById("refreshBtn");

const deleteConfirm = document.getElementById("deleteConfirm");
const deleteName = document.getElementById("deleteName");
const cancelDelete = document.getElementById("cancelDelete");
const confirmDelete = document.getElementById("confirmDelete");

const editModal = document.getElementById("editModal");
const editChapter = document.getElementById("editChapter");
const editLink = document.getElementById("editLink");
const editDate = document.getElementById("editDate");
const editSubject = document.getElementById("editSubject");
const saveEdit = document.getElementById("saveEdit");
const cancelEdit = document.getElementById("cancelEdit");

let headers = [];
let dataRows = [];
let editingRowIndex = -1;
let deletingRowIndex = -1;

refreshBtn.addEventListener("click", loadData);
filterInput.addEventListener("input", filterTable);

cancelDelete.onclick = cancelEdit.onclick = () => {
    deleteConfirm.classList.remove("open");
    editModal.classList.remove("open");
    editingRowIndex = deletingRowIndex = -1;
};

async function loadData() {
    loadingOverlay.classList.add("active");
    tableHead.innerHTML = "";
    tableBody.innerHTML = "";
    showStatus("", false);

    try {
        const res = await fetch(SCRIPT_URL);
        if (!res.ok) throw new Error("Network error");
        const json = await res.json();

        if (!json.rows || json.rows.length < 2) {
            tableBody.innerHTML = `<tr><td colspan="10" style="text-align:center;padding:40px;">No data found.</td></tr>`;
            return;
        }

        headers = json.rows[0];
        dataRows = json.rows.slice(1).map(row => row.map(cell => cell ?? ""));

        renderTable(dataRows);
    } catch (err) {
        showStatus("Failed to load data: " + err.message, true);
        console.error(err);
    } finally {
        loadingOverlay.classList.remove("active");
    }
}

function renderTable(rows) {
    // Header
    const headerTr = document.createElement("tr");
    headers.forEach(h => {
        const th = document.createElement("th");
        th.textContent = h;
        headerTr.appendChild(th);
    });
    const actionTh = document.createElement("th");
    actionTh.textContent = "Actions";
    actionTh.style.textAlign = "center";
    headerTr.appendChild(actionTh);
    tableHead.innerHTML = "";
    tableHead.appendChild(headerTr);

    // Body
    tableBody.innerHTML = "";
    if (rows.length === 0) {
        const tr = document.createElement("tr");
        const td = document.createElement("td");
        td.colSpan = headers.length + 1;
        td.textContent = "No matching records found.";
        td.style.textAlign = "center";
        td.style.padding = "40px";
        tr.appendChild(td);
        tableBody.appendChild(tr);
        return;
    }

    rows.forEach((row, idx) => {
        const tr = document.createElement("tr");

        headers.forEach((header, colIdx) => {
            const td = document.createElement("td");
            let value = row[colIdx] || "";

            if (/date/i.test(header) && value) {
                const d = new Date(value);
                if (!isNaN(d)) value = d.toISOString().split('T')[0];
            }

            if (/link/i.test(header) && value && value.startsWith("http")) {
                const a = document.createElement("a");
                a.href = value;
                a.target = "_blank";
                a.rel = "noopener";
                a.textContent = "Open Link ↗";
                a.className = "link-cell";
                td.appendChild(a);
            } else {
                td.textContent = value;
            }
            tr.appendChild(td);
        });

        // Actions
        const actionTd = document.createElement("td");
        actionTd.style.textAlign = "center";
        const btnsDiv = document.createElement("div");
        btnsDiv.className = "action-btns";

        const editBtn = document.createElement("button");
        editBtn.className = "btn btn-edit";
        editBtn.textContent = "Edit";
        editBtn.onclick = () => openEditModal(idx);

        const delBtn = document.createElement("button");
        delBtn.className = "btn btn-delete";
        delBtn.textContent = "Delete";
        delBtn.onclick = () => openDeleteConfirm(idx);

        btnsDiv.appendChild(editBtn);
        btnsDiv.appendChild(delBtn);
        actionTd.appendChild(btnsDiv);
        tr.appendChild(actionTd);

        tableBody.appendChild(tr);
    });
}

function filterTable() {
    const query = filterInput.value.trim().toLowerCase();
    if (!query) return renderTable(dataRows);
    const filtered = dataRows.filter(row =>
        row.some(cell => String(cell).toLowerCase().includes(query))
    );
    renderTable(filtered);
}

function openDeleteConfirm(index) {
    deletingRowIndex = index;
    const row = dataRows[index];
    const chapterCol = headers.findIndex(h => /chapter/i.test(h));
    const chapterName = chapterCol !== -1 ? row[chapterCol] : "this entry";
    deleteName.textContent = chapterName;
    deleteConfirm.classList.add("open");
}

confirmDelete.onclick = async () => {
    if (deletingRowIndex === -1) return;

    const id = dataRows[deletingRowIndex][0]; // Assumes first column is unique ID (e.g., Timestamp or ID)

    deleteConfirm.classList.remove("open");
    showStatus("Deleting...", false);

    try {
        const formData = new FormData();
        formData.append("action", "delete");
        formData.append("id", id);

        const res = await fetch(SCRIPT_URL, {
            method: "POST",
            body: formData
        });

        const json = await res.json();

        if (json.status === "success" || json.message?.includes("deleted")) {
            dataRows.splice(deletingRowIndex, 1);
            renderTable(dataRows);
            showStatus("Entry deleted successfully!", false, true);
        } else {
            showStatus(json.message || "Delete failed", true);
        }
    } catch (err) {
        console.error(err);
        showStatus("Delete error: " + err.message, true);
    }

    deletingRowIndex = -1;
};

function openEditModal(index) {
    editingRowIndex = index;
    const row = dataRows[index];

    const chapterIdx = headers.findIndex(h => /chapter/i.test(h));
    const linkIdx = headers.findIndex(h => /link/i.test(h));
    const dateIdx = headers.findIndex(h => /date/i.test(h));
    const subjectIdx = headers.findIndex(h => /subject/i.test(h));

    editChapter.value = chapterIdx !== -1 ? row[chapterIdx] : "";
    editLink.value = linkIdx !== -1 ? row[linkIdx] : "";
    editSubject.value = subjectIdx !== -1 ? row[subjectIdx] : "";

    if (dateIdx !== -1 && row[dateIdx]) {
        const d = new Date(row[dateIdx]);
        editDate.value = !isNaN(d) ? d.toISOString().split('T')[0] : "";
    } else {
        editDate.value = "";
    }

    editModal.classList.add("open");
}

saveEdit.onclick = async () => {
    if (editingRowIndex === -1) return;

    const row = dataRows[editingRowIndex];
    const oldId = row[0]; // First column must be unique ID

    const updatedRow = [...row];

    const chapterIdx = headers.findIndex(h => /chapter/i.test(h));
    const linkIdx = headers.findIndex(h => /link/i.test(h));
    const dateIdx = headers.findIndex(h => /date/i.test(h));
    const subjectIdx = headers.findIndex(h => /subject/i.test(h));

    if (chapterIdx !== -1) updatedRow[chapterIdx] = editChapter.value.trim();
    if (linkIdx !== -1) updatedRow[linkIdx] = editLink.value.trim();
    if (subjectIdx !== -1) updatedRow[subjectIdx] = editSubject.value.trim();
    if (dateIdx !== -1) updatedRow[dateIdx] = editDate.value || "";

    showStatus("Saving changes...", false);

    try {
        const formData = new FormData();
        formData.append("action", "update");
        formData.append("oldId", oldId);
        formData.append("newRow", JSON.stringify(updatedRow));

        const res = await fetch(SCRIPT_URL, {
            method: "POST",
            body: formData
        });

        const json = await res.json();

        if (json.status === "success" || json.message?.includes("updated")) {
            dataRows[editingRowIndex] = updatedRow;
            renderTable(dataRows);
            showStatus("Updated successfully!", false, true);
            editModal.classList.remove("open");
        } else {
            showStatus(json.message || "Update failed", true);
        }
    } catch (err) {
        console.error(err);
        showStatus("Update error: " + err.message, true);
    }

    editingRowIndex = -1;
};

function showStatus(msg, isError = false, isSuccess = false) {
    statusBox.textContent = msg;
    statusBox.className = "status show " + (isError ? "status-error" : isSuccess ? "status-success" : "");
    if (msg) {
        setTimeout(() => statusBox.classList.remove("show"), 5000);
    }
}

// Load data on start
loadData();
</script>
</body>
</html>
