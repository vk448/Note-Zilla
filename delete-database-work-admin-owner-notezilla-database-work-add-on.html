<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NoteZilla — Delete Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#071228;--card:rgba(255,255,255,0.04);--accent:#42a5f5;--ok:#22c55e;--err:#ff6b6b}
body{margin:0;font-family:Poppins,system-ui;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#001126,#021428);color:#e6eef8;padding:18px;}
.card{width:100%;max-width:980px;border-radius:12px;padding:18px;background:var(--card);box-shadow:0 8px 30px rgba(0,0,0,0.45);}
h2{margin:0 0 10px 0;font-size:20px;text-align:center}
#loading{color:var(--accent);font-weight:700;padding:8px;text-align:center}
table{width:100%;border-collapse:collapse;margin-top:8px}
th,td{padding:10px;border-bottom:1px solid rgba(255,255,255,0.06);text-align:left;font-size:14px}
th{font-weight:700;color:#cfe9ff;background:rgba(255,255,255,0.02)}
.btn{padding:8px 10px;border-radius:8px;border:none;cursor:pointer;font-weight:700}
.del{background:var(--err);color:white}
.del:hover{opacity:0.94}
.small{font-size:13px;color:rgba(255,255,255,0.8)}
.status{margin-top:12px;padding:10px;border-radius:8px;font-weight:700;display:none}
.status.ok{background:rgba(34,197,94,0.12);color:var(--ok);display:block}
.status.err{background:rgba(255,107,107,0.12);color:var(--err);display:block}
.searchRow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
input.search{flex:1;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:inherit}
</style>
</head>
<body>
<div class="card">
<h2>🗑️ NoteZilla — Delete Panel</h2>

<div class="searchRow">
<input id="filterInput" class="search" placeholder="Filter by Chapter / Link / Subject..." />
<button id="refreshBtn" class="btn" style="background:var(--accent);color:#00131f">Refresh</button>
</div>

<div id="loading">Loading data…</div>
<div id="statusBox" class="status"></div>

<table id="dataTable" aria-live="polite">
  <thead>
    <tr>
      <th>Chapter Name</th>
      <th>Link</th>
      <th>Subject</th>
      <th style="width:120px">Action</th>
    </tr>
  </thead>
  <tbody id="tableBody"></tbody>
</table>

</div>

<script>

// Access Control
const role = localStorage.getItem("userRole");
if (!role || !["admin","co-admin","owner"].includes(role.toLowerCase())) {
    alert("❌ Access Denied! Only Admins & Co-Admins allowed.");
    window.location.href = "login.html";
}

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzlqLJGKif2hrkZq0B5095f7-N9SzWyMqsW0OBG1r0OfGpGeqbXXJ7AgG1fvZ3V2QUP/exec";

const loadingEl = document.getElementById("loading");
const tableBody = document.getElementById("tableBody");
const statusBox = document.getElementById("statusBox");
const filterInput = document.getElementById("filterInput");
const refreshBtn = document.getElementById("refreshBtn");

let currentRows = [];

refreshBtn.addEventListener("click", loadData);
filterInput.addEventListener("input", () => renderRows(currentRows));

async function loadData() {
  try {
    loadingEl.textContent = "Loading data…";
    tableBody.innerHTML = "";
    const res = await fetch(SCRIPT_URL);
    const json = await res.json();

    const rows = json.rows.slice(1);

    currentRows = rows.map(r => [
      (r[0] || ""), // Chapter Name
      (r[1] || ""), // Link
      (r[3] || "")  // Subject
    ]);

    renderRows(currentRows);
    loadingEl.textContent = "";
  } catch (err) {
    loadingEl.textContent = "";
    showStatus("Error: " + err.message, true);
  }
}

function renderRows(rows) {
  const q = filterInput.value.trim().toLowerCase();
  tableBody.innerHTML = "";
  
  let shown = 0;
  for (const r of rows) {
    const chapter = r[0];
    const link = r[1];
    const subject = r[2];

    const match = (chapter + " " + link + " " + subject).toLowerCase();
    if (q && !match.includes(q)) continue;

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${chapter}</td>
      <td><a href="${link}" target="_blank">Open</a></td>
      <td class="small">${subject}</td>
      <td><button class="btn del" onclick="handleDelete('${chapter}')">Delete</button></td>
    `;
    tableBody.appendChild(tr);
    shown++;
  }

  if (!shown) {
    tableBody.innerHTML = `<tr><td colspan="4" style="text-align:center">No rows found.</td></tr>`;
  }
}

async function handleDelete(chapter) {
  if (!confirm(`Delete "${chapter}"? This can't be undone.`)) return;

  try {
    showStatus(`Deleting "${chapter}"…`);
    const res = await fetch(SCRIPT_URL + "?id=" + encodeURIComponent(chapter));
    const json = await res.json();

    if (json.status === "deleted") {
      showStatus(`Deleted "${chapter}"`, false, true);
      currentRows = currentRows.filter(r => r[0] !== chapter);
      renderRows(currentRows);
    } else {
      showStatus("Not found: " + chapter, true);
    }
  } catch (err) {
    showStatus("Error: " + err.message, true);
  }
}

function showStatus(msg, err = false, ok = false) {
  statusBox.style.display = "block";
  statusBox.className = "status" + (err ? " err" : ok ? " ok" : "");
  statusBox.textContent = msg;
  setTimeout(() => (statusBox.style.display = "none"), 4000);
}

loadData();
</script>
</body>
</html>
