<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/Images/Favicon.png">
<title>Credits - Note Zilla</title>
<style>
footer img{
  height: 30px;
  width: 30px;
  border-radius: 50px;
  margin: 10px 5px;
}
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap');

/* ================= General Reset ================= */
* { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }

body {
  background:#f5f6fa;
  color:#333;
  line-height:1.6;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* ================= Header ================= */
header {
  width: 100%;
  background:#fff;
  padding:15px 30px;
  display:flex;
  justify-content:center;
  align-items:center;
  box-shadow:0 4px 6px rgba(0,0,0,0.1);
  position:sticky;
  top:0;
  z-index:100;
}
.logo {
  font-weight:900;
  font-size:1.8rem;
  background: linear-gradient(90deg, #4e73df, #1cc88a);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* ================= Page Title ================= */
h1 {
  text-align:center;
  margin:30px 0;
  color:#4e73df;
}

/* ================= Credits Container ================= */
.credits-container {
  display:flex;
  flex-direction:column;
  gap:20px;
  width:100%;
  max-width:800px;
}

.credit-card {
  display:flex;
  align-items:center;
  background:#fff;
  padding:20px;
  border-radius:12px;
  box-shadow:0 6px 15px rgba(0,0,0,0.1);
  gap:20px;
  transition:transform 0.3s, box-shadow 0.3s;
}

.credit-card:hover {
  transform:translateY(-5px);
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.credit-card img {
  width:120px;
  height:120px;
  border-radius:50%;
  object-fit:cover;
  box-shadow:0 6px 15px rgba(0,0,0,0.2);
}

.credit-card .info {
  display:flex;
  flex-direction:column;
}

.credit-card .info h3 {
  color:#4e73df;
  margin-bottom:5px;
  font-size:1.5rem;
}

.credit-card .info p {
  font-weight:700;
  color:#1cc88a; /* Highlighted role/title */
  font-size:1rem;
}

@media(max-width:600px){
  .credit-card {
    flex-direction:column;
    text-align:center;
  }
  .credit-card img { margin-bottom:10px; }
}
footer {
  text-align: center;
  padding: 20px;
  background: #fff;
  box-shadow: 0 -4px 6px rgba(0,0,0,0.05);
  margin-top: 50px;
  width: 100%;
  height:100px ;
}

</style>
</head>
<body>

<!-- Header -->
<header>
  <div class="logo">Note Zilla</div>

<h1>Credits</h1>

<div class="credits-container">

    </div>
  </div>
  <div class="credit-card">

    </div>
  </div>
  <div class="credit-card">
    <img src="Images/h.jpg" alt="Harshverdhan">
    <div class="info">
      <h3>Harshverdhan</h3>
      <p>PDF Maker/ Co - Admin</p>
    </div>
  </div>
</div>
<footer>
  <p>&copy; 2025 Note Zilla Are Right Are Reserved</p>
  <a href="https://whatsapp.com/channel/0029Vb7CpvgAzNbwokB7KV0y"><img src="Images/Whatsapp.png"></a>
  <a href=""><img src="Images/instagram.jpeg"></a>
  <a href="https://t.me/+gxvgPedurnMyNTA1"><img src="Images/telegram.png"></a>
</footer>
