<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Credits - Note Zilla</title>
  <link rel="icon" href="images/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
 
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
    body{background:#f5f6fa;color:#333;line-height:1.6;display:flex;flex-direction:column;align-items:center;}
    
    header{width:100%;background:#fff;padding:15px 30px;display:flex;justify-content:center;align-items:center;
      box-shadow:0 4px 6px rgba(0,0,0,0.1);position:sticky;top:0;z-index:100;}
    .logo{font-weight:900;font-size:1.8rem;background:linear-gradient(90deg,#4e73df,#1cc88a);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;}

    h1{text-align:center;margin:40px 0;color:#4e73df;font-size:2.2rem;}

    .credits-container{
      display:flex;flex-direction:column;gap:25px;width:100%;max-width:800px;padding:20px;
    }
    .credit-card{
      display:flex;align-items:center;background:#fff;padding:22px;border-radius:14px;
      box-shadow:0 6px 20px rgba(0,0,0,0.12);gap:25px;transition:all 0.3s;
    }
    .credit-card:hover{
      transform:translateY(-8px);box-shadow:0 15px 35px rgba(0,0,0,0.2);
    }
    .credit-card img{
      width:130px;height:130px;border-radius:50%;object-fit:cover;
      border:5px solid #4e73df;box-shadow:0 8px 20px rgba(0,0,0,0.2);
    }
    .info h3{color:#4e73df;margin-bottom:8px;font-size:1.6rem;}
    .info .role{font-weight:700;color:#1cc88a;font-size:1.1rem;margin-bottom:8px;}
    .info .email{color:#555;font-size:1rem;}

    .no-admin{text-align:center;color:#e74c3c;font-size:1.4rem;margin:50px 0;}

    @media(max-width:600px){
      .credit-card{flex-direction:column;text-align:center;}
      .credit-card img{margin-bottom:15px;}
    }

    footer{
      text-align:center;padding:25px;background:#fff;margin-top:60px;width:100%;
      box-shadow:0 -4px 10px rgba(0,0,0,0.05);
    }
    .home a{
      display:inline-block;padding:14px 30px;background:#1cc88a;color:#fff;
      border-radius:30px;text-decoration:none;font-weight:600;margin:20px 0;
      transition:0.3s;
    }
    .home a:hover{background:#4e73df;transform:scale(1.05);}
       footer img{
  height: 30px;
  width: 30px;
  border-radius: 50px;
  margin: 10px 5px;
}
  </style>
</head>
<body>

<header>
  <div class="logo">Note Zilla - Team</div>
</header>

<h1>Our Admins & Co-Admins</h1>

<div class="credits-container" id="adminList">
  <p style="text-align:center;color:#777;">Loading team members...</p>
</div>

<div class="home">
  <a href="/">Back To Home</a>
</div>

<footer>
  <p>&copy; 2025 Note Zilla - All Rights Reserved</p>
  <a href="https://whatsapp.com/channel/0029Vb7CpvgAzNbwokB7KV0y"><img src="Images/Whatsapp.png" alt="WhatsApp"></a>
  <a href=""><img src="Images/instagram.jpeg" alt="Instagram"></a>
  <a href="https://t.me/+gxvgPedurnMyNTA1"><img src="Images/telegram.png" alt="Telegram"></a>
</footer>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCVVqQnmO1Q83AucOqA5b5qUC4eo49sq6E",
    authDomain: "chat-box-e01e5.firebaseapp.com",
    databaseURL: "https://chat-box-e01e5-default-rtdb.firebaseio.com",
    projectId: "chat-box-e01e5",
    storageBucket: "chat-box-e01e5.firebasestorage.app",
    messagingSenderId: "597491149800",
    appId: "1:597491149800:web:7bd908925f70b62018125d",
    measurementId: "G-FJ6PKK2FNQ"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const adminList = document.getElementById("adminList");

  db.ref("admins").once("value").then(snapshot => {
    const admins = [];

snapshot.forEach(child => {
  const user = child.val();
  const role = (user.role || "").toLowerCase(); // make it lowercase for consistency
  if (role === "owner" || role === "work provider" || role === "admin" || role === "notice provider" || role === "co-admin" || role === "notice work provider"   ) {
    admins.push(user);
  }
});

if (admins.length === 0) {
  adminList.innerHTML = "<p class='no-admin'>No Admin or Co-Admin registered yet!</p>";
  return;
}

// Custom sorting: owner first, then Admin, then work provider, then notice provider
admins.sort((a, b) => {
  const order = { "owner": 1, "admin": 2, "work provider": 3, "notice provider": 4, "co-admin": 5, "notice work provider": 6 };
  const roleA = (a.role || "").toLowerCase();
  const roleB = (b.role || "").toLowerCase();
  return (order[roleA] || 99) - (order[roleB] || 99);
});


    let html = "";
    admins.forEach(user => {
      const photo = user.photoURL && user.photoURL.startsWith("data:")
        ? user.photoURL
        : (user.photoURL || `https://api.dicebear.com/7.x/avataaars/svg?seed=${user.username}`);

      html += `
        <div class="credit-card">
          <img src="${photo}" alt="${user.fullName}">
          <div class="info">
            <h3>${user.fullName}</h3>
            <p class="role">${user.role === "owner" ? "Owner" : user.role}</p>
            <p class="email">${user.email}</p>
          </div>
        </div>
      `;
    });

    adminList.innerHTML = html;

  }).catch(err => {
    adminList.innerHTML = `<p style="color:red;text-align:center;">Error: ${err.message}</p>`;
  });
</script>

</body>
</html>
