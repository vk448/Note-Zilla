<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Admin Registration | NoteZilla</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
     body{background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:10px;} 
 h1{font-size:2rem;color:#203a43;margin-bottom:5px;} 
  .container{
    width:100%;max-width:400px;background:#fff;border-radius:15px;padding:30px 25px;text-align:center;position:relative;z-index:2;box-shadow:0 8px 30px rgba(0,0,0,0.2);
  }
  h2{font-size:1.7rem;color:#1b1b1b;margin-bottom:8px;}
  p{color:#666;font-size:0.9rem;margin-bottom:20px;}

  input,select,button{
    width:100%;padding:12px;margin-bottom:12px;border-radius:8px;border:1.5px solid #ddd;font-size:14px;transition:0.3s;
  }
  input:focus,select:focus{border-color:#2c5364;outline:none;box-shadow:0 0 5px rgba(44,83,100,0.3);}
  button{background:linear-gradient(135deg,#203a43,#2c5364);color:#fff;font-weight:600;cursor:pointer;border:none;}
  button:hover{transform:scale(1.02);background:linear-gradient(135deg,#2c5364,#203a43);}

  .notice{font-size:0.9rem;color:#555;margin-top:12px;}
  .notice a{color:#2c5364;font-weight:600;text-decoration:none;}
  .notice a:hover{text-decoration:underline;}

  /* Loader Overlay */
  #loaderOverlay{
    display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.25);
    z-index:9999;justify-content:center;align-items:center;flex-direction:column;color:#fff;font-size:1.2rem;
  }
  .spinner{border:6px solid rgba(255,255,255,0.3);border-top:6px solid #fff;border-radius:50%;width:50px;height:50px;animation:spin 1s linear infinite;margin-bottom:12px;}
  @keyframes spin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}

  @media(max-width:420px){.container{padding:25px 20px;}h2{font-size:1.5rem;}}
form p {
  text-align: left;
  margin-bottom: 5px;
  color: black;
  font-weight: 600;
  margin-top: 10px;
}
</style>
</head>
<body>

<div id="loaderOverlay">
  <div class="spinner"></div>
  <div>Submitting registration...</div>
</div>

<div class="container">
  <h1>NoteZilla</h1>
  <h2>Admin Registration</h2>
  <p>Fill official details below</p>

  <form id="registerForm">
    <div>
      <p>Full Name *</p>
    <input type="text" name="Full Name" placeholder="Full Name" required>
    </div>
    <div>
   <p>Username *</p>
    <input type="text" name="Username" placeholder="Username" required>
    </div>
<div>
  <p>Email *</p>
    <input type="email" name="Email" placeholder="Email Address" required>
    </div>
<div>
  <p>Password *</p>
    <input type="password" name="Password" placeholder="Password" required>
    </div>
    <div>
      <P>Confirm Password *</P>
    <input type="password" name="Confirm Password" placeholder="Confirm Password" required>
    </div>
    <div>
      <p>Class *</p>
    <input type="number" name="Class" placeholder="Class">
    </div>
    <div>
      <p>Your Phone Number *</p>
    <input type="tel" name="Phone" placeholder="Phone Number" pattern="[0-9]{10}" required>
    </div>
<div>
  <p>Select Your Gender *</p>
    <select name="Gender" required>
      <option value="">Select Gender</option>
      <option>Male</option>
      <option>Female</option>
      <option>Other</option>
    </select>
    </div>
    <div>
      <p>Select Your Role *</p>
    <select name="Role" required>
      <option value="">Select Role</option>
      <option>Admin</option>
      <option>Co-Admin</option>
      <option>Teacher</option>
      <option>User</option>
    </select>
    </div>
    <button type="submit">Register</button>
  </form>

  <div class="notice">
    Already registered? <a href="admin-login.html">Login Here</a>
  </div>
</div>
<script>
const scriptUrl="https://script.google.com/macros/s/AKfycbyMnEs9EDAY58adzpya3fTPij3IHrmGeYC7d8OxCMaeAo_nw-dDUR8zhxdaUOmzgg/exec";
const loader=document.getElementById("loaderOverlay");

document.getElementById("registerForm").addEventListener("submit", e=>{
  e.preventDefault();
  const form=new FormData(e.target);
  const pass=form.get("Password");
  const confirm=form.get("Confirm Password");
  if(pass!==confirm){
    alert("⚠️ Passwords do not match!");
    return;
  }

  loader.style.display="flex"; // show loader
  fetch(scriptUrl,{method:"POST",body:form})
    .then(res=>res.text())
    .then(txt=>{
      loader.style.display="none";
      if(txt.includes("Success")){
        // Instead of redirecting, show success message
        const container = document.querySelector(".container");
        container.innerHTML = `
          <h2>✅ Registration Successful!</h2>
          <p>Your account has been created successfully.</p>
          <div class="notice">
            <a href="admin-login.html">Click here to Login</a>
          </div>
        `;
      } else { 
        alert("❌ Error: "+txt); 
      }
    }).catch(err=>{
      loader.style.display="none";
      alert("⚠️ Server Error: "+err.message);
    });
});
</script>


</body>
</html>
