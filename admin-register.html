<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin Registration | NoteZilla</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
:root {
  --primary:#0f2027;
  --secondary:#203a43;
  --accent:#2c5364;
  --success:#16a34a;
  --danger:#dc2626;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Inter',sans-serif;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:20px;
}
.container{
  max-width:440px;
  width:100%;
  background:#fff;
  border-radius:16px;
  padding:40px 35px;
  box-shadow:0 10px 40px rgba(0,0,0,0.3);
  text-align:center;
}
.logo{
  font-size:2.8rem;
  font-weight:700;
  background:linear-gradient(135deg,#203a43,#2c5364);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  margin-bottom:8px;
}
h2{color:#1a1a1a;margin-bottom:30px;font-weight:600;}
.photo-upload{
  width:140px;height:140px;margin:0 auto 25px;
  border:4px dashed var(--accent);
  border-radius:50%;
  background:#f8fdff;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  transition:0.3s;
}
.photo-upload:hover{border-color:#4c9aff;background:#e8f4ff;}
.photo-upload img{width:100%;height:100%;object-fit:cover;display:none;}
.photo-upload i{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:2.8rem;
  color:var(--accent);
}
.remove-photo{
  position:absolute;top:8px;right:8px;
  background:var(--danger);
  color:white;border:none;width:30px;height:30px;
  border-radius:50%;cursor:pointer;font-size:1rem;display:none;
}
label{display:block;text-align:left;margin:16px 0 8px;font-weight:600;color:#333;}
input,select{
  width:100%;
  padding:14px 16px;
  border:2px solid #ddd;
  border-radius:12px;
  font-size:1rem;
  transition:0.3s;
}
input:focus,select:focus{
  outline:none;
  border-color:var(--accent);
  box-shadow:0 0 0 4px rgba(44,83,100,0.15);
}
input::placeholder{color:#aaa;}
button[type="submit"]{
  width:100%;
  padding:16px;
  margin-top:30px;
  background:linear-gradient(135deg,#203a43,#2c5364);
  color:white;
  border:none;
  border-radius:12px;
  font-size:1.1rem;
  font-weight:600;
  cursor:pointer;
  transition:0.3s;
}
button[type="submit"]:hover:not(:disabled){
  transform:translateY(-3px);
  box-shadow:0 10px 25px rgba(32,58,67,0.4);
}
button[type="submit"]:disabled{
  background:#999;
  cursor:not-allowed;
}
.loader{
  display:none;
  position:fixed;inset:0;
  background:rgba(0,0,0,0.9);
  z-index:9999;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  color:white;font-size:1.5rem;
}
.spinner{
  width:70px;height:70px;
  border:6px solid rgba(255,255,255,0.3);
  border-top:6px solid white;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin-bottom:20px;
}
@keyframes spin{to{transform:rotate(360deg);}}
.toast{
  position:fixed;
  bottom:30px;
  left:50%;
  transform:translateX(-50%) translateY(100px);
  padding:14px 28px;
  background:#111;
  color:white;
  border-radius:12px;
  font-weight:500;
  z-index:10000;
  transition:transform 0.4s ease;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast.success{background:var(--success);}
.toast.error{background:var(--danger);}
.otp-section{
  display:none;
  margin-top:20px;
  padding:20px;
  border-radius:12px;
  background:#e0f7fa;
  border:1px solid #00bcd4;
}
.otp-section input{
  text-align:center;
  letter-spacing:10px;
  font-size:1.5rem;
}
.otp-section .otp-actions{
  margin-top:12px;
  display:flex;
  gap:10px;
  justify-content:center;
}
.otp-section button{
  padding:10px 18px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:600;
}
.otp-section .verify-btn{background:var(--success);color:white;}
.otp-section .resend-btn{background:transparent;color:#00bcd4;border:2px solid #00bcd4;}
.timer{margin-top:10px;font-weight:600;color:#0288d1;}
</style>
</head>
<body>

<div class="loader" id="loader">
  <div class="spinner"></div>
  <div>Processing...</div>
</div>

<div class="container">
  <div class="logo">NoteZilla</div>
  <h2>Admin Registration</h2>

  <form id="registerForm" novalidate>
    <div class="photo-upload" id="uploadBox">
      <i class="fas fa-camera"></i>
      <img id="photoPreview" alt="Profile Preview"/>
      <button type="button" class="remove-photo" id="removePhoto">×</button>
      <input type="file" id="photoInput" accept="image/*" hidden/>
    </div>
    <p><b>Upload Profile Image *</b></p>

    <label>Full Name *</label>
    <input type="text" id="fullName" placeholder="John Doe" required/>

    <label>Username *</label>
    <input type="text" id="username" placeholder="johndoe123" required minlength="4"/>

    <label>Email Address *</label>
    <input type="email" id="email" placeholder="you@example.com" required/>

    <label>Password *</label>
    <input type="password" id="password" placeholder="Create strong password" required minlength="6"/>

    <label>Confirm Password *</label>
    <input type="password" id="confirmPassword" required/>

    <label>Phone Number *</label>
    <input type="tel" id="phone" placeholder="9876543210" pattern="[0-9]{10}" required/>

    <label>Gender *</label>
    <select id="gender" required>
      <option value="" disabled selected>Select gender</option>
      <option>Male</option>
      <option>Female</option>
      <option>Other</option>
    </select>

    <label>Role *</label>
    <select id="role" required>
      <option value="" disabled selected>Select role</option>
      <option>Admin</option>
      <option>Co-Admin</option>
      <option>Teacher</option>
      <option>User</option>
    </select>

    <!-- OTP Section -->
    <div class="otp-section" id="otpSection">
      <p>We've sent a 6-digit OTP to <strong id="emailDisplay"></strong></p>
      <input type="text" id="otpInput" maxlength="6" placeholder="------"/>
      <div class="timer" id="otpTimer">03:00</div>
      <div class="otp-actions">
        <button type="button" class="verify-btn" id="verifyBtn">Verify OTP</button>
        <button type="button" class="resend-btn" id="resendBtn" style="display:none;">Resend OTP</button>
      </div>
    </div>

    <button type="submit" id="submitBtn">Submit for Approval & Send OTP</button>
  </form>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>
emailjs.init("XjSbu3DTfQtOBKW-l"); // EmailJS UserID

const firebaseConfig = {
  apiKey: "AIzaSyCVVqQnmO1Q83AucOqA5b5qUC4eo49sq6E",
  authDomain: "chat-box-e01e5.firebaseapp.com",
  databaseURL: "https://chat-box-e01e5-default-rtdb.firebaseio.com",
  projectId: "chat-box-e01e5",
  storageBucket: "chat-box-e01e5.firebasestorage.app",
  messagingSenderId: "597491149800",
  appId: "1:597491149800:web:7bd908925f70b62018125d"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const pendingRef = db.ref("admins_pending");

const uploadBox=document.getElementById("uploadBox");
const photoInput=document.getElementById("photoInput");
const photoPreview=document.getElementById("photoPreview");
const removePhoto=document.getElementById("removePhoto");
const loader=document.getElementById("loader");
const toast=document.getElementById("toast");
const form=document.getElementById("registerForm");
const otpSection=document.getElementById("otpSection");
const otpInput=document.getElementById("otpInput");
const verifyBtn=document.getElementById("verifyBtn");
const resendBtn=document.getElementById("resendBtn");
const otpTimer=document.getElementById("otpTimer");
const emailDisplay=document.getElementById("emailDisplay");
const submitBtn=document.getElementById("submitBtn");

let photoBase64=null;
let generatedOTP=null;
let otpVerified=false;
let timerInterval=null;
let timeLeft=180;

// Toast function
function showToast(msg,type="error"){
  toast.textContent=msg;
  toast.className=`toast ${type} show`;
  setTimeout(()=>toast.classList.remove("show"),4000);
}

// Image Upload
uploadBox.addEventListener("click",()=>photoInput.click());
photoInput.addEventListener("change",e=>{
  const file=e.target.files[0];
  if(!file)return;
  if(!file.type.startsWith("image/"))return showToast("Only images allowed");
  if(file.size>2*1024*1024)return showToast("Max 2MB");
  const reader=new FileReader();
  reader.onload=ev=>{
    photoBase64=ev.target.result;
    photoPreview.src=photoBase64;
    photoPreview.style.display="block";
    uploadBox.querySelector("i").style.display="none";
    removePhoto.style.display="block";
  };
  reader.readAsDataURL(file);
});
removePhoto.addEventListener("click",e=>{
  e.stopPropagation();
  photoBase64=null;
  photoPreview.src="";
  photoPreview.style.display="none";
  uploadBox.querySelector("i").style.display="block";
  removePhoto.style.display="none";
  photoInput.value="";
});

// Generate OTP
function generateOTP(){ return Math.floor(100000+Math.random()*900000).toString(); }

// Send OTP
async function sendOTP(email){
  generatedOTP=generateOTP();
  try{
    await emailjs.send("service_3p5ogj7","template_kqox2bf",{to_email:email,passcode:generatedOTP});
    showToast("OTP sent to email!","success");
    otpSection.style.display="block";
    emailDisplay.textContent=email;
    startOTPTimer();
  }catch(err){ showToast("Failed to send OTP","error"); }
}

// OTP Timer
function startOTPTimer(){
  clearInterval(timerInterval);
  timeLeft=180;
  resendBtn.style.display="none";
  verifyBtn.style.display="inline-block";
  updateTimerDisplay();
  timerInterval=setInterval(()=>{
    timeLeft--;
    updateTimerDisplay();
    if(timeLeft<=0){
      clearInterval(timerInterval);
      resendBtn.style.display="inline-block";
      verifyBtn.style.display="none";
      showToast("OTP expired! You can resend now.","error");
    }
  },1000);
}
function updateTimerDisplay(){
  const m=String(Math.floor(timeLeft/60)).padStart(2,'0');
  const s=String(timeLeft%60).padStart(2,'0');
  otpTimer.textContent=`${m}:${s}`;
}

// Verify OTP
verifyBtn.addEventListener("click",()=>{
  if(otpInput.value===generatedOTP){
    clearInterval(timerInterval);
    otpVerified=true;
    showToast("OTP verified successfully!","success");
    otpInput.disabled=true;
    verifyBtn.disabled=true;
  }else showToast("Incorrect OTP","error");
});

// Resend OTP
resendBtn.addEventListener("click",()=>{
  const email=document.getElementById("email").value.trim();
  if(email) sendOTP(email);
});

// Submit Form
form.addEventListener("submit",async e=>{
  e.preventDefault();
  const email=document.getElementById("email").value.trim();
  if(!otpVerified){ sendOTP(email); return showToast("OTP sent! Verify it to submit.","success"); }

  const data={
    fullName:document.getElementById("fullName").value.trim(),
    username:document.getElementById("username").value.trim().toLowerCase(),
    email:email.toLowerCase(),
    password:document.getElementById("password").value,
    confirmPassword:document.getElementById("confirmPassword").value,
    phone:document.getElementById("phone").value.trim(),
    gender:document.getElementById("gender").value,
    role:document.getElementById("role").value
  };

  if(!data.fullName) return showToast("Full name required");
  if(data.username.length<4) return showToast("Username too short");
  if(data.password.length<6) return showToast("Password too weak");
  if(data.password!==data.confirmPassword) return showToast("Passwords do not match");
  if(!/^\d{10}$/.test(data.phone)) return showToast("Phone must be 10 digits");

  submitBtn.disabled=true; loader.style.display="flex";
  try{
    await pendingRef.push({...data,photoURL:photoBase64||"",status:"pending",createdAt:firebase.database.ServerValue.TIMESTAMP});
    showToast("Registration submitted successfully!","success");
    setTimeout(()=> location.href="admin-login.html",1500);
  }catch(err){ showToast("Submission failed","error"); }
  finally{ loader.style.display="none"; submitBtn.disabled=false; }
});
</script>
</body>
</html>
