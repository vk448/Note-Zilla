<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Page - Join Groups</title>
<link rel="icon" href="Images/Favicon.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap');

/* ===== General Reset ===== */
* { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }
body {
    background-color:white ;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
}

/* ===== Header ===== */
header {
    width: 100%;
    padding: 15px 50px;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 1000;
}

header .logo {
    font-weight: 900;
    font-size: 1.8rem;
    background: linear-gradient(90deg, #fff, #ffd700);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

nav a {
    text-decoration: none;
    color: #fff;
    margin-left: 20px;
    font-weight: 500;
    transition: 0.3s;
}
nav a:hover { color: #ffd700; }

/* ===== Login Box ===== */
.login-box {
    background: rgba(255,255,255,0.95);
    color: #333;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.3);
    text-align: center;
    width: 320px;
    margin-top: 50px;
}

.login-box h2 {
    margin-bottom: 20px;
    color: #2575fc;
}

input, select {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border-radius: 5px;
    border: 1px solid #ccc;
}

button {
    width: 100%;
    padding: 10px;
    background: #6a11cb;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
}

button:hover { background: #2575fc; }

.error {
    color: red;
    font-size: 14px;
}
</style>
</head>
<body>

<!-- Login Box -->
<div class="login-box" id="login">
    <h2>Login to Join Group</h2>
    <select id="group">
        <option value="">Select Group</option>
        <option value="instagram">Instagram Group</option>
        <option value="whatsapp">WhatsApp Group</option>
    </select>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <p class="error" id="error"></p>
</div>

<script>
function login() {
    const user = document.getElementById('username').value;
    const pass = document.getElementById('password').value;
    const group = document.getElementById('group').value;
    const error = document.getElementById('error');

    if(!group) { error.textContent = 'Please select a group!'; return; }

    if(user === 'student' && pass === '1234') {
        if(group === 'instagram') {
            window.location.href = 'https://www.instagram.com/j/AbYCf0W1WuZy8ZkS/';
        } else if(group === 'whatsapp') {
            window.location.href = 'https://chat.whatsapp.com/Du8lV5WBCBL01pZsEm3Kki';
        }
    } else {
        error.textContent = 'Invalid username or password!';
    }
}
</script>
<!-- Read the Formbutton docs at formspree.io/formbutton/docs. See more examples at codepen.io/formspree -->
<script src="https://formspree.io/js/formbutton-v1.min.js" defer></script>
<script>
  /* paste this line in verbatim */
  window.formbutton=window.formbutton||function(){(formbutton.q=formbutton.q||[]).push(arguments)};
  /* customize formbutton below*/     
  formbutton("create", {
    action: "https://formspree.io/f/xeokweek",
    title: "How can we help?",
    fields: [
      { 
        type: "email", 
        label: "Email:", 
        name: "email",
        required: true,
        placeholder: "your@email.com"
      },
      {
        type: "textarea",
        label: "Message:",
        name: "message",
        placeholder: "What's on your mind?",
      },
      { type: "submit" }      
    ],
    styles: {
      title: {
        backgroundColor: "gray"
      },
      button: {
        backgroundColor: "gray"
      }
    }
  });
</script>
<script>
    // favicon.js
const link = document.createElement('link');
link.rel = 'icon';
link.type = 'image/png';
link.href = 'images/favicon.png'; // yahan apne icon ka naam likho
document.head.appendChild(link);

  </script>
   <script src="Record.html"></script>
</body>
</body>
</html>
