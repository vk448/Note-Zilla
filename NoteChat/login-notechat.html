<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register - NoteChat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
</head>
<body>
    <div class="container">
        <img style="border-radius: 50%;" src="../Images/worldchat.png" alt="NoteChat Logo" class="logo">
        <h1>Welcome to NoteChat</h1>
        <p>Secure messaging with notes and chats</p>
        
        <div class="tabs">
            <div class="tab active" id="loginTab">Login</div>
            <div class="tab" id="registerTab">Register</div>
        </div>
        
        <!-- Login Form -->
        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" required placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn">Login</button>
        </form>
        
        <!-- Register Form -->
        <form id="registerForm" style="display:none;">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="regName" required placeholder="John Doe">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="regEmail" required placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="regPassword" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn">Register</button>
        </form>
        
        <div class="divider"><span>OR</span></div>
        
        <button class="btn google" id="googleSignIn">
            <i class="fab fa-google"></i> Continue with Google
        </button>
        
        <div class="links">
            <a href="#">Forgot password?</a> • <a href="#">Terms & Privacy</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
