<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NoteChat Mobile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: #0b141a; 
            color: #e9edef; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }
.send-btn{
    padding: 12px 12px;
    background-color: #005c4b;
    border-radius: 50%;
}
        .main-content { flex: 1; position: relative; overflow: hidden; }

        .screen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            display: none; flex-direction: column; 
        }
        .screen.active { display: flex; }

        /* Top Header */
        .top-header {
            background: #111b21;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #2a3942;
            flex: 0 0 auto;
        }
        .top-header .title {
            font-size: 21px;
            font-weight: 600;
        }
        .top-header .icons i {
            color: #8696a0;
            font-size: 22px;
            margin-left: 20px;
        }

        /* Chat List */
        .chat-list {
            flex: 1;
            overflow-y: auto;
            background: #0b141a;
        }
        .chat-item {
            display: flex;
            padding: 14px 16px;
            cursor: pointer;
            border-bottom: 1px solid #2a3942;
            transition: background 0.2s;
        }
        .chat-item:hover { background: #111b21; }
        .chat-item .avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: #aebac1;
            margin-right: 16px;
            flex-shrink: 0;
            background-size: cover;
            background-position: center;
        }
        .chat-info {
            flex: 1;
            min-width: 0;
        }
        .chat-info .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .chat-info .name {
            font-size: 17px;
            font-weight: 500;
        }
        .chat-info .time {
            font-size: 13px;
            color: #8696a0;
        }
        .chat-info .message {
            font-size: 14.5px;
            color: #8696a0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Chat Screen */
        .chat-header {
            background: #202c33;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            flex: 0 0 auto;
        }
        .chat-header .back {
            color: white;
            font-size: 24px;
            margin-right: 20px;
            cursor: pointer;
        }
        .chat-header .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #aebac1;
            margin-right: 14px;
            background-size: cover;
        }
        .chat-header .info .name {
            font-size: 18px;
            font-weight: 500;
        }
        .chat-header .info .status {
            font-size: 14px;
            color: #8696a0;
        }
        .chat-header .icons {
            margin-left: auto;
            display: flex;
            gap: 26px;
        }
        .chat-header .icons i {
            color: #8696a0;
            font-size: 22px;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-9117-166f1d9e9c9f.png') center/cover #0b141a;
        }
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 16px;
            word-wrap: break-word;
        }
        .message.sent {
            background: #005c4b;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .message.received {
            background: #202c33;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .message img, .message video {
            max-width: 100%;
            border-radius: 12px;
            margin-top: 8px;
        }
        .message .text {
            font-size: 15.5px;
            line-height: 1.4;
        }
        .message .time {
            font-size: 12px;
            color: rgba(255,255,255,0.7);
            text-align: right;
            margin-top: 6px;
        }

        .input-area {
            background: #202c33;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 0 0 auto;
        }
        .input-area i {
            color: #8696a0;
            font-size: 24px;
            cursor: pointer;
        }
        .input-area .message-input {
            flex: 1;
            background: #2a3942;
            border-radius: 28px;
            padding: 12px 18px;
            border: none;
            color: #e9edef;
            font-size: 16px;
            outline: none;
        }
        .input-area .send-btn {
            background: #00a884;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .input-area .send-btn i {
            color: white;
            font-size: 20px;
        }

        /* Bottom Navigation */
        .bottom-nav {
            background: #111b21;
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            border-top: 1px solid #2a3942;
            flex: 0 0 auto;
        }
        .bottom-nav .tab {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            padding: 6px;
        }
        .bottom-nav .tab i {
            font-size: 24px;
            color: #8696a0;
        }
        .bottom-nav .tab span {
            font-size: 11px;
            margin-top: 4px;
            color: #8696a0;
        }
        .bottom-nav .tab.active i,
        .bottom-nav .tab.active span {
            color: #00a884;
        }
        .delete-btn{
            color: red;
        }
    </style>
</head>
<body>
    <div class="main-content">
        <!-- Chats Screen -->
        <div class="screen active" id="chatsScreen">
            <div class="top-header">
                <div class="title">NoteChat</div>
                <div class="icons">
                    <i class="fas fa-camera"></i>
                    <i class="fas fa-search"></i>
                    <i class="fas fa-ellipsis-v"></i>
                </div>
            </div>
            <div class="chat-list" id="chatList">
                <!-- Chats will be loaded dynamically -->
            </div>
        </div>

        <!-- Chat Screen -->
        <div class="screen" id="chatScreen">
            <div class="chat-header">
                <i class="fas fa-arrow-left back" id="backBtn"></i>
                <div class="avatar" id="chatAvatar"></div>
                <div class="info">
                    <div class="name" id="chatName">World Group Chat</div>
                    <div class="status" id="chatStatus">Public group</div>
                </div>
                <div class="icons">
                    <i class="fas fa-video-camera"></i>
                    <i class="fas fa-phone"></i>
                    <i class="fas fa-ellipsis-v"></i>
                </div>
            </div>
            <div class="messages" id="messages">
                <!-- Messages loaded here -->
            </div>
            <div class="input-area">
                <i class="far fa-smile"></i>
                <i class="fas fa-paperclip" id="attachBtn"></i>
                <input type="file" id="mediaInput" accept="image/*,video/*" style="display:none;">
                <input type="text" class="message-input" id="messageInput" placeholder="Type a message">
                <div class="send-btn" id="sendBtn">
                    <i class="fas fa-microphone"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <div class="tab active" data-screen="chatsScreen">
            <i class="fas fa-comment-dots"></i>
            <span>Chats</span>
        </div>
        <div class="tab" data-screen="callsScreen">
            <i class="fas fa-phone"></i>
            <span>Calls</span>
        </div>
        <div class="tab" data-screen="statusScreen">
            <i class="fas fa-circle-info"></i>
            <span>Status</span>
        </div>
    </div>

    <!-- Audio -->
    <audio id="incomingSound" src="sound/incoming.mp3" preload="auto"></audio>
    <audio id="outgoingSound" src="sound/outgoing.mp3" preload="auto"></audio>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script src="js/firebase-config.js"></script>
    <script src="js/mobile-dashboard.js"></script>
</body>
</html>
