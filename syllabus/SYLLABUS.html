<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
  text-align: center;
}

body {
  background: #ffffff;
  color: #333;
  line-height: 1.6;
}

/* Header */
header {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 15px 50px;
  background: #fff;
  box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  position: sticky;
  top: 0;
  z-index: 100;
}

.logo {
  font-weight: 900;
  font-size: 1.8rem;
  background: linear-gradient(90deg, #4e73df, #1cc88a);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* Back link */
.back {
  display: inline-block;
  margin: 20px auto;
  text-decoration: none;
  color: #1cc88a;
  font-weight: 500;
}
.back:hover {
  color: #17a673;
}

/* Page Titles */
h1 {
  font-size: 2.5rem;
  text-align: center;
  margin: 20px 0;
  color: #4e73df;
}
h2 {
  font-size: 2rem;
  text-align: center;
  margin-bottom: 30px;
  color: #1cc88a;
}

/* Buttons */
.btn {
  display: inline-block;
  margin: 10px auto;
  padding: 12px 30px;
  background: #4e73df;
  color: white;
  border-radius: 8px;
  text-decoration: none;
  font-weight: bold;
  transition: background 0.2s, transform 0.2s;
}
.btn:hover {
  background: #1cc88a;
  transform: translateY(-3px);
}

/* Responsive */
@media (max-width: 600px) {
  h1 {
    font-size: 2rem;
  }
  h2 {
    font-size: 1.5rem;
  }
  .btn {
    width: 80%;
    font-size: 16px;
  }
}
</style>
</head>
<body>

<!-- Header -->
<header>
  <div class="logo"><a href="../">Note Zilla</a></div>
</header>


<h1>Syllabus All Subjects</h1>
<h2>Subjects</h2>

  <a href="9_Maths_EM.pdf" class="btn">Maths</a>

  <a href="9_sst_EM.pdf" class="btn">Social Science</a>
  <a href="9_Hindi_HM.pdf" class="btn">Hindi</a>
  <a href="9_English_EM.pdf" class="btn">English</a>
  <a href="9_Sanskrit_HM.pdf" class="btn">Sanskrit</a>
  <a href="9_Punjabi_HM.pdf" class="btn">Punjabi</a>
</div>
<!-- Read the Formbutton docs at formspree.io/formbutton/docs. See more examples at codepen.io/formspree -->
<script src="https://formspree.io/js/formbutton-v1.min.js" defer></script>
<script>
  /* paste this line in verbatim */
  window.formbutton=window.formbutton||function(){(formbutton.q=formbutton.q||[]).push(arguments)};
  /* customize formbutton below*/     
  formbutton("create", {
    action: "https://formspree.io/f/xeokweek",
    title: "How can we help?",
    fields: [
      { 
        type: "email", 
        label: "Email:", 
        name: "email",
        required: true,
        placeholder: "your@email.com"
      },
      {
        type: "textarea",
        label: "Message:",
        name: "message",
        placeholder: "What's on your mind?",
      },
      { type: "submit" }      
    ],
    styles: {
      title: {
        backgroundColor: "gray"
      },
      button: {
        backgroundColor: "gray"
      }
    }
  });
</script>
 <script src="../Record.html"></script>
</body>
</html>
