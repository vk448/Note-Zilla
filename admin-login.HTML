<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NoteZilla — Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

/* BODY SCROLL FIXED */
body{
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  min-height:100vh;
  overflow-y:auto;     /* SCROLL ENABLED */
  overflow-x:hidden;
  color:white;
}

/* Loader */
#loaderOverlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:9999;
  justify-content:center;align-items:center;flex-direction:column;color:#fff;font-size:1.5rem;}
.spinner{border:8px solid rgba(255,255,255,0.3);border-top:8px solid #fff;border-radius:50%;width:60px;height:60px;
  animation:spin 1s linear infinite;margin-bottom:15px;}
@keyframes spin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg)}}

/* Toast Message */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:16px 40px;border-radius:12px;
  color:white;font-weight:600;z-index:10000;box-shadow:0 10px 30px rgba(0,0,0,0.4);opacity:0;
  animation:slideDown 0.5s ease forwards;font-size:1.1rem;}
.toast.success{background:#28a745;}
.toast.error{background:#dc3545;}
@keyframes slideDown{from{opacity:0;transform:translateX(-50%) translateY(-50px);}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes slideUp{to{opacity:0;transform:translateX(-50%) translateY(-50px)}}

/* Login & Forgot Box */
.container{width:100%;max-width:420px;background:#fff;border-radius:20px;padding:45px 35px;text-align:center;
  box-shadow:0 15px 50px rgba(0,0,0,0.5);color:#333;margin:30px auto;}
h1{font-size:2.4rem;color:#203a43;margin-bottom:10px;}
h2{font-size:1.6rem;margin-bottom:25px;color:#444;}
input{width:100%;padding:16px;margin:12px 0;border-radius:12px;border:2px solid #ddd;font-size:16px;transition:0.3s;}
input:focus{border-color:#2c5364;outline:none;box-shadow:0 0 12px rgba(44,83,100,0.4);}
button{width:100%;padding:16px;background:linear-gradient(135deg,#203a43,#2c5364);color:white;border:none;
  border-radius:12px;font-size:1.2rem;font-weight:700;cursor:pointer;transition:0.3s;margin-top:10px;}
button:hover{transform:scale(1.04);}
.notice{margin-top:25px;font-size:1rem;color:#666;}
.notice a{color:#2c5364;font-weight:700;text-decoration:none;cursor:pointer;}
.notice a:hover{color:#1cc88a;text-decoration:underline;}

/* Dashboard */
.dashboard{display:none;background:#f1f4f8;min-height:100vh;overflow-y:auto;}
.sidebar{width:280px;background:#1b2838;color:#fff;padding:25px 15px;box-shadow:5px 0 25px rgba(0,0,0,0.4);}
.sidebar img{width:110px;height:110px;border-radius:50%;border:5px solid #4fc3f7;margin-bottom:15px;object-fit:cover;}
.sidebar h3{font-size:1.35rem;margin-bottom:30px;text-align:center;color:#4fc3f7;font-weight:700;}
.sidebar button{width:100%;margin:10px 0;padding:15px;background:transparent;color:#ccc;
  border:none;border-radius:12px;text-align:left;font-size:1.05rem;cursor:pointer;
  display:flex;align-items:center;gap:16px;transition:0.3s;padding-left:22px;}
.sidebar button:hover{background:#203a43;color:white;}
.sidebar button.active{background:#4fc3f7;color:#1b2838;font-weight:700;}
.sidebar i{font-size:1.3rem;width:28px;text-align:center;}
.logout-btn{background:#e74c3c!important;margin-top:auto;}
.logout-btn:hover{background:#c0392b!important;}
.sidebar.collapsed{width:90px;align-items:center;}
.sidebar.collapsed img,.sidebar.collapsed h3,.sidebar.collapsed button span{display:none;}
.sidebar.collapsed button{justify-content:center;padding:15px;}
.main{flex:1;display:flex;flex-direction:column;}
.topbar{background:#fff;display:flex;align-items:center;justify-content:space-between;
  padding:18px 30px;border-bottom:3px solid #eee;box-shadow:0 4px 15px rgba(0,0,0,0.1);}
.topbar h2{color:#203a43;font-size:1.6rem;font-weight:700;}
.menu-icon{font-size:32px;cursor:pointer;color:#203a43;font-weight:bold;}
iframe{flex:1;width:100%;border:none;background:#fff;}

/* Mobile */
@media(max-width:768px){
  .sidebar{position:absolute;left:-280px;top:0;height:100%;z-index:100;transition:left 0.3s;}
  .sidebar.active{left:0;}
}
</style>
</head>
<body>

<!-- Loader -->
<div id="loaderOverlay">
  <div class="spinner"></div>
  <div id="loaderText">Processing...</div>
</div>

<!-- Login Box -->
<div class="container" id="loginBox">
  <h1>NoteZilla</h1>
  <h2>Admin Panel Login</h2>
  <form id="loginForm">
    <input type="text" id="username" placeholder="Username or Email" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit">Login Now</button>
  </form>
  <div class="notice">
    Not registered? <a href="admin-register.html">Register Here</a><br>
    <a onclick="showForgotPassword()">Forgot Password?</a>
  </div>
</div>

<!-- Forgot Password Box -->
<div class="container" id="forgotBox" style="display:none;">
  <h1>NoteZilla</h1>
  <h2>Reset Password</h2>
  <p>Enter your registered email</p>
  <input type="email" id="resetEmail" placeholder="Your Email Address" required>
  <button onclick="sendResetLink()">Send OTP + Link</button>
  <p class="notice"><a onclick="showLogin()">Back to Login</a></p>
  <div id="resetMsg"></div>
</div>

<!-- Dashboard -->
<div class="dashboard" id="dashboard">
  <div class="sidebar" id="sidebar">
    <img id="adminPhoto" src="" alt="Profile">
    <h3 id="adminName">Loading...</h3>
    <button onclick="loadPage('upload-work-data-base-admin-co-admin.html', this)"><i class="fa-solid fa-database"></i><span>Notes Database</span></button>
    <button onclick="loadPage('https://docs.google.com/spreadsheets/d/18ZuLufS0Vkulej9N_mtAKKw4WGulKTYyhdxjKIs-Y-A/edit', this)"><i class="fa-solid fa-calendar-days"></i><span>Time Table</span></button>
    <button onclick="loadPage('delete-database-work-admin-owner-notezilla-database-work-add-on.html', this)"><i class="fa-solid fa-pen-to-square"></i><span>Edit Notes</span></button>
    <button onclick="loadPage('credits.html', this)"><i class="fa-solid fa-id-card"></i><span>Credits</span></button>
    <button onclick="window.open('https://note-zilla.netlify.app/', '_blank')"><i class="fa-solid fa-globe"></i><span>Visit Site</span></button>
    <button class="logout-btn" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></button>
  </div>
  <div class="main">
    <div class="topbar">
      <div class="menu-icon" onclick="toggleSidebar()">Menu</div>
      <h2>NoteZilla Admin Panel</h2>
    </div>
    <iframe id="frameBox" src="welcome.html"></iframe>
  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCVVqQnmO1Q83AucOqA5b5qUC4eo49sq6E",
    authDomain: "chat-box-e01e5.firebaseapp.com",
    databaseURL: "https://chat-box-e01e5-default-rtdb.firebaseio.com",
    projectId: "chat-box-e01e5",
    storageBucket: "chat-box-e01e5.firebasestorage.app",
    messagingSenderId: "597491149800",
    appId: "1:597491149800:web:7bd908925f70b62018125d",
    measurementId: "G-FJ6PKK2FNQ"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const loader = document.getElementById("loaderOverlay");
  const loginBox = document.getElementById("loginBox");
  const forgotBox = document.getElementById("forgotBox");
  const dashboard = document.getElementById("dashboard");
  const adminName = document.getElementById("adminName");
  const adminPhoto = document.getElementById("adminPhoto");

  // Toast Message
  function toast(text, type = "success") {
    const t = document.createElement("div");
    t.className = `toast ${type}`;
    t.innerHTML = text;
    document.body.appendChild(t);
    setTimeout(() => { t.style.animation = "slideUp 0.5s ease forwards"; setTimeout(() => t.remove(), 500); }, 5000);
  }

  // Auto Login
  window.onload = () => {
    const user = sessionStorage.getItem("currentUser");
    if (user) showDashboard(JSON.parse(user));
  };

  // Login
  document.getElementById("loginForm").onsubmit = async (e) => {
    e.preventDefault();
    const id = document.getElementById("username").value.trim().toLowerCase();
    const pass = document.getElementById("password").value;
    loader.style.display = "flex";

    try {
      const snap = await db.ref("admins").once("value");
      let found = null;
      snap.forEach(c => {
        const u = c.val();
        if ((u.username?.toLowerCase() === id || u.email?.toLowerCase() === id) && atob(u.password) === pass) {
          found = { id: c.key, ...u };
        }
      });

      if (found) {
        sessionStorage.setItem("currentUser", JSON.stringify(found));
        toast(`Welcome back, ${found.fullName}!`, "success");
        setTimeout(() => showDashboard(found), 1500);
      } else {
        toast("Wrong username/email or password!", "error");
      }
    } catch (err) {
      toast("Login failed!", "error");
    } finally {
      loader.style.display = "none";
    }
  };

  // Show/Hide Forgot Password
  function showForgotPassword() { loginBox.style.display = "none"; forgotBox.style.display = "block"; }
  function showLogin() { forgotBox.style.display = "none"; loginBox.style.display = "block"; document.getElementById("resetMsg").innerHTML = ""; }

  // Send OTP + Reset Link
  async function sendResetLink() {
    const email = document.getElementById("resetEmail").value.trim().toLowerCase();
    if (!email) return toast("Please enter your email!", "error");

    loader.style.display = "flex";
    document.getElementById("loaderText").textContent = "Sending OTP...";

    try {
      const snap = await db.ref("admins").orderByChild("email").equalTo(email).once("value");
      if (!snap.exists()) { toast("No account found with this email!", "error"); loader.style.display = "none"; return; }

      const userId = Object.keys(snap.val())[0];
      const otp = Math.floor(100000 + Math.random() * 900000).toString();
      const otpExpiry = Date.now() + 5 * 60 * 1000;
      const token = Math.random().toString(36).substring(2, 20);

      await db.ref("passwordResets").child(token).set({ userId, email, otp, otpExpiry });

      const resetLink = window.location.origin + "/reset-password.html?token=" + token;

      navigator.clipboard.writeText(resetLink + "\n\nYour OTP: " + otp);
      document.getElementById("resetMsg").innerHTML = `
        <div style="background:#d4edda;color:#155724;padding:20px;border-radius:12px;margin:15px 0;line-height:1.8;">
          <strong>OTP Sent!</strong><br><br>
          Your 6-digit OTP: <strong style="font-size:1.6rem;letter-spacing:8px;">${otp}</strong><br><br>
          Reset Link (5 min):<br>
          <strong style="word-break:break-all;font-size:0.9rem;">${resetLink}</strong><br><br>
          <small>Both copied to clipboard!</small>
        </div>
      `;
      toast("OTP + Link copied!", "success");
    } catch (err) {
      toast("Error: " + err.message, "error");
    } finally {
      loader.style.display = "none";
    }
  }

  function showDashboard(user) {
    loginBox.style.display = "none"; forgotBox.style.display = "none"; dashboard.style.display = "flex";
    adminName.textContent = `${user.fullName} (${user.role})`;
    adminPhoto.src = user.photoURL?.startsWith("data:") ? user.photoURL : 
                     (user.photoURL || `https://api.dicebear.com/7.x/avataaars/svg?seed=${user.username}`);

    const isAdmin = ["Admin", "Co-Admin", "owner"].includes(user.role);
    document.querySelectorAll(".sidebar button:not(.logout-btn)").forEach(btn => {
      btn.style.display = isAdmin ? "flex" : "none";
    });
  }

  document.getElementById("logoutBtn").onclick = () => {
    sessionStorage.clear();
    toast("Logged out successfully!", "success");
    setTimeout(() => location.reload(), 1500);
  };

  function loadPage(url, btn) {
    if (url.includes("http")) { window.open(url, "_blank"); return; }
    document.getElementById("frameBox").src = url;
    document.querySelectorAll(".sidebar button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
  }

  function toggleSidebar() {
    const s = document.getElementById("sidebar");
    if (window.innerWidth <= 768) s.classList.toggle("active");
    else s.classList.toggle("collapsed");
  }
  // showDashboard() function mein yeh add kar do

</script>
</body>
</html>
