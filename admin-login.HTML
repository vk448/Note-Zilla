<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NoteZilla - Login</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root { --primary: #203a43; --accent: #4fc3f7; --danger: #e74c3c; --success: #27ae60; }
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
  body{
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    min-height:100vh;display:flex;justify-content:center;align-items:center;color:white;
  }
  .container{
    background:white;color:#333;padding:50px 40px;border-radius:22px;
    box-shadow:0 25px 70px rgba(0,0,0,0.6);width:90%;max-width:420px;text-align:center;
  }
  h1{font-size:2.8rem;color:var(--primary);margin-bottom:8px;font-weight:700;}
  h2{font-size:1.5rem;color:#555;margin-bottom:30px;}
  input{width:100%;padding:18px;margin:12px 0;border-radius:14px;border:2px solid #ddd;font-size:16px;}
  input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 5px rgba(79,195,247,0.25);}
  button{width:100%;padding:18px;background:linear-gradient(135deg,var(--primary),#2c5364);
    color:white;border:none;border-radius:14px;font-size:1.3rem;font-weight:700;cursor:pointer;margin-top:10px;}
  button:hover{transform:translateY(-3px);box-shadow:0 10px 25px rgba(0,0,0,0.4);}
  #loader{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);
    z-index:9999;justify-content:center;align-items:center;flex-direction:column;color:white;font-size:1.8rem;}
  .spinner{width:70px;height:70px;border:8px solid #fff3;border-top:8px solid var(--accent);border-radius:50%;animation:s 1s linear infinite;margin-bottom:20px;}
  @keyframes s{to{transform:rotate(360deg)}}
  .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:15px 35px;border-radius:12px;color:white;
    font-weight:600;z-index:99999;box-shadow:0 10px 30px rgba(0,0,0,0.5);opacity:0;animation:t 0.6s forwards;}
  .toast.success{background:var(--success);}
  .toast.error{background:var(--danger);}
  @keyframes t{from{opacity:0;transform:translateX(-50%) translateY(-100px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
</style>
</head>
<body>

<div id="loader">
  <div class="spinner"></div>
  <div>Logging in...</div>
</div>

<div class="container">
  <h1>NoteZilla</h1>
  <h2>Admin Login</h2>
  <form id="loginForm">
    <input type="text" id="username" placeholder="Username or Email" required autocomplete="off">
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit">Login Now</button>
  </form>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCVVqQnmO1Q83AucOqA5b5qUC4eo49sq6E",
  authDomain: "chat-box-e01e5.firebaseapp.com",
  databaseURL: "https://chat-box-e01e5-default-rtdb.firebaseio.com",
  projectId: "chat-box-e01e5",
  storageBucket: "chat-box-e01e5.firebasestorage.app",
  messagingSenderId: "597491149800",
  appId: "1:597491149800:web:7bd908925f70b62018125d"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function toast(msg, type="error"){
  const t = document.createElement("div");
  t.className = `toast ${type}`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 4000);
}

document.getElementById("loginForm").onsubmit = async function(e) {
  e.preventDefault();
  const username = document.getElementById("username").value.trim().toLowerCase();
  const password = document.getElementById("password").value.trim();
  
  if(!username || !password) return toast("Fill both fields!", "error");
  
  document.getElementById("loader").style.display = "flex";

  try {
    const snap = await db.ref("admins").once("value");
    let found = null;
    
    snap.forEach(child => {
      const user = child.val();
      const dbUser = (user.username || user.email || "").toString().toLowerCase().trim();
      const dbPass = (user.password || "").toString().trim();
      
      if(dbUser === username) {
        try {
          if(atob(dbPass) === password) found = {id: child.key, ...user};
        } catch {
          if(dbPass === password) found = {id: child.key, ...user};
        }
      }
    });

    if(found) {
      // Save login session
      sessionStorage.setItem("adminUser", JSON.stringify(found));
      toast("Login Successful!", "success");
      setTimeout(() => {
        window.location.href = "admin-panel.html";
      }, 1200);
    } else {
      toast("Wrong Username or Password!", "error");
    }
  } catch(err) {
    console.error(err);
    toast("Connection Failed!", "error");
  } finally {
    document.getElementById("loader").style.display = "none";
  }
};
</script>
</body>
</html>
