<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteZilla — Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* (CSS code is the same as before, truncated for brevity) */
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;} 
        body{background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:10px;} 
        .container{width:100%;max-width:400px;background:#fff;border-radius:15px;padding:30px 25px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,0.2);} 
        h1{font-size:2rem;color:#203a43;margin-bottom:5px;} 
        h2{font-size:1.7rem;color:#1b1b1b;margin-bottom:8px;} 
        p{color:#666;font-size:0.9rem;margin-bottom:20px;} 
        input,button{width:100%;padding:12px;margin-bottom:12px;border-radius:8px;border:1.5px solid #ddd;font-size:14px;transition:0.3s;} 
        input:focus{border-color:#2c5364;outline:none;box-shadow:0 0 5px rgba(44,83,100,0.3);} 
        button{background:linear-gradient(135deg,#203a43,#2c5364);color:#fff;font-weight:600;cursor:pointer;border:none;} 
        button:hover{transform:scale(1.02);background:linear-gradient(135deg,#2c5364,#203a43);} 
        .notice{font-size:0.9rem;color:#555;margin-top:12px;} 
        .notice a{color:#2c5364;font-weight:600;text-decoration:none;} 
        .notice a:hover{text-decoration:underline;} 
        #loaderOverlay{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.25);z-index:9999;justify-content:center;align-items:center;flex-direction:column;color:#fff;font-size:1.2rem;} 
        .spinner{border:6px solid rgba(255,255,255,0.3);border-top:6px solid #fff;border-radius:50%;width:50px;height:50px;animation:spin 1s linear infinite;margin-bottom:12px;} 
        
        /* New Styles for User Details Box */
        #welcomeBox{display:none;margin-top:15px;background:#f3f3f3;padding:20px;border-radius:12px;text-align:center;} 
        #welcomeBox h3{margin-bottom:15px;color:#203a43;} 
        #userInfo{text-align:left; margin-bottom:15px; padding:0 10px;}
        #userInfo div{padding:6px 0; border-bottom:1px dotted #ccc; font-size:0.95rem; color:#444;}
        #userInfo strong{color:#203a43; display:inline-block; width:90px;}
        
        #welcomeBox a{display:inline-block;padding:10px 20px;background:#2c5364;color:#fff;border-radius:8px;text-decoration:none;font-weight:600; margin-top:10px;} 
        #welcomeBox a:hover{background:#203a43;} 
        @keyframes spin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}} 
        @media (max-width:480px){.container{padding:25px 20px;}h1{font-size:1.5rem;} h2{font-size:1.4rem;}}
    </style>
</head>
<body>

    <div id="loaderOverlay">
        <div class="spinner"></div>
        <div>Logging in...</div>
    </div>

    <div class="container">
        <h1>NoteZilla</h1>
        <h2>Login to Your Account</h2>
        <p>Enter your credentials to access your admin dashboard</p>

        <form id="loginForm">
            <input type="text" name="Username" placeholder="Username" required>
            <input type="password" name="Password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        <div class="notice">
            Not registered? 
            <a href="admin-register.html">Register Here</a>
        </div>

        <div id="welcomeBox">
            <h3 id="welcomeText"></h3>
            <div id="userInfo">
                </div>
            <a href="upload.html">➡️ Go to Upload Database</a>
        </div>
    </div>

    <script>
        // *** इस URL को अपने Google Apps Script Web App URL से बदलें ***
        const scriptUrl = "https://script.google.com/macros/s/AKfycbyauck1tUPnDBrZYqUY1ogkhQAYaj_acdtC1pQIdj9Nu4XoBOjZc8KhJDulQszmuZuR/exec"; 

        const loader = document.getElementById("loaderOverlay");
        const welcomeBox = document.getElementById("welcomeBox");
        const welcomeText = document.getElementById("welcomeText");
        const userInfo = document.getElementById("userInfo"); // New element reference

        document.getElementById("loginForm").addEventListener("submit", e => {
            e.preventDefault();
            const formData = new FormData(e.target);
            
            loader.style.display = "flex";

            fetch(scriptUrl, {
                method: "POST",
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                loader.style.display = "none";
                
                if (data.status === "success") {
                    // Success: Display welcome message
                    welcomeText.innerText = `🎉 Welcome, ${data.fullName || data.username}!`;
                    
                    // Clear previous details
                    userInfo.innerHTML = ''; 

                    // Insert all user details into the list
                    userInfo.innerHTML = `
                        <div><strong>Role:</strong> ${data.role || 'N/A'}</div>
                        <div><strong>Username:</strong> ${data.username || 'N/A'}</div>
                        <div><strong>Email:</strong> ${data.email || 'N/A'}</div>
                        <div><strong>Phone:</strong> ${data.phone || 'N/A'}</div>
                        <div><strong>Class:</strong> ${data.class || 'N/A'}</div>
                        <div><strong>Gender:</strong> ${data.gender || 'N/A'}</div>
                    `;

                    welcomeBox.style.display = "block";
                    e.target.style.display = "none"; // Hide the form
                    document.querySelector('.notice').style.display = "none"; // Hide register link
                } else {
                    alert("❌ Login Failed: " + data.message);
                }
            })
            .catch(err => {
                loader.style.display = "none";
                alert("⚠️ Server Error: Could not connect. " + err.message);
            });
        });
    </script>
</body>
</html>
