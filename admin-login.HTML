<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Registration | NoteZilla</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
  body{
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    display:flex;justify-content:center;align-items:center;
    min-height:100vh;padding:10px;
  }
  .container{
    width:100%;max-width:400px;background:#fff;border-radius:15px;
    padding:30px 25px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,0.2);
  }
  h1{font-size:2rem;color:#203a43;margin-bottom:5px;}
  h2{font-size:1.7rem;margin-bottom:8px;}
  p{color:#555;font-size:0.9rem;}

  input,select,button{
    width:100%;padding:12px;margin-bottom:12px;border-radius:8px;
    border:1.5px solid #ddd;font-size:14px;transition:0.3s;
  }
  input:focus,select:focus{
    border-color:#2c5364;outline:none;box-shadow:0 0 5px rgba(44,83,100,0.3);
  }
  button{
    background:linear-gradient(135deg,#203a43,#2c5364);
    color:#fff;font-weight:600;border:none;cursor:pointer;
  }
  button:hover{transform:scale(1.02);}

  form p{
    text-align:left;color:black;font-weight:600;margin:5px 0;
  }

  /* Loader */
  #loaderOverlay{
    display:none;position:fixed;top:0;left:0;width:100%;height:100%;
    background:rgba(0,0,0,0.25);backdrop-filter:blur(2px);
    justify-content:center;align-items:center;z-index:99999;
    flex-direction:column;color:white;
  }
  .spinner{
    width:50px;height:50px;border-radius:50%;
    border:6px solid rgba(255,255,255,0.3);
    border-top:6px solid white;
    animation:spin 1s linear infinite;
  }
  @keyframes spin{100%{transform:rotate(360deg);}}

</style>
</head>

<body>

<!-- Loader -->
<div id="loaderOverlay">
  <div class="spinner"></div>
  <br> Submitting...
</div>

<!-- MAIN REGISTRATION BOX -->
<div class="container" id="mainBox">

  <h1>NoteZilla</h1>
  <h2>Admin Registration</h2>
  <p>Fill official details below</p>

  <form id="registerForm">

    <p>Full Name *</p>
    <input type="text" name="fullName" required>

    <p>Username *</p>
    <input type="text" name="username" required>

    <p>Email *</p>
    <input type="email" name="email" required>

    <p>Password *</p>
    <input type="password" name="password" required>

    <p>Confirm Password *</p>
    <input type="password" name="confirmPassword" required>

    <p>Class *</p>
    <input type="number" name="class">

    <p>Phone *</p>
    <input type="tel" name="phone" pattern="[0-9]{10}" required>

    <p>Select Gender *</p>
    <select name="gender" required>
      <option value="">Select Gender</option>
      <option>Male</option>
      <option>Female</option>
      <option>Other</option>
    </select>

    <p>Select Role *</p>
    <select name="role" required>
      <option value="">Select Role</option>
      <option>Admin</option>
      <option>Co-Admin</option>
      <option>Teacher</option>
      <option>User</option>
    </select>

    <button type="submit">Register</button>
  </form>
</div>

<!-- Firebase -->
<script type="module">

// 🔥 Your Firebase Config
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCVVqQnmO1Q83AucOqA5b5qUC4eo49sq6E",
  authDomain: "chat-box-e01e5.firebaseapp.com",
  databaseURL: "https://chat-box-e01e5-default-rtdb.firebaseio.com",
  projectId: "chat-box-e01e5",
  storageBucket: "chat-box-e01e5.appspot.com",
  messagingSenderId: "597491149800",
  appId: "1:597491149800:web:7bd908925f70b62018125d",
  measurementId: "G-FJ6PKK2FNQ"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const form = document.getElementById("registerForm");
const loader = document.getElementById("loaderOverlay");
const box = document.getElementById("mainBox");

form.addEventListener("submit", function(e){
  e.preventDefault();

  let data = new FormData(form);
  let pass = data.get("password");
  let confirm = data.get("confirmPassword");

  if(pass !== confirm){
    alert("❌ Passwords do not match!");
    return;
  }

  loader.style.display = "flex";

  const userRef = ref(db, "Admins");
  const newUser = push(userRef);

  set(newUser, {
    fullName : data.get("fullName"),
    username : data.get("username"),
    email : data.get("email"),
    password : pass,
    class : data.get("class"),
    phone : data.get("phone"),
    gender : data.get("gender"),
    role : data.get("role"),
    createdOn : new Date().toLocaleString()
  })
  .then(()=>{
    loader.style.display = "none";
    box.innerHTML = `
      <h2>🎉 Registration Successful!</h2>
      <p>Your account has been created.</p>
      <br>
      <a href="admin-login.html" style="color:#203a43;font-weight:700;">Login Now</a>
    `;
  })
  .catch(err=>{
    loader.style.display = "none";
    alert("Server Error: " + err);
  });

});
</script>

</body>
</html>
