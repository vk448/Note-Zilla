<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Unban Request</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0a0f24;
      color: white;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .box {
      background: #11182f;
      padding: 25px;
      border-radius: 15px;
      width: 350px;
      box-shadow: 0 0 20px #0008;
    }

    .box h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #4da6ff;
    }

    .input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: none;
      outline: none;
      background: #1c2541;
      color: white;
      font-size: 15px;
    }

    .btn {
      width: 100%;
      background: #4da6ff;
      color: black;
      padding: 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
      font-weight: bold;
      font-size: 16px;
    }

    .btn:hover {
      background: #6bb8ff;
    }

    .msg {
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div class="box">
  <h2>Unban Request</h2>

  <input type="text" id="ipBox" class="input" placeholder="Your IP" readonly>

  <input type="text" id="nameBox" class="input" placeholder="Your Name">

  <textarea id="reasonBox" class="input" rows="4" placeholder="Reason for unban"></textarea>

  <button class="btn" id="submitBtn">Submit Request</button>

  <div id="msg" class="msg"></div>
</div>


<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
// ---------------- Firebase Config ----------------
const firebaseConfig = { 
  apiKey: "AIzaSyCVVqQnmO1Q83AucOqA5b5qUC4eo49sq6E", 
  authDomain: "chat-box-e01e5.firebaseapp.com", 
  databaseURL: "https://chat-box-e01e5-default-rtdb.firebaseio.com", 
  projectId: "chat-box-e01e5"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ---------------- Fetch User IP ----------------
let userIP = "";
fetch("https://api64.ipify.org?format=json")
  .then(r => r.json())
  .then(d => {
    userIP = d.ip;
    document.getElementById("ipBox").value = userIP;
  });

// ---------------- Submit Unban Request ----------------
document.getElementById("submitBtn").addEventListener("click", () => {
  const name = document.getElementById("nameBox").value.trim();
  const reason = document.getElementById("reasonBox").value.trim();
  const msg = document.getElementById("msg");

  if (!name || !reason) {
    msg.innerHTML = "Please fill name & reason.";
    msg.style.color = "red";
    return;
  }

  const reqData = {
    ip: userIP,
    name: name,
    reason: reason,
    timestamp: Date.now(),
    status: "pending"
  };

  // Save request
  db.ref("unbanRequests/" + userIP).set(reqData)
    .then(() => {

      // ---------------- AUTO UNBAN ----------------
      db.ref("bannedUsers/" + userIP).remove();   // remove ban immediately
      // -------------------------------------------

      msg.innerHTML = "Request submitted! You are now unbanned.";
      msg.style.color = "#4da6ff";
    });
});
</script>

</body>
</html>
