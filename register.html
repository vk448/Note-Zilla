<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration</title>
<style>
  * { box-sizing: border-box; font-family: "Poppins", sans-serif;  }

   body {
    font-family: 'Segoe UI', 'Poppins', sans-serif;
    background: #f6f6f6;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }

  form {
    background: #ffffff;
    padding: 40px 35px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    width: 100%;
    max-width: 420px;
    transition: 0.3s ease;
    animation: fadeIn 0.8s ease forwards;
    position: relative;
    z-index: 1;
  }

  form:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
  }

  h2 {
    text-align: center;
    color: #222;
    font-size: 26px;
    margin-bottom: 25px;
    letter-spacing: 1px;
  }

  input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border: 2px solid #e0e0e0;
    border-radius: 12px;
    font-size: 14px;
    transition: all 0.3s ease;
  }

  input:focus {
    border-color: #4facfe;
    outline: none;
    box-shadow: 0 0 6px rgba(79, 172, 254, 0.6);
  }

  button {
    width: 100%;
    padding: 12px;
    margin-top: 15px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    color: white;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
    font-size: 15px;
    transition: all 0.3s ease;
  }

  button:hover {
    transform: scale(1.03);
    background: linear-gradient(135deg, #00f2fe, #4facfe);
  }

  /* Loader overlay */
   #loaderOverlay {
    display: none; /* Hidden by default */
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(55, 88, 150, 0.1);
    z-index: 9999;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    color: #4f6074;
    font-size: 1.4rem;
    font-weight: 600;
    text-align: center;
    backdrop-filter: blur(3px);
  }

  .spinner {
    border: 8px solid rgba(255,255,255,0.3);
    border-top: 8px solid #fff;
    border-radius: 50%;
    width: 70px; height: 70px;
    animation: spin 1s linear infinite;
    margin-bottom: 15px;
  }

  @keyframes spin {
    0% { transform: rotate(0deg);}
    100% { transform: rotate(360deg);}
  }

  @keyframes fadeIn { from {opacity:0; transform:translateY(20px);} to {opacity:1; transform:translateY(0);} }
 .notice {
    margin-top: 1rem;
    font-size: 1rem;
    font-weight: 400;
    color: #666;
    letter-spacing: 0.02em;
  }
   .notice a {
    color: #3469a9;
    text-decoration: none;
    font-weight: 600;
  }
  /* Popup Success Modal */
  #successModal {
    display: none;
    position: fixed;
    top:0; left:0;
    width:100%; height:100%;
    background: rgba(0,0,0,0.5);
    z-index: 10000;
    justify-content: center;
    align-items: center;
  }

  #successModalContent {
    background: #2ecc71;
    color: white;
    padding: 30px 40px;
    border-radius: 20px;
    text-align: center;
    max-width: 350px;
    width: 90%;
    animation: popupFade 0.5s ease forwards;
  }

  #successModalContent h3 {
    margin-bottom: 20px;
  }

  #successModalContent a {
    display: inline-block;
    padding: 12px 25px;
    background: linear-gradient(135deg,#4facfe,#00f2fe);
    color: white;
    border-radius: 12px;
    text-decoration: none;
    font-weight: 600;
    transition: 0.3s;
  }

  #successModalContent a:hover {
    transform: scale(1.05);
  }

  @keyframes popupFade {
    0% {opacity:0; transform: scale(0.7);}
    100% {opacity:1; transform: scale(1);}
  }
    .notice a:hover {
    text-decoration: underline;
    color: #244474;
  }
</style>
</head>
<body>

<!-- Loader -->
<div id="loaderOverlay">
  <div class="spinner"></div>
  <div>Submitting your registration, please wait...</div>
</div>

<form id="myForm">
  <h2>Student Registration</h2>
  <input type="text" name="Full Name" placeholder="Full Name" required>
  <input type="text" name="Phone Number" placeholder="Phone Number" required>
  <input type="email" name="Email" placeholder="Email" required>
  <input type="text" name="School Name" placeholder="School Name" required>
  <input type="text" name="School Area" placeholder="School Area" required>
  <input type="text" name="Class" placeholder="Class" required>
  <input type="text" name="City" placeholder="City" required>
  <button type="submit">Register</button>
  <br>
  <div class="notice">
      If you already registered, please <a href="Login1.HTML">login</a> 
    </div>
</form>
 
<!-- Success Modal Popup -->
<div id="successModal">
  <div id="successModalContent">
    <h3>✅ Registration Successful!</h3>
    <a href="Login1.HTML">➡️ Go to Login</a>
  </div>
</div>

<script>
const scriptUrl='https://script.google.com/macros/s/AKfycbzMbKM1AZ9Sdm2_0c8qCX9b5SADmHSJwvIlFuAyzTLjK5D_U1CCA6qyoUAIjwUKnc4W/exec';

document.getElementById("myForm").addEventListener("submit", function(e){
  e.preventDefault();
  document.getElementById("loaderOverlay").style.display = "flex"; // show loader
  const form = new FormData(e.target);

  fetch(scriptUrl, { method: "POST", body: form })
    .then(res => res.text())
    .then(txt => {
      document.getElementById("loaderOverlay").style.display = "none"; // hide loader
      if(txt.includes("Success")){
        document.getElementById("successModal").style.display = "flex"; // show popup
        e.target.reset();
      } else {
        alert("Error: "+txt);
      }
    })
    .catch(err => {
      document.getElementById("loaderOverlay").style.display = "none";
      alert("Something went wrong: "+err.message);
    });
});
</script>

</body>
</html>
