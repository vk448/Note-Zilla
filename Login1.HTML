<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Student Login</title>
<link rel="icon" href="download.png" />
<style>
  body {
    font-family: 'Segoe UI', 'Poppins', sans-serif;
    background: #f6f6f6;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }
  form {
    background: #fff;
    padding: 2.5rem 2rem;
    border-radius: 14px;
    box-shadow: 0 4px 24px rgba(44, 62, 80, 0.09);
    width: 100%;
    max-width: 340px;
    text-align: center;
    border: 1px solid #e3e5e8;
  }
  h2 {
    font-size: 2rem;
    letter-spacing: 0.02rem;
    color: #2c3e50;
    margin-bottom: 18px;
    font-weight: 500;
  }
  input {
    width: 90%;
    padding: 0.85rem 1rem;
    margin-bottom: 1rem;
    border: 1px solid #dde1e7;
    border-radius: 8px;
    font-size: 1.08rem;
    background: #f6f9fb;
    transition: border-color 0.2s;
  }
  input:focus {
    border-color: #b1adec;
    outline: none;
    box-shadow: 0 0 4px #b1adec50;
  }
  button {
    width: 100%;
    padding: 0.9rem 0;
    border: none;
    border-radius: 8px;
    background: linear-gradient(90deg, #8bd0ee 0%, #c0b5f7 100%);
    color: #fff;
    font-size: 1.05rem;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s, transform 0.2s;
  }
  button:hover {
    background: linear-gradient(90deg, #b1e7ec 0%, #b1adec 80%);
    transform: scale(1.04);
  }
  #message {
    margin-top: 1.1rem;
    font-weight: 500;
    font-size: 1rem;
  }
  #downloadContainer {
    margin-top: 1.4rem;
  }
  .notice {
    margin-top: 1rem;
    font-size: 1rem;
    font-weight: 400;
    color: #666;
    letter-spacing: 0.02em;
  }
  .notice a {
    color: #3469a9;
    text-decoration: none;
    font-weight: 600;
  }
  .notice a:hover {
    text-decoration: underline;
    color: #244474;
  }
  /* Loader Screen */
  #loaderScreen {
    display: none; /* Hidden by default */
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(55, 88, 150, 0.1);
    z-index: 9999;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    color: #4f6074;
    font-size: 1.4rem;
    font-weight: 600;
    text-align: center;
    backdrop-filter: blur(3px);
  }
  .spinner {
    width: 56px;
    height: 56px;
    border: 7px solid #e9ecef;
    border-top: 7px solid #3e80e0;
    border-radius: 50%;
    margin-bottom: 18px;
    animation: spin 1.1s linear infinite;
  }
  @keyframes spin {
    0% {
      transform: rotate(0deg);
    }
    100% {
      transform: rotate(360deg);
    }
  }
</style>
</head>
<body>
  <form id="loginForm">
    <h2>Student Login</h2>
    <input type="text" name="Full Name" placeholder="Full Name" required />
    <input type="email" name="Email" placeholder="Email" required />
    <button type="submit">Login</button>
    <div id="message"></div>
    <div id="downloadContainer"></div>
    <div class="notice">
      If not registered, please <a href="register.html">Register</a> first
    </div>
  </form>

  <div id="loaderScreen">
    <div class="spinner"></div>
    Logging in...
  </div>

  <script>
    const scriptUrl =
      'https://script.google.com/macros/s/AKfycbzPza1JUVG98-65Rgx9MB-uIkau1rieVbiNNuJ7iVCqV1q3OXheXjRFzJBTPtx9I30/exec';
    const loaderScreen = document.getElementById('loaderScreen');

    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const formData = new FormData(e.target);
      const name = formData.get('Full Name');
      const email = formData.get('Email');

      const messageEl = document.getElementById('message');
      const downloadEl = document.getElementById('downloadContainer');

      messageEl.textContent = '';
      downloadEl.innerHTML = '';

      // Show loader screen only after clicking login
      loaderScreen.style.display = 'flex';

      fetch(
        `${scriptUrl}?action=login&name=${encodeURIComponent(
          name
        )}&email=${encodeURIComponent(email)}`
      )
        .then((res) => res.json())
        .then((data) => {
          setTimeout(() => {
            loaderScreen.style.display = 'none';
            if (data.status === 'success') {
              messageEl.style.color = 'green';
              messageEl.textContent = `✅ Welcome, ${data.name}! Login Successful!`;

              const link = data.link;
              const a = document.createElement('a');
              a.href = link;
              a.setAttribute('download', ''); // force download
              document.body.appendChild(a);

              const btn = document.createElement('button');
              btn.type = 'button';
              btn.textContent = '⬇️ Download Your File';
              btn.onclick = () => {
                a.click();
                document.body.removeChild(a);
              };
              downloadEl.appendChild(btn);
            } else if (data.status === 'fail') {
              messageEl.style.color = 'red';
              messageEl.textContent =
                '❌ Email or Username Not Found. Please Register First';
            } else {
              messageEl.style.color = 'red';
              messageEl.textContent = '❌ ' + (data.message || 'Unknown error');
            }
          }, 1000);
        })
        .catch((err) => {
          loaderScreen.style.display = 'none';
          messageEl.style.color = 'red';
          messageEl.textContent = '❌ Error: ' + err.message;
        });
    });
  </script>
</body>
</html>
