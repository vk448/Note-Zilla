<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MVPP - NoteZilla</title>
  <link rel="icon" href="../Images/Favicon.png">
  <meta name="google-site-verification" content="C2-yDbzzyS4qMdBWgM3WARN6saZ1KX7ndHrd_Uc38mg" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Same premium cosmic design as all other subject pages -->
  <link rel="stylesheet" href="subject.css">
</head>
<body>

  <header>
    <div class="logo" onclick="window.location.href='../'">NoteZilla</div>
    <div class="hamburger" onclick="toggleMenu(this)">
      <div></div><div></div><div></div>
    </div>
    <nav>
      <a href="../index.html">Home</a>
      <a href="#notes" class="active">MVPP Notes</a>
      <a href="../credit.html">About</a>
      <a href="../contact.html">Contact</a>
      <a href="../login.html"><button class="login-btn">Login</button></a>
      <button class="toggle-dark" id="darkToggle">☾</button>
    </nav>
  </header>

  <section class="page-hero">
    <h1>MVPP Notes</h1>
    <p>All chapters and study materials for Class 9 MVPP – comprehensive, clear, and exam-ready.</p>
  </section>

  <!-- Fixed Search Bar -->
  <div class="search-container">
    <input type="text" id="searchBar" placeholder="🔍 Search chapters, topics...">
  </div>

  <section class="subject-grid" id="subjectGrid">
    <div style="grid-column: 1 / -1; text-align:center; padding:60px 20px;">
      <div class="loader"></div>
      <p class="loading-text">Loading MVPP chapters...</p>
    </div>
  </section>

  <footer>
    <p>© 2025 <span>NoteZilla</span> · All Rights Reserved</p>
  </footer>

  <script>
    // Hamburger Menu
    function toggleMenu(el) {
      document.querySelector('nav').classList.toggle('active');
      el.classList.toggle('open');
    }

    // Dark Mode
    document.getElementById('darkToggle')?.addEventListener('click', () => {
      document.body.classList.toggle('dark');
    });

    // Header scroll effect
    window.addEventListener('scroll', () => {
      const header = document.querySelector('header');
      if (window.scrollY > 50) {
        header.style.background = 'rgba(15, 12, 41, 0.8)';
        header.style.backdropFilter = 'blur(40px)';
      } else {
        header.style.background = 'rgba(15, 12, 41, 0.4)';
        header.style.backdropFilter = 'blur(30px)';
      }
    });

    // --- MVPP Notes Loading & Search Logic ---
    const sheetURL = "https://script.google.com/macros/s/AKfycbx6Yi6nb-biO1Qw9pz3_1FvCwOQNLEQvi-TUIjdgsF7b9kf8FPgqsH9fIZ4n-neAVhn/exec";
    const subjectName = "Mvpp";
    const subjectGrid = document.getElementById("subjectGrid");

    // Show cached data instantly if available
    const cached = localStorage.getItem(`notes_${subjectName}`);
    if (cached) renderNotes(JSON.parse(cached));
    fetchData(); // Then fetch fresh data

    async function fetchData() {
      try {
        const res = await fetch(sheetURL);
        const data = await res.json();
        const filtered = data.filter(d => d.Subject === subjectName);
        localStorage.setItem(`notes_${subjectName}`, JSON.stringify(filtered));
        renderNotes(filtered);
      } catch (err) {
        console.error("Failed to load:", err);
        subjectGrid.innerHTML = `<p style="text-align:center;color:#ff6b6b;grid-column:1/-1;">⚠️ Failed to load notes. Try again later.</p>`;
      }
    }

    function renderNotes(notes) {
      subjectGrid.innerHTML = "";
      if (!notes.length) {
        subjectGrid.innerHTML = `<p style="text-align:center;color:#aaa;grid-column:1/-1;">No chapters available yet.</p>`;
        return;
      }

      notes.forEach(chap => {
        let formattedDate = "—";

        if (chap.Date && chap.Date.trim() !== "") {
          let date;
          if (!isNaN(Date.parse(chap.Date))) {
            date = new Date(chap.Date);
          } else {
            const parts = chap.Date.split(/[-/]/);
            if (parts.length === 3) {
              const [d, m, y] = parts;
              date = new Date(`${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`);
            }
          }

          if (date && !isNaN(date.getTime())) {
            const day = String(date.getDate()).padStart(2, "0");
            const month = String(date.getMonth() + 1).padStart(2, "0");
            const year = date.getFullYear();
            formattedDate = `${day}/${month}/${year}`;
          }
        }

        const card = document.createElement("div");
        card.className = "subject-card";
        card.innerHTML = `
          <h2>${chap["Chapter Name"] || "Untitled Chapter"}</h2>
          <p>${formattedDate}</p>
        `;
        card.addEventListener("click", () => {
          if (chap.Link?.trim()) {
            window.open(chap.Link, "_blank");
          } else {
            alert("Link not available for this chapter yet.");
          }
        });
        subjectGrid.appendChild(card);
      });
    }

    // Search Functionality
    const searchBar = document.getElementById("searchBar");
    searchBar.addEventListener("keyup", () => {
      const value = searchBar.value.toLowerCase();
      document.querySelectorAll(".subject-card").forEach(card => {
        const chapterName = card.querySelector("h2")?.innerText.toLowerCase() || "";
        card.style.display = chapterName.includes(value) ? "flex" : "none";
      });
    });

    // --- Universal Login Display System ---
    (function() {
      const fullName = localStorage.getItem("fullName");
      const loginBtn = document.querySelector(".login-btn");

      if (loginBtn && fullName) {
        loginBtn.textContent = fullName;
        loginBtn.style.background = "linear-gradient(135deg,#203a43,#2c5364)";
        loginBtn.style.fontWeight = "600";

        loginBtn.onclick = (e) => {
          e.preventDefault();
          const confirmLogout = confirm(`Logout from ${fullName}?`);
          if (confirmLogout) {
            localStorage.removeItem("fullName");
            localStorage.removeItem("username");
            localStorage.removeItem("userRole");
            window.location.reload();
          }
        };
      } else if (loginBtn) {
        loginBtn.onclick = () => window.location.href = "../login.html";
      }
    })();
  </script>

  <script src="../Record.js"></script>
</body>
</html>
