<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - NoteZilla</title>
  <link rel="icon" href="Images/Favicon.png">
  <meta name="google-site-verification" content="C2-yDbzzyS4qMdBWgM3WARN6saZ1KX7ndHrd_Uc38mg" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* ===================================
       FULL STANDALONE CSS - EXACTLY LIKE HOME PAGE (COSMIC PREMIUM DESIGN)
       =================================== */

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: #0f0c29;
      color: #e0e7ff;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background 0.8s ease;
    }

    body.dark {
      background: #0a0719;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      outline: none;
      font-family: inherit;
    }

    /* Header */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      padding: clamp(1.2rem, 3vw, 2rem) 5% clamp(1.5rem, 4vw, 2.5rem);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 12, 41, 0.4);
      backdrop-filter: blur(30px);
      border-bottom: 1px solid rgba(124, 58, 237, 0.2);
      z-index: 1000;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    }

    .logo {
      font-size: clamp(2.2rem, 6vw, 3rem);
      font-weight: 900;
      background: linear-gradient(135deg, #a78bfa, #ec4899, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      cursor: pointer;
      transition: transform 0.4s ease;
    }

    .logo:hover {
      transform: scale(1.05) rotate(2deg);
    }

    nav {
      display: flex;
      align-items: center;
      gap: clamp(2rem, 5vw, 4rem);
    }

    nav a {
      font-weight: 600;
      font-size: clamp(1.1rem, 2.5vw, 1.3rem);
      position: relative;
      transition: all 0.4s ease;
    }

    nav a::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 0;
      height: 3px;
      background: linear-gradient(135deg, #7c3aed, #ec4899);
      border-radius: 4px;
      transition: all 0.5s ease;
      transform: translateX(-50%);
    }

    nav a:hover::after, nav a.active::after { width: 100%; }
    nav a:hover, nav a.active { color: #fbbf24; transform: translateY(-4px); }

    .login-btn {
      background: linear-gradient(135deg, #7c3aed, #ec4899);
      color: white;
      padding: 0.9rem 2.2rem;
      border-radius: 60px;
      font-weight: 700;
      box-shadow: 0 10px 30px rgba(124,58,237,0.5);
      transition: all 0.5s ease;
    }

    .login-btn:hover {
      transform: translateY(-8px) scale(1.1);
      box-shadow: 0 25px 50px rgba(124,58,237,0.7);
    }

    .hamburger {
      display: none;
      flex-direction: column;
      gap: 8px;
      cursor: pointer;
      z-index: 1001;
    }

    .hamburger div {
      width: 40px;
      height: 5px;
      background: #c4b5fd;
      border-radius: 3px;
      transition: all 0.4s ease;
    }

    /* Page Hero */
    .page-hero {
      position: relative;
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: clamp(100px, 15vw, 180px) 5% 80px;
      margin-top: 80px;
      overflow: hidden;
    }

    .page-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -2;
      background: radial-gradient(circle at 20% 80%, #7c3aed 0%, transparent 50%),
                  radial-gradient(circle at 80% 20%, #ec4899 0%, transparent 50%),
                  radial-gradient(circle at 50% 50%, #3b82f6 0%, transparent 40%);
      opacity: 0.6;
      animation: smoothFloat 28s ease-in-out infinite;
    }

    .page-hero::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(135deg, #1e1b4b 0%, #2d1b69 60%, #4c1d95 100%);
      opacity: 0.95;
    }

    @keyframes smoothFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(4%, -4%) scale(1.03); }
      66% { transform: translate(-3%, 3%) scale(1.02); }
    }

    .page-hero h1 {
      font-size: clamp(3.5rem, 9vw, 6rem);
      font-weight: 900;
      margin-bottom: 1.5rem;
      background: linear-gradient(135deg, #c4b5fd, #fbbf24, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .page-hero p {
      font-size: clamp(1.4rem, 4vw, 2rem);
      max-width: 800px;
      opacity: 0.9;
    }

    /* Contact Form */
    .contact-container {
      max-width: 700px;
      margin: 100px auto 150px;
      background: rgba(30, 27, 75, 0.4);
      backdrop-filter: blur(30px);
      padding: clamp(2.5rem, 6vw, 4rem);
      border-radius: 40px;
      box-shadow: 0 30px 80px rgba(124, 58, 237, 0.3);
      border: 1px solid rgba(167, 139, 250, 0.2);
    }

    .contact-container h1 {
      text-align: center;
      margin-bottom: 2rem;
      font-size: clamp(2.5rem, 7vw, 4rem);
      background: linear-gradient(135deg, #c4b5fd, #fbbf24);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 900;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1.8rem;
    }

    label {
      font-weight: 600;
      font-size: clamp(1.1rem, 2.5vw, 1.4rem);
      opacity: 0.9;
    }

    input, textarea {
      padding: clamp(1rem, 3vw, 1.4rem);
      border: none;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      color: white;
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      outline: none;
      transition: all 0.4s ease;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    input::placeholder, textarea::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    input:focus, textarea:focus {
      transform: scale(1.03);
      box-shadow: 0 20px 50px rgba(124, 58, 237, 0.4);
      background: rgba(255, 255, 255, 0.15);
    }

    textarea {
      resize: vertical;
      min-height: 150px;
    }

    input[type="submit"] {
      background: linear-gradient(135deg, #7c3aed, #ec4899);
      color: white;
      font-weight: 800;
      font-size: clamp(1.2rem, 3vw, 1.6rem);
      padding: clamp(1rem, 3vw, 1.5rem);
      border-radius: 60px;
      cursor: pointer;
      box-shadow: 0 15px 40px rgba(124, 58, 237, 0.4);
      transition: all 0.6s ease;
    }

    input[type="submit"]:hover {
      transform: translateY(-10px) scale(1.08);
      box-shadow: 0 30px 70px rgba(124, 58, 237, 0.6);
    }

    .success-message {
      display: none;
      text-align: center;
      font-size: clamp(1.2rem, 3vw, 1.6rem);
      font-weight: 700;
      color: #1cc88a;
      margin-top: 1.5rem;
      opacity: 0.9;
    }

    /* Footer */
    footer {
      background: linear-gradient(135deg, #1e1b4b, #0f0c29);
      padding: clamp(4rem, 8vw, 6rem) 5%;
      text-align: center;
      border-top: 1px solid rgba(124, 58, 237, 0.3);
    }

    footer p {
      font-size: clamp(1rem, 2vw, 1.3rem);
      opacity: 0.9;
      margin-bottom: 1.5rem;
    }

    footer span {
      background: linear-gradient(135deg, #a78bfa, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
    }

    footer img {
      height: 50px;
      width: 50px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 15px;
      transition: transform 0.4s ease;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    footer img:hover {
      transform: scale(1.2) rotate(10deg);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .hamburger { display: flex; }
      nav {
        position: fixed;
        top: 100%;
        left: -100%;
        width: 100%;
        background: rgba(15, 12, 41, 0.95);
        flex-direction: column;
        padding: 4rem 0;
        transition: left 0.6s ease;
        gap: 2.5rem;
        align-items: center;
        backdrop-filter: blur(30px);
      }
      nav.active { left: 0; }
      .contact-container { margin: 80px auto 120px; padding: 2rem; }
    }

    @media (max-width: 480px) {
      .contact-container { margin: 60px auto 100px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo" onclick="window.location.href='index.html'">NoteZilla</div>
    <div class="hamburger" onclick="toggleMenu(this)">
      <div></div><div></div><div></div>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="notes.html">Notes</a>
      <a href="credit.html">About</a>
      <a href="support-material.html">Support</a>
      <a href="Time-table.html">Time Table</a>
      <a href="#contact" class="active">Contact</a>
      <a href="login.html"><button class="login-btn">Login</button></a>
      <button class="toggle-dark" id="darkToggle">☾</button>
    </nav>
  </header>

  <section class="page-hero">
    <h1>Contact Us</h1>
    <p>We'd love to hear from you! Drop a message and we'll get back to you soon.</p>
  </section>

  <div class="contact-container">
    <form id="contactForm" action="https://formspree.io/f/xeokweek" method="POST">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="Your full name" required>

      <label for="email">Email Address</label>
      <input type="email" id="email" name="_replyto" placeholder="you@example.com" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="6" placeholder="Your message here..." required></textarea>

      <input type="hidden" name="_subject" value="New Contact Form Submission">
      <input type="submit" value="Send Message">
    </form>
    <div class="success-message" id="successMessage">✅ Message sent successfully!</div>
  </div>

  <footer>
    <p>© 2025 <span>NoteZilla</span> · All Rights Reserved</p>
    <div>
      <a href="https://whatsapp.com/channel/0029Vb7CpvgAzNbwokB7KV0y"><img src="Images/Whatsapp.png" alt="WhatsApp"></a>
      <a href="#"><img src="Images/instagram.jpeg" alt="Instagram"></a>
      <a href="https://t.me/+gxvgPedurnMyNTA1"><img src="Images/telegram.png" alt="Telegram"></a>
    </div>
  </footer>

  <script>
    // Hamburger Menu
    function toggleMenu(el) {
      document.querySelector('nav').classList.toggle('active');
      el.classList.toggle('open');
    }

    // Dark Mode
    document.getElementById('darkToggle')?.addEventListener('click', () => {
      document.body.classList.toggle('dark');
    });

    // Header Scroll Effect
    window.addEventListener('scroll', () => {
      const header = document.querySelector('header');
      if (window.scrollY > 50) {
        header.style.background = 'rgba(15, 12, 41, 0.8)';
        header.style.backdropFilter = 'blur(40px)';
      } else {
        header.style.background = 'rgba(15, 12, 41, 0.4)';
        header.style.backdropFilter = 'blur(30px)';
      }
    });

    // Form Submission with Success Message
    const form = document.getElementById('contactForm');
    const successMsg = document.getElementById('successMessage');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const data = new FormData(form);

      fetch(form.action, {
        method: "POST",
        body: data,
        headers: { 'Accept': 'application/json' }
      }).then(response => {
        if (response.ok) {
          successMsg.style.display = 'block';
          form.reset();
          setTimeout(() => {
            successMsg.style.display = 'none';
          }, 5000);
        } else {
          alert("Oops! There was a problem submitting your form.");
        }
      }).catch(error => {
        alert("Oops! There was a problem submitting your form.");
      });
    });
  </script>

  <script src="Record.js"></script>
</body>
</html>
