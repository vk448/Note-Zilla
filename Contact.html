<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us - Note Zilla</title>
<style>
  footer img{
  height: 30px;
  width: 30px;
  border-radius: 50px;
  margin: 10px 5px;
}
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap');

/* General Reset */
* { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
body { background:#ffffff; color:#333; line-height:1.6; }

/* Header */
header { display:flex; justify-content:space-between; align-items:center; padding:15px 50px; background:#fff; box-shadow:0 4px 6px rgba(0,0,0,0.1); position:sticky; top:0; z-index:100; }
.logo { font-weight:900; font-size:1.8rem; background:linear-gradient(90deg,#4e73df,#1cc88a); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
nav { display:flex; align-items:center; gap:15px; }
nav a { text-decoration:none; color:#333; font-weight:500; transition:color 0.2s; }
nav a:hover { color:#4e73df; }
.login-btn { background:#1cc88a; color:white; border:none; padding:8px 16px; border-radius:6px; cursor:pointer; font-weight:bold; transition:background 0.2s; }
.login-btn:hover { background:#17a673; }
.hamburger { display:none; flex-direction:column; cursor:pointer; gap:5px; }
.hamburger div { width:25px; height:3px; background-color:#333; transition:all 0.3s; }

/* Contact Form */
.contact-container { max-width:600px; margin:100px auto; background:#f9fafb; padding:30px; border-radius:12px; box-shadow:0 6px 15px rgba(0,0,0,0.1); }
.contact-container h1 { text-align:center; margin-bottom:20px; color:#4e73df; }
form { display:flex; flex-direction:column; gap:15px; }
label { font-weight:600; color:#555; }
input, textarea { padding:10px; border:1px solid #ccc; border-radius:6px; font-size:16px; }
input[type="submit"] { background:#4e73df; color:white; border:none; cursor:pointer; font-weight:bold; transition:background 0.2s; }
input[type="submit"]:hover { background:#1cc88a; }

/* Success message */
.success-message { display:none; color: green; font-weight: bold; text-align: center; margin-top: 10px; }

/* Footer */
footer { text-align:center; padding:20px; background:#fff; box-shadow:0 -4px 6px rgba(0,0,0,0.05); margin-top:50px; color:#555; }

/* Responsive */
@media (max-width:768px) {
  nav { display:none; flex-direction:column; width:100%; gap:10px; margin-top:10px; }
  nav.active { display:flex; }
  .hamburger { display:flex; }
}
</style>
</head>
<body>

<!-- Header -->
<header>
  <div class="logo">Note Zilla</div>
  <div class="hamburger" onclick="toggleMenu(this)">
    <div></div><div></div><div></div>
  </div>
  <nav>
    <a href="index.html">Home</a>
    <a href="notes.html">Notes</a>
    <a href="credit.html">About</a>
    <a href="support-material.html">Support</a>
    <a href="Time-table.html">Time Table</a>
    <a href="contact.html">Contact</a>
    <button class="login-btn"><a href="login.html" style="color:white; text-decoration:none;">Login</a></button>
  </nav>
</header>

<!-- Contact Form Section -->
<div class="contact-container">
  <h1>Contact Us</h1>
  <form id="contactForm" action="https://formspree.io/f/xeokweek" method="POST">
    <label for="name">Full Name</label>
    <input type="text" id="name" name="name" placeholder="Your full name" required>

    <label for="email">Email Address</label>
    <input type="email" id="email" name="_replyto" placeholder="you@example.com" required>

    <label for="message">Message</label>
    <textarea id="message" name="message" rows="5" placeholder="Your message here..." required></textarea>

    <input type="hidden" name="_subject" value="New Contact Form Submission">
    <input type="submit" value="Send Message">
  </form>
  <div class="success-message" id="successMessage">✅ Message sent successfully!</div>
</div>
<script>
    // favicon.js
const link = document.createElement('link');
link.rel = 'icon';
link.type = 'image/png';
link.href = 'images/favicon.png'; // yahan apne icon ka naam likho
document.head.appendChild(link);

  </script>
</body>
<!-- Footer -->
<footer>
  <p>
  &copy; 2025 Note Zilla. All rights reserved.
  </p>
  <a href="https://whatsapp.com/channel/0029Vb7CpvgAzNbwokB7KV0y"><img src="Images/Whatsapp.png"></a>
  <a href=""><img src="Images/instagram.jpeg"></a>
  <a href="https://t.me/+gxvgPedurnMyNTA1"><img src="Images/telegram.png"></a>
</footer>

<script>
// Toggle mobile menu
function toggleMenu(element){
  const nav=document.querySelector('header nav');
  nav.classList.toggle('active');
  element.classList.toggle('open');
}

// Handle form submission
const form = document.getElementById('contactForm');
form.addEventListener('submit', function(e){
  e.preventDefault();
  const data = new FormData(form);
  
  fetch(form.action, {
    method: "POST",
    body: data,
    headers: { 'Accept': 'application/json' }
  }).then(response => {
    if (response.ok) {
      document.getElementById('successMessage').style.display = 'block';
      form.reset();
    } else {
      alert("Oops! There was a problem submitting your form.");
    }
  }).catch(error => {
    alert("Oops! There was a problem submitting your form.");
  });
});
</script>
    <script src="Record.js"></script>
</body>
</html>
