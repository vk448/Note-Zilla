<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Match | Brain Game</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;800&display=swap');
        
        :root {
            --primary: #f59e0b;
            --secondary: #d97706;
            --bg: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            margin: 0; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 20px; color: #1e293b;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            padding: 25px; border-radius: 30px;
            width: 100%; max-width: 400px;
            text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .stats { display: flex; justify-content: space-around; margin-bottom: 20px; font-weight: 800; color: #64748b; }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            perspective: 1000px;
        }

        .card {
            aspect-ratio: 1;
            background: var(--primary);
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: transparent;
            transition: transform 0.4s, background 0.3s;
            transform-style: preserve-3d;
        }

        .card.flipped {
            background: white;
            color: #1e293b;
            transform: rotateY(180deg);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .card.matched {
            background: #10b981;
            color: white;
            cursor: default;
        }

        .btn {
            width: 100%; padding: 14px; margin-top: 20px;
            border: none; border-radius: 15px;
            background: #1e293b; color: white;
            font-weight: 700; cursor: pointer; transition: 0.3s;
        }

        .btn:hover { background: #334155; }
    </style>
</head>
<body>

    <div class="container">
        <h2 style="margin-top:0">Memory Match</h2>
        
        <div class="stats">
            <div>Moves: <span id="moves">0</span></div>
            <div>Time: <span id="timer">0</span>s</div>
        </div>

        <div class="grid" id="grid"></div>

        <button class="btn" onclick="resetGame()">Restart Game</button>
        <button class="btn" style="background:#e2e8f0; color:#475569" onclick="location.href='index.html'">Back Home</button>
    </div>

    <script>
        const emojis = ['🎮', '🎮', '🚀', '🚀', '💎', '💎', '🔥', '🔥', '👻', '👻', '🍕', '🍕', '🐱', '🐱', '🌈', '🌈'];
        let cards = [];
        let flippedCards = [];
        let moves = 0;
        let matchedPairs = 0;
        let seconds = 0;
        let timer;

        function initGame() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            moves = 0;
            matchedPairs = 0;
            seconds = 0;
            document.getElementById('moves').innerText = moves;
            document.getElementById('timer').innerText = seconds;
            
            // Shuffle
            const shuffled = emojis.sort(() => Math.random() - 0.5);
            
            shuffled.forEach((emoji, index) => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.value = emoji;
                card.dataset.index = index;
                card.innerText = emoji;
                card.onclick = () => flipCard(card);
                grid.appendChild(card);
            });

            startTimer();
        }

        function flipCard(card) {
            if (flippedCards.length < 2 && !card.classList.contains('flipped') && !card.classList.contains('matched')) {
                card.classList.add('flipped');
                flippedCards.push(card);

                if (flippedCards.length === 2) {
                    moves++;
                    document.getElementById('moves').innerText = moves;
                    checkMatch();
                }
            }
        }

        function checkMatch() {
            const [card1, card2] = flippedCards;
            if (card1.dataset.value === card2.dataset.value) {
                card1.classList.add('matched');
                card2.classList.add('matched');
                matchedPairs++;
                flippedCards = [];
                if (matchedPairs === emojis.length / 2) {
                    clearInterval(timer);
                    setTimeout(() => alert(`🏆 You Won in ${moves} moves and ${seconds} seconds!`), 500);
                }
            } else {
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                }, 1000);
            }
        }

        function startTimer() {
            clearInterval(timer);
            timer = setInterval(() => {
                seconds++;
                document.getElementById('timer').innerText = seconds;
            }, 1000);
        }

        function resetGame() {
            initGame();
        }

        initGame();
    </script>
</body>
</html>
