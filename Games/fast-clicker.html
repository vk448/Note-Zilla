<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Clicker | Dual Button</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;800&display=swap');
        
        :root {
            --primary: #6366f1;
            --secondary: #ec4899;
            --bg: #f8fafc;
        }

        body { 
            font-family: 'Outfit', sans-serif; 
            background: #0f172a; 
            margin: 0; min-height: 100vh; 
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }

        .container { 
            background: white; 
            padding: 20px; border-radius: 30px; 
            width: 90%; max-width: 400px; 
            text-align: center; position: relative;
        }

        /* Progress Bars */
        .progress-container { margin: 20px 0; }
        .progress-bar { height: 20px; background: #e2e8f0; border-radius: 50px; overflow: hidden; margin: 5px 0; }
        .fill { height: 100%; width: 0%; transition: width 0.1s; }
        #myFill { background: var(--primary); }
        #oppFill { background: var(--secondary); }

        /* Buttons */
        .tap-btn { 
            width: 120px; height: 120px; border-radius: 50%; 
            font-size: 1.2rem; font-weight: 800; cursor: pointer; 
            transition: 0.1s; border: none; color: white;
            box-shadow: 0 8px 0 rgba(0,0,0,0.2);
        }
        
        .btn-p1 { background: var(--primary); }
        .btn-p2 { background: var(--secondary); transform: rotate(180deg); } /* P2 side inverted for face-to-face */

        .tap-btn:active { transform: scale(0.95) translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.2); }

        .menu-btn { 
            padding: 15px; width: 100%; border-radius: 15px; border: none; 
            margin: 8px 0; font-weight: 700; cursor: pointer; background: #f1f5f9; 
        }

        .hidden { display: none !important; }
        .flex-center { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    </style>
</head>
<body>

    <div id="lobby" class="container">
        <h2>⚡ Speed Clicker</h2>
        <button class="menu-btn" style="background:var(--primary); color:white" onclick="startMode('bot')">🤖 VS Smart Bot</button>
        <button class="menu-btn" style="background:var(--secondary); color:white" onclick="startMode('pass')">👥 Pass & Play (2 Players)</button>
        <button class="menu-btn" onclick="startMode('online')">🌐 Random Match</button>
        <button class="menu-btn" onclick="location.reload()">Refresh</button>
    </div>

    <div id="game" class="container hidden">
        <div id="p2Area" class="flex-center">
            <button id="btnP2" class="tap-btn btn-p2 hidden" onclick="tap('p2')">TAP!</button>
            <div class="progress-bar" style="width:100%"><div id="oppFill" class="fill"></div></div>
        </div>

        <h3 id="status">Ready?</h3>

        <div id="p1Area" class="flex-center">
            <div class="progress-bar" style="width:100%"><div id="myFill" class="fill"></div></div>
            <button id="btnP1" class="tap-btn btn-p1" onclick="tap('p1')">TAP!</button>
        </div>

        <button class="menu-btn" onclick="location.reload()" style="font-size: 0.8rem; margin-top: 20px;">Quit Game</button>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCVVqQnmO1Q83AucOqA5b5qUC4eo49sq6E",
        authDomain: "chat-box-e01e5.firebaseapp.com",
        databaseURL: "https://chat-box-e01e5-default-rtdb.firebaseio.com",
        projectId: "chat-box-e01e5",
        storageBucket: "chat-box-e01e5.firebasestorage.app",
        messagingSenderId: "597491149800",
        appId: "1:597491149800:web:7bd908925f70b62018125d"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let gRef, playerRole, mode, gameOver = false;
    let scores = { p1: 0, p2: 0 };

    function startMode(m) {
        mode = m;
        document.getElementById('lobby').classList.add('hidden');
        document.getElementById('game').classList.remove('hidden');

        if(mode === 'pass') {
            document.getElementById('btnP2').classList.remove('hidden');
            document.getElementById('status').innerText = "2 PLAYER MODE";
        } else if(mode === 'bot') {
            document.getElementById('status').innerText = "VS BOT";
            startBot();
        } else {
            document.getElementById('status').innerText = "Finding Match...";
            findMatch();
        }
    }

    function tap(p) {
        if(gameOver) return;

        if(mode === 'online') {
            gRef.child(playerRole).set(firebase.database.ServerValue.increment(1));
        } else {
            scores[p]++;
            updateUI(scores.p1, scores.p2);
        }
    }

    function updateUI(p1, p2) {
        document.getElementById('myFill').style.width = (p1 * 2) + '%';
        document.getElementById('oppFill').style.width = (p2 * 2) + '%';

        if(p1 >= 50 || p2 >= 50) {
            gameOver = true;
            let winner = p1 >= 50 ? "PLAYER 1" : (mode === 'bot' ? "BOT" : "PLAYER 2");
            document.getElementById('status').innerText = "🏆 " + winner + " WINS!";
        }
    }

    function startBot() {
        const loop = () => {
            if(gameOver) return;
            scores.p2++;
            updateUI(scores.p1, scores.p2);
            let speed = Math.max(100, 300 - (scores.p1 * 4)); 
            setTimeout(loop, speed);
        };
        loop();
    }

    function findMatch() {
        const qRef = db.ref('click_queue');
        qRef.once('value', snap => {
            let found = false;
            snap.forEach(room => {
                if(!room.val().full && !found) {
                    found = true; playerRole = 'p2';
                    gRef = db.ref('click_rooms/' + room.key);
                    qRef.child(room.key).update({ full: true });
                    listen();
                }
            });
            if(!found) {
                const id = Math.random().toString(36).substring(7);
                playerRole = 'p1'; gRef = db.ref('click_rooms/' + id);
                gRef.set({ p1: 0, p2: 0, full: false });
                qRef.child(id).set({ full: false });
                listen();
            }
        });
    }

    function listen() {
        gRef.on('value', s => {
            const d = s.val(); if(!d) return;
            if(d.full) {
                document.getElementById('status').innerText = "BATTLE!";
                updateUI(d.p1, d.p2);
            }
        });
    }
</script>
</body>
</html>
