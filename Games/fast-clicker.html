<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Clicker | Multi-Mode</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;800&display=swap');
        
        :root {
            --primary: #6366f1;
            --success: #10b981;
            --danger: #ef4444;
        }

        body { 
            font-family: 'Outfit', sans-serif; 
            background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%); 
            margin: 0; min-height: 100vh; 
            display: flex; align-items: center; justify-content: center; padding: 20px; 
        }

        .container { 
            background: rgba(255,255,255,0.95); 
            padding: 30px; border-radius: 25px; 
            width: 100%; max-width: 400px; 
            text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.2); 
        }

        .progress-bar { height: 25px; background: #e2e8f0; border-radius: 50px; overflow: hidden; margin: 10px 0 5px; border: 2px solid #cbd5e1; }
        .fill { height: 100%; width: 0%; transition: width 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275); background: var(--primary); }
        
        #tapBtn { 
            width: 150px; height: 150px; border-radius: 50%; 
            border: 8px solid var(--primary); font-size: 1.5rem; font-weight: 800; 
            cursor: pointer; background: white; transition: 0.1s; margin: 20px 0;
            box-shadow: 0 10px 0 #4338ca; outline: none;
        }
        #tapBtn:active { transform: translateY(5px); box-shadow: 0 5px 0 #4338ca; background: #f8fafc; }
        #tapBtn:disabled { filter: grayscale(1); cursor: not-allowed; opacity: 0.6; }

        .btn { padding: 14px 20px; border-radius: 15px; border: none; font-weight: 700; cursor: pointer; margin-top: 10px; width: 100%; transition: 0.2s; font-size: 1rem; }
        .btn-main { background: var(--primary); color: white; }
        .btn-alt { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }

        .id-badge { background: #f1f5f9; padding: 10px; border-radius: 12px; font-family: monospace; font-weight: bold; margin-bottom: 15px; border: 1px dashed #cbd5e1; }
        .hidden { display: none !important; }
        .label-group { display: flex; justify-content: space-between; font-size: 0.9rem; font-weight: 800; color: #64748b; }
    </style>
</head>
<body>
    <div class="container">
        <div id="lobby">
            <h2 style="font-size: 2rem; margin-bottom: 25px;">⚡ Speed Clicker</h2>
            <button class="btn btn-main" onclick="startMode('bot')">🤖 VS Smart Bot</button>
            <button class="btn btn-main" onclick="startMode('pass')">👥 Pass & Play</button>
            <div style="margin: 20px 0; border-top: 2px solid #f1f5f9;"></div>
            <button class="btn btn-alt" onclick="startMode('private')">🔑 Play with Friend</button>
            <button class="btn btn-alt" onclick="startMode('online')">🌐 Random Match</button>
        </div>

        <div id="setup" class="hidden">
            <h3 id="setupTitle">Room Setup</h3>
            <div id="roomControls">
                <input type="text" id="roomIdInput" placeholder="Enter Room ID" style="width: 100%; padding: 12px; border-radius: 10px; border: 2px solid #e2e8f0; margin-bottom: 10px; text-align: center;">
                <button class="btn btn-main" onclick="joinPrivate()">Join Room</button>
                <button class="btn btn-alt" onclick="createPrivate()">Create New Room</button>
            </div>
            <button class="btn btn-alt" style="color:var(--danger)" onclick="location.reload()">Back</button>
        </div>

        <div id="game" class="hidden">
            <div id="idDisplay" class="id-badge hidden">ID: <span id="roomCode">---</span></div>
            <h3 id="status">Waiting for Opponent...</h3>
            
            <div class="label-group"><span>You (P1)</span><span id="p1Score">0%</span></div>
            <div class="progress-bar"><div id="myFill" class="fill"></div></div>
            
            <div class="label-group"><span id="oppName">Opponent (P2)</span><span id="p2Score">0%</span></div>
            <div class="progress-bar"><div id="oppFill" class="fill" style="background:#94a3b8"></div></div>
            
            <button id="tapBtn" onclick="tap()" disabled>TAP!</button>
            
            <button class="btn btn-alt" style="color:var(--danger)" onclick="location.reload()">Quit Game</button>
        </div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCVVqQnmO1Q83AucOqA5b5qUC4eo49sq6E",
            authDomain: "chat-box-e01e5.firebaseapp.com",
            databaseURL: "https://chat-box-e01e5-default-rtdb.firebaseio.com",
            projectId: "chat-box-e01e5",
            storageBucket: "chat-box-e01e5.firebasestorage.app",
            messagingSenderId: "597491149800",
            appId: "1:597491149800:web:7bd908925f70b62018125d"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let gRef, player, gameMode, gameOver = false;
        let localData = { p1: 0, p2: 0 };
        let botInterval;

        function startMode(mode) {
            gameMode = mode;
            document.getElementById('lobby').classList.add('hidden');
            
            if (mode === 'private') {
                document.getElementById('setup').classList.remove('hidden');
            } else if (mode === 'bot' || mode === 'pass') {
                initLocalGame();
            } else {
                startOnlineMatch();
            }
        }

        // --- ONLINE LOGIC ---
        function startOnlineMatch() {
            document.getElementById('game').classList.remove('hidden');
            const qRef = db.ref('click_queue');
            qRef.once('value', snap => {
                let found = false;
                snap.forEach(room => {
                    if(!room.val().full && !found) {
                        found = true; player = 'P2';
                        gRef = db.ref('click_rooms/' + room.key);
                        qRef.child(room.key).update({ full: true });
                        listenOnline();
                    }
                });
                if(!found) {
                    const id = Math.random().toString(36).substring(7);
                    player = 'P1'; gRef = db.ref('click_rooms/' + id);
                    gRef.set({ p1: 0, p2: 0, active: true, full: false });
                    qRef.child(id).set({ full: false });
                    listenOnline();
                }
            });
        }

        function createPrivate() {
            const id = Math.random().toString(36).substring(2, 7).toUpperCase();
            player = 'P1';
            gRef = db.ref('click_rooms/' + id);
            gRef.set({ p1: 0, p2: 0, active: true, full: false, isPrivate: true });
            showGameUI(id);
            listenOnline();
        }

        function joinPrivate() {
            const id = document.getElementById('roomIdInput').value.trim().toUpperCase();
            if(!id) return alert("Enter ID!");
            gRef = db.ref('click_rooms/' + id);
            gRef.once('value', s => {
                if(!s.exists()) return alert("Room not found!");
                player = 'P2';
                gRef.update({ full: true });
                showGameUI(id);
                listenOnline();
            });
        }

        function listenOnline() {
            gRef.on('value', s => {
                const d = s.val(); if(!d) return;
                if(!d.full) {
                    document.getElementById('status').innerText = "Waiting for Friend...";
                    document.getElementById('tapBtn').disabled = true;
                    return;
                }
                updateBars(d.p1, d.p2);
            });
        }

        // --- LOCAL LOGIC (BOT / PASS) ---
        function initLocalGame() {
            document.getElementById('game').classList.remove('hidden');
            document.getElementById('status').innerText = "Ready? Click TAP!";
            document.getElementById('tapBtn').disabled = false;
            document.getElementById('oppName').innerText = gameMode === 'bot' ? "Smart Bot (AI)" : "Player 2 (Local)";
            
            if (gameMode === 'bot') startBot();
        }

        function startBot() {
            // Adaptive AI: Clicks faster if you are winning or close to end
            const loop = () => {
                if (gameOver) return;
                localData.p2++;
                updateBars(localData.p1, localData.p2);
                
                let difficulty = 250 - (localData.p1 * 2); // Gets harder as P1 scores
                botInterval = setTimeout(loop, Math.max(80, difficulty));
            };
            loop();
        }

        // --- CORE UTILS ---
        function tap() {
            if(gameOver) return;
            if (gameMode === 'online' || gameMode === 'private') {
                gRef.child(player.toLowerCase()).set(firebase.database.ServerValue.increment(1));
            } else if (gameMode === 'pass') {
                // In Pass & Play, usually the tap button alternates or P1/P2 have zones
                // For this UI, we'll make it a shared race - clicker increments P1
                localData.p1++;
                updateBars(localData.p1, localData.p2);
            } else {
                localData.p1++;
                updateBars(localData.p1, localData.p2);
            }
        }

        function updateBars(p1, p2) {
            const myS = p1;
            const oppS = p2;
            
            // UI Update
            document.getElementById('myFill').style.width = (p1 * 2) + '%';
            document.getElementById('oppFill').style.width = (p2 * 2) + '%';
            document.getElementById('p1Score').innerText = (p1 * 2) + '%';
            document.getElementById('p2Score').innerText = (p2 * 2) + '%';

            if(p1 >= 50 || p2 >= 50) {
                gameOver = true;
                document.getElementById('tapBtn').disabled = true;
                clearTimeout(botInterval);
                
                if (gameMode === 'online' || gameMode === 'private') {
                    const win = (player === 'P1' && p1 >= 50) || (player === 'P2' && p2 >= 50);
                    document.getElementById('status').innerText = win ? "🎉 YOU WON!" : "💀 DEFEAT!";
                } else {
                    document.getElementById('status').innerText = p1 >= 50 ? "🎉 P1 WINS!" : "🤖 BOT WINS!";
                }
            } else {
                document.getElementById('status').innerText = "RACE TO 100%!";
                document.getElementById('tapBtn').disabled = false;
            }
        }

        function showGameUI(id) {
            document.getElementById('setup').classList.add('hidden');
            document.getElementById('game').classList.remove('hidden');
            document.getElementById('idDisplay').classList.remove('hidden');
            document.getElementById('roomCode').innerText = id;
        }
    </script>
</body>
</html>
