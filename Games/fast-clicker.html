<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Clicker | Multi-Layout</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;800&display=swap');
        
        :root {
            --p1-color: #6366f1;
            --p2-color: #ec4899;
        }

        body { 
            font-family: 'Outfit', sans-serif; 
            background: #0f172a; margin: 0; min-height: 100vh; 
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }

        .container { 
            background: white; padding: 25px; border-radius: 30px; 
            width: 90%; max-width: 400px; text-align: center; position: relative;
        }

        /* Progress Bars */
        .progress-bar { height: 18px; background: #e2e8f0; border-radius: 50px; overflow: hidden; margin: 5px 0; border: 1px solid #cbd5e1; }
        .fill { height: 100%; width: 0%; transition: width 0.1s ease-out; }
        #myFill { background: var(--p1-color); }
        #oppFill { background: var(--p2-color); }

        /* Tap Buttons */
        .tap-btn { 
            width: 110px; height: 110px; border-radius: 50%; 
            font-size: 1.1rem; font-weight: 800; cursor: pointer; 
            transition: 0.1s; border: none; color: white;
            box-shadow: 0 6px 0 rgba(0,0,0,0.2);
            -webkit-tap-highlight-color: transparent;
        }
        .btn-p1 { background: var(--p1-color); }
        .btn-p2 { background: var(--p2-color); }
        .tap-btn:active { transform: scale(0.92) translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.2); }

        /* Layout Styles */
        .layout-opposite { display: flex; flex-direction: column; justify-content: space-between; height: 450px; }
        .layout-bottom { display: flex; flex-direction: column; height: auto; gap: 20px; }
        .side-by-side-btns { display: flex; justify-content: center; gap: 20px; margin-top: 15px; }

        .menu-btn { 
            padding: 14px; width: 100%; border-radius: 15px; border: none; 
            margin: 6px 0; font-weight: 700; cursor: pointer; background: #f1f5f9; color: #1e293b;
            transition: 0.2s;
        }
        .menu-btn:hover { background: #e2e8f0; }
        .btn-primary { background: var(--p1-color); color: white; }
        .btn-secondary { background: var(--p2-color); color: white; }

        .hidden { display: none !important; }
        .rotate180 { transform: rotate(180deg); }
        .status-text { font-weight: 800; color: #475569; margin: 10px 0; }
    </style>
</head>
<body>

    <div id="lobby" class="container">
        <h2 style="font-size: 1.8rem; margin-bottom: 20px;">⚡ Clicker Pro</h2>
        <button class="menu-btn btn-primary" onclick="startMode('bot')">🤖 VS Smart Bot</button>
        <button class="menu-btn btn-secondary" onclick="showLayoutOptions()">👥 Pass & Play</button>
        <button class="menu-btn" onclick="startMode('online')">🌐 Random Match</button>
        <button class="menu-btn" onclick="showPrivate()">🔑 Play with Friend</button>
    </div>

    <div id="layout-selector" class="container hidden">
        <h3>Select Layout</h3>
        <button class="menu-btn" onclick="startPassAndPlay('opposite')">↔️ Opposite (Face-to-Face)</button>
        <button class="menu-btn" onclick="startPassAndPlay('bottom')">⬇️ Both at Bottom (Side-by-Side)</button>
        <button class="menu-btn" onclick="location.reload()" style="color: #ef4444;">Cancel</button>
    </div>

    <div id="game" class="container hidden">
        <div id="game-content">
            <div id="p2-section">
                <div id="p2-btn-wrapper">
                    <button id="btnP2" class="tap-btn btn-p2" onclick="tap('p2')">TAP!</button>
                </div>
                <div class="progress-bar"><div id="oppFill" class="fill"></div></div>
            </div>

            <div class="status-text" id="status">Ready?</div>

            <div id="p1-section">
                <div class="progress-bar"><div id="myFill" class="fill"></div></div>
                <div id="p1-btn-wrapper">
                    <button id="btnP1" class="tap-btn btn-p1" onclick="tap('p1')">TAP!</button>
                </div>
            </div>
        </div>
        <button class="menu-btn" onclick="location.reload()" style="margin-top: 20px; font-size: 0.8rem;">Quit</button>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCVVqQnmO1Q83AucOqA5b5qUC4eo49sq6E",
        authDomain: "chat-box-e01e5.firebaseapp.com",
        databaseURL: "https://chat-box-e01e5-default-rtdb.firebaseio.com",
        projectId: "chat-box-e01e5",
        storageBucket: "chat-box-e01e5.firebasestorage.app",
        messagingSenderId: "597491149800",
        appId: "1:597491149800:web:7bd908925f70b62018125d"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let gRef, playerRole, mode, gameOver = false;
    let scores = { p1: 0, p2: 0 };

    function showLayoutOptions() {
        document.getElementById('lobby').classList.add('hidden');
        document.getElementById('layout-selector').classList.remove('hidden');
    }

    function startPassAndPlay(layout) {
        mode = 'pass';
        document.getElementById('layout-selector').classList.add('hidden');
        document.getElementById('game').classList.remove('hidden');
        
        const content = document.getElementById('game-content');
        const p2Btn = document.getElementById('btnP2');
        
        if(layout === 'opposite') {
            content.className = 'layout-opposite';
            p2Btn.classList.add('rotate180'); // Face P2
        } else {
            content.className = 'layout-bottom';
            // Move buttons to a single div at bottom
            const bottomDiv = document.createElement('div');
            bottomDiv.className = 'side-by-side-btns';
            bottomDiv.appendChild(document.getElementById('p1-btn-wrapper'));
            bottomDiv.appendChild(document.getElementById('p2-btn-wrapper'));
            content.appendChild(bottomDiv);
            p2Btn.classList.remove('rotate180');
        }
    }

    function startMode(m) {
        mode = m;
        document.getElementById('lobby').classList.add('hidden');
        document.getElementById('game').classList.remove('hidden');
        document.getElementById('btnP2').classList.add('hidden'); // Default hide for online/bot

        if(mode === 'bot') {
            document.getElementById('status').innerText = "VS SMART BOT";
            startBot();
        } else if(mode === 'online') {
            document.getElementById('status').innerText = "Searching Match...";
            findMatch();
        }
    }

    function tap(p) {
        if(gameOver) return;
        if(mode === 'online') {
            gRef.child(playerRole).set(firebase.database.ServerValue.increment(1));
        } else {
            scores[p]++;
            updateUI(scores.p1, scores.p2);
        }
    }

    function updateUI(p1, p2) {
        document.getElementById('myFill').style.width = (p1 * 2) + '%';
        document.getElementById('oppFill').style.width = (p2 * 2) + '%';
        if(p1 >= 50 || p2 >= 50) {
            gameOver = true;
            document.getElementById('status').innerText = p1 >= 50 ? "🏆 P1 WINS!" : "🏆 P2 WINS!";
        }
    }

    function startBot() {
        const loop = () => {
            if(gameOver) return;
            scores.p2++;
            updateUI(scores.p1, scores.p2);
            let speed = Math.max(80, 250 - (scores.p1 * 3)); 
            setTimeout(loop, speed);
        };
        loop();
    }

    function findMatch() {
        const qRef = db.ref('click_queue');
        qRef.once('value', snap => {
            let found = false;
            snap.forEach(room => {
                if(!room.val().full && !found) {
                    found = true; playerRole = 'p2';
                    gRef = db.ref('click_rooms/' + room.key);
                    qRef.child(room.key).update({ full: true });
                    listen();
                }
            });
            if(!found) {
                const id = Math.random().toString(36).substring(7);
                playerRole = 'p1'; gRef = db.ref('click_rooms/' + id);
                gRef.set({ p1: 0, p2: 0, full: false });
                qRef.child(id).set({ full: false });
                listen();
            }
        });
    }

    function listen() {
        gRef.on('value', s => {
            const d = s.val(); if(!d) return;
            if(d.full) {
                document.getElementById('status').innerText = "BATTLE START!";
                updateUI(d.p1, d.p2);
            }
        });
    }

    function showPrivate() {
        let id = prompt("Enter Room ID to Join OR leave blank to Create:");
        if(id === null) return;
        if(id === "") {
            id = Math.random().toString(36).substring(7).toUpperCase();
            alert("Your Room ID: " + id);
            playerRole = 'p1';
            gRef = db.ref('click_rooms/' + id);
            gRef.set({ p1: 0, p2: 0, full: false });
        } else {
            playerRole = 'p2';
            gRef = db.ref('click_rooms/' + id.toUpperCase());
            gRef.update({ full: true });
        }
        startMode('online');
    }
</script>
</body>
</html>
