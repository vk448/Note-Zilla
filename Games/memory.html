<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Online | Multi-Mode</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');

        :root {
            --primary: #f59e0b;
            --secondary: #d97706;
            --bg-gradient: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            --glass: rgba(255, 255, 255, 0.9);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            margin: 0; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #1e293b; padding: 15px;
        }

        .container {
            background: var(--glass);
            backdrop-filter: blur(15px); border-radius: 30px; padding: 25px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            width: 100%; max-width: 420px; text-align: center; border: 1px solid rgba(255,255,255,0.3);
        }

        h1 { font-weight: 800; font-size: 2rem; margin: 0 0 20px; color: white; text-shadow: 0 4px 10px rgba(0,0,0,0.1); }

        .btn {
            width: 100%; padding: 14px; margin: 8px 0; border: none; border-radius: 18px;
            font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.3s;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-menu { background: white; color: #475569; border: 1px solid #e2e8f0; }
        .btn-menu:hover { background: #f8fafc; transform: translateY(-2px); }
        .btn-action { background: #1e293b; color: white; }
        .btn-share { background: #10b981; color: white; }
        .btn-exit { background: #fee2e2; color: #ef4444; margin-top: 15px; }

        input {
            width: 100%; padding: 14px; margin: 10px 0; border-radius: 15px;
            border: 2px solid #e2e8f0; outline: none; text-align: center; font-size: 1.1rem;
        }

        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 20px 0; perspective: 1000px; }
        
        .card {
            aspect-ratio: 1; position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .card.flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .card-front { background: var(--primary); color: transparent; }
        .card-back { background: white; color: #1e293b; transform: rotateY(180deg); }

        .card.matched .card-back { background: #10b981; color: white; }

        .id-card { background: #fef3c7; padding: 15px; border-radius: 20px; margin-bottom: 15px; border: 1px dashed var(--secondary); }
        .stats { display: flex; justify-content: space-around; margin: 10px 0; }
        .score { background: #fff; padding: 10px; border-radius: 12px; flex: 1; margin: 0 5px; font-weight: 800; border: 2px solid transparent; }
        .score.active { border-color: var(--primary); background: #fffbeb; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <h1>Memory Online</h1>

    <div class="container">
        <div id="lobby">
            <button class="btn btn-menu" onclick="startLocal('bot')">🤖 VS Smart Bot</button>
            <button class="btn btn-menu" onclick="startLocal('pass')">👥 Pass & Play</button>
            <div style="margin: 15px 0; height: 1px; background: #e2e8f0;"></div>
            <button class="btn btn-action" onclick="showPrivate()">🔑 Play with Friend</button>
            <button class="btn btn-action" style="background:#6366f1" onclick="findAutoMatch()">🌐 Random Match</button>
        </div>

        <div id="private-setup" class="hidden">
            <button class="btn btn-action" onclick="createPrivate()">Create Room</button>
            <input type="text" id="joinIdInput" placeholder="Enter Room ID">
            <button class="btn btn-action" style="background:var(--secondary)" onclick="joinPrivate()">Join Room</button>
            <button class="btn btn-exit" onclick="location.reload()">Back</button>
        </div>

        <div id="game" class="hidden">
            <div id="shareBox" class="id-card hidden">
                <div id="displayId" style="font-size:1.6rem; font-weight:800; color:var(--secondary);">---</div>
                <div style="display:flex; gap:8px">
                    <button class="btn btn-menu" style="flex:1" onclick="copyId()">Copy</button>
                    <button class="btn btn-share" style="flex:1" onclick="shareID()">Share</button>
                </div>
            </div>

            <div class="stats">
                <div id="p1Box" class="score">P1: <span id="p1Score">0</span></div>
                <div id="p2Box" class="score">P2: <span id="p2Score">0</span></div>
            </div>
            
            <div id="status" style="font-weight:600; margin:10px 0;">Connecting...</div>
            <div class="grid" id="grid"></div>
            
            <button class="btn btn-exit" onclick="location.reload()">Quit Game</button>
        </div>
    </div>

<script>
    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyCVVqQnmO1Q83AucOqA5b5qUC4eo49sq6E",
        authDomain: "chat-box-e01e5.firebaseapp.com",
        databaseURL: "https://chat-box-e01e5-default-rtdb.firebaseio.com",
        projectId: "chat-box-e01e5",
        storageBucket: "chat-box-e01e5.firebasestorage.app",
        messagingSenderId: "597491149800",
        appId: "1:597491149800:web:7bd908925f70b62018125d"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const emojis = ['🎮','🚀','💎','🔥','👻','🍕','🐱','🌈'];
    let gRef, mySym, currentId, isMyTurn = false;
    let gameMode = 'online'; // 'online', 'bot', 'pass'
    let localState = {}; // Used for offline modes
    let botMemory = {}; // Index: Emoji

    // --- NAVIGATION ---
    function showPrivate() { 
        document.getElementById('lobby').classList.add('hidden'); 
        document.getElementById('private-setup').classList.remove('hidden'); 
    }

    // --- LOCAL MODES (BOT & PASS) ---
    function startLocal(mode) {
        gameMode = mode;
        mySym = 'p1';
        isMyTurn = true;
        const shuffled = [...emojis, ...emojis].sort(() => Math.random() - 0.5);
        
        localState = {
            cards: shuffled,
            p1: 0, p2: 0,
            turn: 'p1',
            flipped: [-1, -1],
            matched: [],
            p2Ready: true
        };

        document.getElementById('lobby').classList.add('hidden');
        document.getElementById('game').classList.remove('hidden');
        buildGrid();
        updateUI(localState);
    }

    // --- ONLINE MODES ---
    function createPrivate() {
        gameMode = 'online';
        currentId = Math.random().toString(36).substring(2, 7).toUpperCase();
        setupOnline('p1', currentId);
        const shuffled = [...emojis, ...emojis].sort(() => Math.random() - 0.5);
        gRef.set({ cards: shuffled, p1: 0, p2: 0, turn: 'p1', flipped: [-1, -1], matched: [], p1Ready: true });
        document.getElementById('shareBox').classList.remove('hidden');
        document.getElementById('displayId').innerText = currentId;
    }

    function joinPrivate() {
        gameMode = 'online';
        currentId = document.getElementById('joinIdInput').value.trim().toUpperCase();
        if(!currentId) return alert("ID Likho!");
        db.ref('memo_rooms/' + currentId).once('value', s => {
            if(!s.exists()) return alert("Room nahi mila!");
            setupOnline('p2', currentId);
            gRef.update({ p2Ready: true });
        });
    }

    function findAutoMatch() {
        gameMode = 'online';
        const qRef = db.ref('memo_queue');
        qRef.once('value', snap => {
            let found = false;
            snap.forEach(room => {
                if(!room.val().full && !found) {
                    found = true; currentId = room.key; setupOnline('p2', currentId);
                    qRef.child(currentId).update({ full: true }); gRef.update({ p2Ready: true });
                }
            });
            if(!found) {
                currentId = "AUTO_" + Math.random().toString(36).substring(7);
                setupOnline('p1', currentId);
                const shuffled = [...emojis, ...emojis].sort(() => Math.random() - 0.5);
                gRef.set({ cards: shuffled, p1: 0, p2: 0, turn: 'p1', flipped: [-1, -1], matched: [], p1Ready: true });
                qRef.child(currentId).set({ full: false });
            }
        });
    }

    function setupOnline(sym, id) {
        mySym = sym; 
        gRef = db.ref('memo_rooms/' + id);
        document.getElementById('private-setup').classList.add('hidden');
        document.getElementById('lobby').classList.add('hidden');
        document.getElementById('game').classList.remove('hidden');
        buildGrid();
        gRef.on('value', s => { if(s.exists()) updateUI(s.val()); });
    }

    // --- CORE GAME LOGIC ---
    function buildGrid() {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        for(let i=0; i<16; i++) {
            const card = document.createElement('div');
            card.className = 'card';
            card.id = 'card-' + i;
            card.innerHTML = `<div class="card-face card-front"></div><div class="card-face card-back"></div>`;
            card.onclick = () => handleFlip(i);
            grid.appendChild(card);
        }
    }

    function handleFlip(i) {
        if (!isMyTurn && gameMode !== 'pass') return;
        const data = gameMode === 'online' ? null : localState;
        
        if (gameMode === 'online') {
            gRef.once('value', s => {
                const d = s.val();
                if(canFlip(i, d)) executeFlip(i, d);
            });
        } else {
            if(canFlip(i, data)) executeFlip(i, data);
        }
    }

    function canFlip(i, d) {
        if(!d.p2Ready || d.winner) return false;
        if(d.flipped[0] !== -1 && d.flipped[1] !== -1) return false;
        if(d.matched?.includes(i) || d.flipped.includes(i)) return false;
        return true;
    }

    function executeFlip(i, d) {
        let newFlipped = [...d.flipped];
        if(newFlipped[0] === -1) newFlipped[0] = i;
        else {
            newFlipped[1] = i;
            setTimeout(() => checkMatch(newFlipped, d), 1000);
        }

        // Add to bot memory if bot mode is active
        if(gameMode === 'bot') botMemory[i] = d.cards[i];

        if(gameMode === 'online') gRef.update({ flipped: newFlipped });
        else { localState.flipped = newFlipped; updateUI(localState); }
    }

    function checkMatch(flippedIdx, d) {
        const c1 = d.cards[flippedIdx[0]], c2 = d.cards[flippedIdx[1]];
        const turn = d.turn;

        if(c1 === c2) {
            d.matched = [...(d.matched || []), ...flippedIdx];
            d[turn] += 1;
            d.flipped = [-1, -1];
            // Clear matched cards from bot memory
            delete botMemory[flippedIdx[0]]; delete botMemory[flippedIdx[1]];
        } else {
            d.flipped = [-1, -1];
            d.turn = (turn === 'p1') ? 'p2' : 'p1';
        }

        if(gameMode === 'online') gRef.update(d);
        else { localState = d; updateUI(localState); if(d.turn === 'p2' && gameMode === 'bot') setTimeout(botMove, 1200); }
    }

    // --- BOT AI ---
    function botMove() {
        if(localState.matched.length === 16) return;
        
        let move1, move2;
        const available = [...Array(16).keys()].filter(i => !localState.matched.includes(i));
        
        // 1. Can bot find a pair in memory?
        let knownPair = findPairInMemory();
        if(knownPair) {
            [move1, move2] = knownPair;
        } else {
            // 2. Pick a random card
            move1 = available[Math.floor(Math.random() * available.length)];
            botMemory[move1] = localState.cards[move1];
            
            // 3. After picking one, does it know where the other is?
            let matchIdx = Object.keys(botMemory).find(idx => botMemory[idx] === localState.cards[move1] && idx != move1);
            if(matchIdx !== undefined) {
                move2 = parseInt(matchIdx);
            } else {
                let remaining = available.filter(i => i !== move1);
                move2 = remaining[Math.floor(Math.random() * remaining.length)];
                botMemory[move2] = localState.cards[move2];
            }
        }

        // Execute Bot sequence
        executeFlip(move1, localState);
        setTimeout(() => executeFlip(move2, localState), 1000);
    }

    function findPairInMemory() {
        let entries = Object.entries(botMemory);
        for(let i=0; i<entries.length; i++) {
            for(let j=i+1; j<entries.length; j++) {
                if(entries[i][1] === entries[j][1]) return [parseInt(entries[i][0]), parseInt(entries[j][0])];
            }
        }
        return null;
    }

    // --- UI UPDATER ---
    function updateUI(d) {
        if(!d.p2Ready) { document.getElementById('status').innerText = "Waiting for Opponent..."; return; }
        
        isMyTurn = d.turn === mySym;
        let turnText = d.turn === 'p1' ? "Player 1" : (gameMode === 'bot' ? "Bot 🤖" : "Player 2");
        document.getElementById('status').innerText = (isMyTurn || (gameMode==='pass' && d.turn==='p2')) ? `🟢 ${turnText}'s Turn` : `⏳ ${turnText}'s Turn`;

        d.cards.forEach((emoji, i) => {
            const cardEl = document.getElementById('card-' + i);
            const isFlipped = d.matched?.includes(i) || d.flipped?.includes(i);
            cardEl.querySelector('.card-back').innerText = emoji;
            if(isFlipped) cardEl.classList.add('flipped');
            else cardEl.classList.remove('flipped');
            if(d.matched?.includes(i)) cardEl.classList.add('matched');
        });

        document.getElementById('p1Score').innerText = d.p1;
        document.getElementById('p2Score').innerText = d.p2;
        document.getElementById('p1Box').className = `score ${d.turn==='p1'?'active':''}`;
        document.getElementById('p2Box').className = `score ${d.turn==='p2'?'active':''}`;
        
        if(d.matched && d.matched.length === 16) {
            let winner = d.p1 > d.p2 ? "P1 Wins!" : (d.p2 > d.p1 ? (gameMode==='bot'?"Bot Wins!":"P2 Wins!") : "Draw!");
            document.getElementById('status').innerText = "🏆 " + winner;
        }
    }

    function copyId() { navigator.clipboard.writeText(currentId); alert("ID Copied!"); }
    async function shareID() {
        const data = { title: 'Memory Online', text: `Join my game! Room ID: ${currentId}`, url: window.location.href };
        if(navigator.share) await navigator.share(data); else copyId();
    }
</script>
</body>
</html>
