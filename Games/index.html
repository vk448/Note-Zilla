<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Gaming Hub</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');

        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --bg-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #1e293b;
        }

        .hub-container {
            width: 90%;
            max-width: 500px;
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: white;
            font-size: 2.8rem;
            font-weight: 800;
            margin-bottom: 10px;
            text-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        p.subtitle {
            color: rgba(255,255,255,0.8);
            margin-bottom: 40px;
            font-size: 1.1rem;
        }

        .game-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            padding: 25px;
            border-radius: 24px;
            text-decoration: none;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 20px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .game-card:hover {
            transform: scale(1.05) translateY(-5px);
            background: white;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .icon-box {
            width: 60px;
            height: 60px;
            background: var(--bg-gradient);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: white;
            box-shadow: 0 8px 15px rgba(99, 102, 241, 0.3);
        }

        .game-info {
            text-align: left;
        }

        .game-info h3 {
            margin: 0;
            font-size: 1.3rem;
            font-weight: 700;
        }

        .game-info p {
            margin: 4px 0 0;
            font-size: 0.9rem;
            color: #64748b;
        }

        .badge {
            margin-left: auto;
            background: #f1f5f9;
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--primary);
        }

        footer {
            margin-top: 50px;
            color: rgba(255,255,255,0.6);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="hub-container">
        <h1>Mini Games</h1>
        <p class="subtitle">Select a game and start playing with friends!</p>

        <div class="game-grid">
            
            <a href="tic tac toe.html" class="game-card">
                <div class="icon-box" style="background: linear-gradient(135deg, #ff4757, #ff6b81);">❌</div>
                <div class="game-info">
                    <h3>Tic Tac Toe</h3>
                    <p>Classic strategy game.</p>
                </div>
                <div class="badge">Multiplayer</div>
            </a>

            <a href="memory.html" class="game-card">
                <div class="icon-box" style="background: linear-gradient(135deg, #f59e0b, #d97706);">🧠</div>
                <div class="game-info">
                    <h3>Memory Match</h3>
                    <p>Test your brain power.</p>
                </div>
                <div class="badge">Online Flip</div>
            </a>

            <a href="fast-clicker.html" class="game-card">
                <div class="icon-box" style="background: linear-gradient(135deg, #10b981, #3b82f6);">⚡</div>
                <div class="game-info">
                    <h3>Speed Clicker</h3>
                    <p>Fastest finger wins!</p>
                </div>
                <div class="badge">Live Race</div>
            </a>

        </div>

        <footer>Built for Fun & Competition</footer>
    </div>

</body>
</html>
