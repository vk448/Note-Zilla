<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Gaming Hub</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');

        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --accent: #00d2ff;
            --bg-dark: #0f172a;
        }

        * {
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: #0f172a;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f8fafc;
            overflow-x: hidden;
        }

        /* Animated Background Blobs */
        .bg-blob {
            position: fixed;
            width: 400px;
            height: 400px;
            background: var(--bg-gradient);
            filter: blur(80px);
            z-index: -1;
            opacity: 0.4;
            border-radius: 50%;
            animation: move 20s infinite alternate;
        }

        @keyframes move {
            from { transform: translate(-20%, -20%); }
            to { transform: translate(20%, 20%); }
        }

        .hub-container {
            width: 95%;
            max-width: 550px;
            text-align: center;
            padding: 40px 20px;
            position: relative;
        }

        h1 {
            font-size: clamp(2.5rem, 8vw, 3.5rem);
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(to right, #fff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.3));
        }

        p.subtitle {
            color: #94a3b8;
            margin-bottom: 50px;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
        }

        .game-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 20px;
            border-radius: 28px;
            text-decoration: none;
            color: white;
            display: flex;
            align-items: center;
            gap: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .game-card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            transition: 0.5s;
        }

        .game-card:hover::before {
            left: 100%;
        }

        .game-card:hover {
            transform: translateY(-8px) scale(1.02);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(168, 85, 247, 0.5);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .icon-box {
            width: 70px;
            height: 70px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            flex-shrink: 0;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .game-info {
            text-align: left;
        }

        .game-info h3 {
            margin: 0;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .game-info p {
            margin: 4px 0 0;
            font-size: 0.95rem;
            color: #94a3b8;
        }

        .badge {
            margin-left: auto;
            background: rgba(99, 102, 241, 0.15);
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            color: #818cf8;
            border: 1px solid rgba(99, 102, 241, 0.2);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        footer {
            margin-top: 60px;
            color: #475569;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="bg-blob" style="top: 10%; left: 10%; background: var(--primary);"></div>
    <div class="bg-blob" style="bottom: 10%; right: 10%; background: var(--secondary); animation-delay: -5s;"></div>

    <div class="hub-container">
        <h1>Mini Games</h1>
        <p class="subtitle">Elevate your play, challenge your limits.</p>

        <div class="game-grid">
            
            <a href="tic tac toe.html" class="game-card">
                <div class="icon-box" style="background: linear-gradient(135deg, #f43f5e, #fb7185);">✕</div>
                <div class="game-info">
                    <h3>Tic Tac Toe</h3>
                    <p>Classic strategy reimagined.</p>
                </div>
                <div class="badge">PvP Mode</div>
            </a>

            <a href="memory.html" class="game-card">
                <div class="icon-box" style="background: linear-gradient(135deg, #f59e0b, #fbbf24);">🧠</div>
                <div class="game-info">
                    <h3>Memory Match</h3>
                    <p>Sharpen your cognitive skills.</p>
                </div>
                <div class="badge">Zen</div>
            </a>

            <a href="fast-clicker.html" class="game-card">
                <div class="icon-box" style="background: linear-gradient(135deg, #06b6d4, #3b82f6);">⚡</div>
                <div class="game-info">
                    <h3>Speed Clicker</h3>
                    <p>How fast are your reflexes?</p>
                </div>
                <div class="badge">Blitz</div>
            </a>

        </div>

        <footer>&copy; 2024 Gaming Hub • Level Up</footer>
    </div>

</body>
</html>
