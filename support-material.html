<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support Material - Note Zilla</title>
<link rel="icon" href="Images/Favicon.png">
<style>
  footer img{
  height: 30px;
  width: 30px;
  border-radius: 50px;
  margin: 10px 5px;
}
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap');

/* ============================ General Reset =========================== */
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
body { background: #f9fafb; color: #333; line-height: 1.6; }

/* ============================ Header =========================== */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 50px;
  background: #fff;
  box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  position: sticky;
  top: 0;
  z-index: 100;
}
.logo {
  font-weight: 900;
  font-size: 1.8rem;
  background: linear-gradient(90deg, #4e73df, #1cc88a);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
nav { display: flex; align-items: center; gap: 15px; }
nav a { text-decoration: none; color: #333; font-weight: 500; transition: color 0.2s; }
nav a:hover { color: #4e73df; }
.back { text-decoration: none; color: #17a673; font-weight: 500; }
.back:hover { text-shadow: 0 0 10px #1cc88a; }

/* Hamburger for mobile */
.hamburger { display: none; flex-direction: column; cursor: pointer; gap: 5px; }
.hamburger div { width: 25px; height: 3px; background-color: #333; transition: all 0.3s; }

/* ============================ Hero / Title =========================== */
.hero {
  text-align: center;
  padding: 100px 20px 50px;
}
.hero h1 { font-size: 3rem; font-weight: 900; color: #4e73df; margin-bottom: 20px; }
.hero p { font-size: 1.2rem; color: #555; margin-bottom: 30px; }
.construction { font-size: 28px; color: #ffcc00; font-weight: bold; margin-bottom: 20px; text-shadow: 1px 1px 5px rgba(0,0,0,0.2); animation: blink 1.5s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

/* ============================ Emergency Card =========================== */
.emergency-card {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  border-radius: 10px;
  background: linear-gradient(180deg,#fff7f7 0%,#fff1f1 100%);
  border: 1px solid rgba(255,0,0,0.12);
  box-shadow: 0 6px 16px rgba(255,0,0,0.04);
  font-family: system-ui;
  color: #3b2b2b;
  margin-top: 20px;
  transition: transform .12s ease, box-shadow .12s ease;
}
.emergency-card .icon { font-size: 20px; line-height:1; }
.emergency-card a { color:#b71c1c; font-weight:600; text-decoration:underline; }
.emergency-card:hover { transform: translateY(-2px); box-shadow:0 12px 30px rgba(183,28,28,0.08); }
footer {
  text-align: center;
  padding: 20px;
  background: #fff;
  box-shadow: 0 -4px 6px rgba(0,0,0,0.05);
  margin-top: 50px;
}
/* Responsive */
@media(max-width:768px){ nav{display:none; flex-direction:column;width:100%;gap:10px;margin-top:10px} nav.active{display:flex} .hamburger{display:flex} }
</style>
</head>
<body>

<!-- Header -->
<header>
  <div class="logo">Note Zilla</div>
  <div class="hamburger" onclick="toggleMenu(this)"><div></div><div></div><div></div></div>
  <nav>
    <a href="index.html">Home</a>
    <a href="#hero">Support</a>
    <a href="credit.html">About</a>
    <a href="#">Contact</a>
  </nav>
</header>

<!-- Back Button -->
<div style="text-align:center; margin-top:120px;">
  <a href="index.html" class="back">← Back to Home</a>
</div>

<!-- Hero Section -->
<section class="hero" id="hero">
  <h1>SUPPORT MATERIAL</h1>
  <p>For All Subjects</p>
  <div class="construction">🚧 Under Construction 🚧</div>

  <!-- Emergency Card -->
  <div class="emergency-card">
    <span class="icon">🚨</span>
    <div class="text">In Emergency Visit 
      <a href="https://edustud.nic.in/edu/support_material_2024_25.html" target="_blank" rel="noopener">Edudel</a>
    </div>
  </div>
</section>
<footer>
  <p>&copy; 2025 Note Zilla All Right Are Reserved</p>
  <a href="https://whatsapp.com/channel/0029Vb7CpvgAzNbwokB7KV0y"><img src="Images/Whatsapp.png"></a>
  <a href=""><img src="Images/instagram.jpeg"></a>
  <a href="https://t.me/+gxvgPedurnMyNTA1"><img src="Images/telegram.png"></a>
</footer>
<script>
function toggleMenu(element){
  const nav = document.querySelector('header nav');
  nav.classList.toggle('active');
  element.classList.toggle('open');
}
</script>
<!-- Read the Formbutton docs at formspree.io/formbutton/docs. See more examples at codepen.io/formspree -->
<script src="https://formspree.io/js/formbutton-v1.min.js" defer></script>
<script>
  /* paste this line in verbatim */
  window.formbutton=window.formbutton||function(){(formbutton.q=formbutton.q||[]).push(arguments)};
  /* customize formbutton below*/     
  formbutton("create", {
    action: "https://formspree.io/f/xeokweek",
    title: "How can we help?",
    fields: [
      { 
        type: "email", 
        label: "Email:", 
        name: "email",
        required: true,
        placeholder: "your@email.com"
      },
      {
        type: "textarea",
        label: "Message:",
        name: "message",
        placeholder: "What's on your mind?",
      },
      { type: "submit" }      
    ],
    styles: {
      title: {
        backgroundColor: "gray"
      },
      button: {
        backgroundColor: "gray"
      }
    }
  });
</script>
</body>
</html>
