<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Oops! Page Not Found</title>
  <meta name="description" content="The page you are looking for does not exist." />
  <script>
    // favicon.js
const link = document.createElement('link');
link.rel = 'icon';
link.type = 'image/png';
link.href = 'images/favicon.png'; // yahan apne icon ka naam likho
document.head.appendChild(link);

  </script>
</body>
  <style>
    :root{
      --bg-1: #0f1724;
      --bg-2: #081125;
      --accent: #7c3aed;
      --accent-2: #06b6d4;
      --muted: #a8b3c2;
      --glass: rgba(255,255,255,0.04);
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
    }

    *{box-sizing:border-box;}
    html, body{height:100%; margin:0;}
    body{
      background: radial-gradient(800px 400px at 10% 10%, rgba(124,58,237,0.12), transparent),
                  radial-gradient(600px 300px at 90% 90%, rgba(6,182,212,0.06), transparent),
                  linear-gradient(180deg,var(--bg-1),var(--bg-2));
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      color:#eef6ff;
    }

    .card{
      width:100%; max-width:600px;
      background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:16px;
      padding:32px;
      display:grid;
      gap:24px;
      box-shadow: 0 12px 40px rgba(2,6,23,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
      border:1px solid rgba(255,255,255,0.03);
      text-align:center;
    }

    .logo{
      display:flex; align-items:center; justify-content:center; gap:10px;
      margin-bottom:12px; font-weight:800; font-size:24px;
    }
    .logo svg{width:44px; height:44px;}

    h1{font-size:clamp(26px,5vw,40px); margin:0;}
    p.lead{color:var(--muted); font-size:16px; margin:0;}
    
    .btn-home{
      display:inline-block;
      padding:12px 24px;
      background:linear-gradient(90deg, var(--accent), var(--accent-2));
      color:white;
      font-weight:700;
      text-decoration:none;
      border-radius:10px;
      transition:0.3s;
    }
    .btn-home:hover{
      opacity:0.85;
    }

    footer{margin-top:24px; color:var(--muted); font-size:13px;}
  </style>
</head>
<body>
  <main class="card" role="main" aria-labelledby="error-heading">
    <div class="logo">
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
        </defs>
        <rect x="2" y="2" width="44" height="44" rx="10" fill="url(#g)" opacity="0.95"/>
        <path d="M14 30 L20 20 L28 26 L34 16" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
      </svg>
      Oops!
    </div>

    <h1 id="error-heading">404 - Page Not Found</h1>
    <p class="lead">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>

    <a class="btn-home" href="/">Back to Home</a>

    <footer>
      &copy; <span id="year"></span> NoteZilla — All rights reserved.
    </footer>
  </main>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
