<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Science Notes - NoteZilla</title>
  <link rel="icon" href="../Images/Favicon.png">
  <meta name="google-site-verification" content="C2-yDbzzyS4qMdBWgM3WARN6saZ1KX7ndHrd_Uc38mg" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary:#4e73df;
      --secondary:#1cc88a;
      --accent:#f6ad55;
      --bg:#f5f6fa;
      --text:#222;
    }

    *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

    body {
      background: var(--bg);
      min-height:100vh;
      color:var(--text);
      display:flex;
      flex-direction:column;
    }

    /* HEADER */
    header {
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:15px 50px;
      background:rgba(255,255,255,0.85);
      backdrop-filter: blur(10px);
      box-shadow:0 4px 8px rgba(0,0,0,0.15);
      position:sticky;top:0;z-index:100;
      border-bottom:2px solid rgba(78,115,223,0.2);
    }

    .logo {
      font-weight:900;
      font-size:1.8rem;
      background:linear-gradient(90deg,var(--primary),var(--secondary));
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      letter-spacing:1px;
    }

    nav {display:flex;align-items:center;gap:15px;}
    nav a {
      text-decoration:none;
      color:#333;
      font-weight:600;
      transition:color 0.2s;
    }
    nav a:hover {color:var(--primary);}
    .login-btn {
      background:var(--secondary);
      color:white;
      border:none;
      padding:8px 18px;
      border-radius:10px;
      cursor:pointer;
      font-weight:bold;
      transition:all 0.3s;
    }
    .login-btn:hover {background:#17a673;transform:scale(1.05);}
    .hamburger{display:none;flex-direction:column;cursor:pointer;gap:5px;}
    .hamburger div{width:25px;height:3px;background-color:#333;transition:all 0.3s;}
    @media(max-width:768px){
      nav{display:none;flex-direction:column;width:100%;gap:10px;margin-top:10px;}
      nav.active{display:flex;}
      .hamburger{display:flex;}
    }

    /* HERO */
    .hero {
      text-align:center;
      padding:80px 20px 50px;
      color:white;
      background:linear-gradient(120deg,rgba(78,115,223,0.8),rgba(28,200,138,0.8));
      border-radius:20px;
      margin:30px auto;
      width:90%;
      box-shadow:0 8px 20px rgba(0,0,0,0.2);
    }

    .hero h1 {
      font-size:3rem;
      font-weight:900;
      letter-spacing:1px;
    }
    .hero p {
      font-size:1.2rem;
      margin-top:10px;
      color:#f2f2f2;
    }

    /* SEARCH BAR */
    .search-container {
      display:flex;
      justify-content:center;
      margin:2rem auto;
      width:90%;
      max-width:600px;
    }
    .search-container input {
      width:100%;
      padding:12px 16px;
      border:2px solid var(--primary);
      border-radius:30px;
      font-size:1rem;
      outline:none;
      background:rgba(255,255,255,0.8);
      transition:0.3s;
      backdrop-filter:blur(5px);
    }
    .search-container input:focus {
      border-color:var(--secondary);
      box-shadow:0 0 8px var(--secondary);
    }

    /* CHAPTER CARDS */
    .subject-grid {
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:2rem;
      width:90%;
      margin:1rem auto 4rem;
    }

    .subject-card {
      background:rgba(255,255,255,0.7);
      border-radius:20px;
      box-shadow:0 5px 20px rgba(0,0,0,0.15);
      text-align:center;
      padding:2rem 1rem;
      transition:all 0.3s ease;
      cursor:pointer;
      position:relative;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      height:160px;
      backdrop-filter:blur(10px);
    }

    .subject-card:hover {
      transform:translateY(-5px) scale(1.03);
      box-shadow:0 10px 25px rgba(0,0,0,0.25);
    }

    .subject-card h2 {
      font-size:1.4rem;
      font-weight:700;
      color:var(--primary);
      z-index:1;
    }

    .subject-card p {
      font-size:0.95rem;
      color:#333;
      margin-top:0.6rem;
      z-index:1;
    }

    /* Loader */
    .loader {
      border:4px solid rgba(255,255,255,0.5);
      border-top:4px solid var(--primary);
      border-radius:50%;
      width:45px;
      height:45px;
      animation:spin 1s linear infinite;
    }

    @keyframes spin {
      0% {transform:rotate(0deg);}
      100% {transform:rotate(360deg);}
    }

    /* FOOTER */
    footer {
      background:rgba(255,255,255,0.9);
      color:#555;
      text-align:center;
      padding:1rem;
      font-size:0.9rem;
      box-shadow:0 -4px 6px rgba(0,0,0,0.05);
      border-top:2px solid rgba(78,115,223,0.2);
      backdrop-filter: blur(10px);
      margin-top:auto;
    }
    footer span {color:var(--primary);font-weight:600;}
  </style>
</head>
<body>

<header>
  <div class="logo">Note Zilla</div>
  <div class="hamburger" onclick="toggleMenu(this)"><div></div><div></div><div></div></div>
  <nav>
    <a href="../index.html">Home</a>
    <a href="#notes">Science Notes</a>
    <a href="../credit.html">About</a>
    <a href="../contact.html">Contact</a>
    <button class="login-btn"><a href="../login.html" style="color:white;text-decoration:none;">Login</a></button>
  </nav>
</header>

<section class="hero">
  <h1>Science Notes</h1>
  <p>Explore all Class IX chapters and key concepts in one place</p>
</section>

<div class="search-container">
  <input type="text" id="searchBar" placeholder="🔍 Search chapters...">
</div>

<section class="subject-grid" id="subjectGrid">
  <div class="subject-card"><div class="loader"></div></div>
  <div class="subject-card"><div class="loader"></div></div>
  <div class="subject-card"><div class="loader"></div></div>
</section>

<footer>
  © 2025 <span>NoteZilla</span> — All Rights Reserved
</footer>

<script>
function toggleMenu(el){
  document.querySelector('nav').classList.toggle('active');
  el.classList.toggle('open');
}

const sheetURL = "https://script.google.com/macros/s/AKfycbx6Yi6nb-biO1Qw9pz3_1FvCwOQNLEQvi-TUIjdgsF7b9kf8FPgqsH9fIZ4n-neAVhn/exec";
const subjectName = "Science";

fetch(sheetURL)
  .then(res => res.json())
  .then(data => {
    const subjectGrid = document.getElementById("subjectGrid");
    subjectGrid.innerHTML = '';
    const filtered = data.filter(d => d.Subject === subjectName);
    filtered.forEach(chap => {
      const card = document.createElement("div");
      card.className = "subject-card";
      card.innerHTML = `<h2>${chap["Chapter Name"]}</h2><p>${chap.Date}</p>`;
      card.addEventListener("click", () => {
        if(chap.Link && chap.Link.trim()!=="") window.open(chap.Link, "_blank");
        else alert("Link not available for this chapter.");
      });
      subjectGrid.appendChild(card);
    });
  })
  .catch(err => {
    const subjectGrid = document.getElementById("subjectGrid");
    subjectGrid.innerHTML = `<p style="text-align:center;color:red;">Failed to load chapters. Try again later.</p>`;
    console.error(err);
  });

const searchBar = document.getElementById("searchBar");
searchBar.addEventListener("keyup", () => {
  const value = searchBar.value.toLowerCase();
  document.querySelectorAll(".subject-card").forEach(card => {
    const text = card.querySelector("h2")?.innerText.toLowerCase() || "";
    card.style.display = text.includes(value) ? "flex" : "none";
  });
});
</script>
</body>
</html>
